<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M154 - Noções básicas de Cartografia [vídeo]","lang":"pt-BR","builderCredit":true,"toc":{"items":[]}},"blocks":[{"id":"bb6uvooc","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"b56f5n7i","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"bu2vs8sg","type":"mediaembed","props":{"type":"video","title":"Noções básicas de Cartografia aplicadas à Gestão de Imóveis Públicos","provider":"M154","url":"https://youtu.be/TGWB4pOIGqg"}}]},{"id":"bg9jx39v","type":"collapsiblesection","props":{"triggerLabel":"Mostrar/ocultar a transcrição","defaultOpen":true,"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"b_msuw92o1_3h74","type":"prose","props":{"html":"\u003cp>Confira abaixo a transcrição completa do vídeo.\u003c/p>"}},{"id":"cej90aqy","type":"collapsebreak","props":{}},{"id":"b4mpxoeg","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Quando pensamos em um imóvel público, podemos imaginar um terreno, uma edificação, uma ilha, uma área ocupada ou mesmo uma extensa gleba.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Mas, para gerir esses imóveis, não basta saber que eles existem.&nbsp;&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">É preciso saber onde estão, quais são seus limites, quanto medem e como se relacionam com o território ao seu redor.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cb>É aí que entra a cartografia.&nbsp;\u003c/b>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>O que é cartografia?&nbsp;\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A cartografia reúne conhecimentos, técnicas e ferramentas utilizados para representar espacialmente a superfície terrestre e as informações associadas a ela.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Na gestão de imóveis públicos, essas representações aparecem de muitas formas: em mapas, plantas, imagens aéreas ou de satélite, memoriais descritivos, sistemas de informação geográfica e outros documentos técnicos.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Por isso, compreender algumas noções básicas de cartografia é importante mesmo para quem não trabalha diretamente com levantamentos ou com a produção de mapas.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">O objetivo aqui não é formar especialistas em cartografia.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">É fornecer conhecimentos básicos para interpretar informações territoriais e reconhecer como elas são utilizadas na gestão patrimonial imobiliária.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Como representamos o território?&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Vamos começar por uma ideia simples.&nbsp;\u003c/span>\u003c/p>\u003cp>O território é extenso, complexo e tridimensional. Para analisá-lo, precisamos representá-lo de maneira reduzida e organizada.&nbsp;\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Nessas representações, diferentes elementos podem ser apresentados como pontos, linhas ou áreas.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Um ponto pode indicar, por exemplo, a localização de uma edificação.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Uma linha pode representar um limite, uma via ou um curso d'água.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">E uma área, representada por um polígono, pode delimitar um imóvel ou outro recorte territorial.&nbsp;\u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Esses elementos podem aparecer em diferentes tipos de representação.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Um mapa, por exemplo, pode representar uma área extensa e combinar informações como imóveis, limites administrativos, vias e hidrografia.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Uma planta normalmente representa uma área mais restrita e com maior nível de detalhe, como um terreno, uma edificação ou uma área objeto de determinado procedimento.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Já uma imagem aérea ou de satélite registra características visíveis da superfície e pode ajudar a reconhecer edificações, ocupações, vegetação, vias e transformações ocorridas no território.&nbsp;\u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">São formas diferentes de observar e representar uma mesma realidade territorial.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Escala — quanto do território estamos vendo?&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Toda representação cartográfica precisa lidar com uma questão: o território real é muito maior do que o espaço disponível em uma tela, folha ou documento.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">É daí que surge o conceito de escala.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A escala expressa a relação entre uma medida na representação e a medida correspondente no terreno.&nbsp;&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Uma planta de um imóvel, por exemplo, pode apresentar muitos detalhes de uma área relativamente pequena.&nbsp;&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Um mapa do Brasil representa uma área imensa, mas necessariamente com muito menos detalhe.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Isso significa que a escala interfere diretamente naquilo que conseguimos visualizar e analisar.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Na prática, nem todo mapa é adequado para qualquer finalidade.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Quando precisamos examinar os limites de um imóvel ou uma pequena ocupação, necessitamos de um nível de detalhe diferente daquele utilizado para observar a distribuição dos imóveis públicos em uma região inteira.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003c/span>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Medindo o território&nbsp;\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Além de representar o território, precisamos medi-lo.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Na gestão patrimonial, encontramos informações como distâncias, áreas, perímetros e, em determinadas situações, altitudes.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A distância indica o comprimento entre dois pontos.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">O perímetro corresponde ao comprimento do contorno de uma área.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A área expressa a extensão da superfície delimitada.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">E a altitude está relacionada à posição vertical de um ponto em relação aao nível do mar.&nbsp;\u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Essas informações aparecem com frequência em plantas, memoriais descritivos, cadastros e outros documentos técnicos relacionados aos imóveis.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Limites, vértices e perímetros&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Medir, porém, não é suficiente.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Precisamos também estabelecer onde começa e onde termina determinada área.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Os limites de um imóvel podem ser representados por linhas que conectam diferentes pontos, chamados de vértices.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A sequência desses vértices permite formar o perímetro que delimita espacialmente a área.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Em documentos técnicos, como memoriais descritivos, esses vértices podem ser identificados por coordenadas e relacionados por informações de direção e distância.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Assim, aquilo que aparece escrito em um documento pode ser relacionado à representação espacial do imóvel.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003c/span>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Coordenadas — como localizar um ponto?&nbsp;\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Mas como podemos indicar com precisão a localização de um ponto na superfície terrestre?&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Para isso utilizamos coordenadas.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Coordenadas são valores utilizados para determinar a posição de um ponto segundo determinado sistema.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Uma das formas mais conhecidas utiliza as chamadas coordenadas geográficas: latitude e longitude.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A latitude indica a posição em relação ao Equador.&nbsp;\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A longitude indica a posição em relação ao meridiano de referência.&nbsp;\u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A combinação das duas permite localizar um ponto na superfície terrestre.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">As coordenadas geográficas podem ser apresentadas em diferentes formatos, como graus decimais ou graus, minutos e segundos.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Por isso, ao encontrar coordenadas em documentos ou sistemas, é importante reconhecer também a maneira como elas estão expressas.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>O sistema UTM&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Além das coordenadas geográficas, é muito comum encontrarmos, em documentos técnicos relacionados a imóveis, coordenadas no sistema UTM — Universal Transversa de Mercator.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Para transformar a terra em um plano, podemos esticar e deformar o planeta, mas no lugar de tentar esticar o mundo inteiro de uma vez só, o sistema UTM divide a Terra em 60 fatias verticais estreitas, chamadas de Fusos (ou zonas).&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Cada fatia dessas é muito estreita (tem só 6 graus de largura). Como a fatia é \"fina\", ela é quase plana. Fica muito mais fácil desenhar um mapa super preciso de cada pedaço sem distorcer a realidade&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">O território brasileiro é atravessado por diferentes fusos UTM.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Dentro de cada um deles, as posições são normalmente expressas por duas componentes métricas: Leste e Norte, ou pelas siglas, que podem aparecer em português ou inglês: L (W)  e N (N).&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Isso facilita a utilização de medidas em metros em diversas atividades técnicas.&nbsp;\u003c/span>\u003c/p>\u003cp>Por isso, um conjunto de números isolado nem sempre é suficiente para identificar corretamente uma localização.&nbsp;\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">É necessário conhecer também o sistema utilizado, o fuso correspondente e o sistema de referência adotado.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan data-fs=\"h3\">Sistema de referência e datum\u003c/span>&nbsp;\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Chegamos, então, a outro conceito importante: o sistema de referência.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A Terra não é plana e sua forma também não corresponde exatamente a uma esfera.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Para determinar posições sobre sua superfície, precisamos utilizar modelos e referenciais que permitam relacionar as coordenadas a posições no mundo real.&nbsp;&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">É nesse contexto que aparece o conceito de datum geodésico.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">O datum integra o referencial utilizado para definir a posição dos pontos representados.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan data-fs=\"h3\">SIRGAS2000 e outros referenciais&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">No Brasil, o sistema geodésico de referência oficialmente adotado é o SIRGAS2000 — Sistema de Referência Geocêntrico para as Américas.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Em documentos produzidos em períodos anteriores, entretanto, podemos encontrar outros referenciais, como Córrego Alegre e SAD69.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Também é comum encontrar o WGS84, um referencial global amplamente utilizado em sistemas de posicionamento por satélite, como o Google Earth.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Esses nomes podem aparecer em plantas, memoriais, bases cartográficas e sistemas.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Mais importante do que memorizar cada um deles é compreender que as coordenadas precisam estar associadas a um sistema de referência.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Por que conhecer o sistema de referência?&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Por que essa informação é importante?&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Porque uma coordenada não deve ser interpretada isoladamente.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A posição representada depende também do sistema de coordenadas e do referencial utilizado.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Assim, quando encontramos coordenadas em uma planta, um memorial ou uma base de dados, não devemos olhar apenas para os números.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Precisamos saber como aquela localização foi representada.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Essa informação é particularmente importante quando precisamos combinar dados produzidos em fontes ou momentos diferentes.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan data-fs=\"h3\">Azimute e distância&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Outros dois conceitos encontrados em documentos técnicos são azimute e distância.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">O azimute expressa uma direção por meio de um ângulo medido a partir do norte até a direção de referência.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A distância indica o comprimento entre dois pontos. J\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">untos, esses elementos podem ser utilizados para descrever os segmentos que conectam os diferentes vértices e formam o perímetro de uma área.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan data-fs=\"h4\">\u003cspan data-fs=\"h3\">Planimetria e planialtimetria&nbsp;\u003c/span>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Os levantamentos realizados para conhecer as características de uma área podem considerar diferentes dimensões do terreno.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Nos levantamentos planimétricos, são consideradas principalmente as posições e medidas no plano horizontal.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Já os levantamentos planialtimétricos incorporam também informações relacionadas às diferenças de nível e ao relevo.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Esses levantamentos podem produzir informações utilizadas em plantas, mapas e outros documentos técnicos.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Para quem atua na gestão patrimonial, mais importante do que dominar as técnicas utilizadas para realizá-los é saber reconhecer as informações produzidas e compreender o que elas representam.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Da informação territorial à geoinformação&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Até aqui falamos de pontos, linhas, áreas, limites, medidas e coordenadas.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Mas essas informações tornam-se ainda mais úteis quando podemos associá-las a outros dados sobre o território.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Imagine um imóvel público representado em um mapa.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Além de sua localização e de seus limites, podemos associar a ele informações como identificação, área, tipo de uso, situação de ocupação, destinação ou outras características relevantes para a gestão.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Quando uma informação pode ser relacionada a uma posição ou área no território, passamos a trabalhar com informação geográfica, ou geoinformação.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cspan data-fs=\"h3\">Sistemas de Informações Geográficas — SIG&nbsp;\u003c/span>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Para organizar e trabalhar com grandes conjuntos de informações geográficas, podemos utilizar os Sistemas de Informações Geográficas, conhecidos pela sigla SIG ou em inglês GIS.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Esses sistemas permitem armazenar, visualizar, combinar e analisar informações segundo sua localização no território.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Uma de suas características mais conhecidas é a organização das informações em camadas.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Podemos ter, por exemplo, uma camada com imóveis públicos, outra com vias, outra com hidrografia, limites administrativos, áreas protegidas ou ocupações.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Quando combinamos essas informações, podemos observar relações espaciais que dificilmente seriam percebidas analisando cada dado isoladamente.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Os SIGs mais famosos são QGis e ArcGis.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan data-fs=\"h3\">O que tudo isso tem a ver com a gestão patrimonial?&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Agora podemos voltar à pergunta inicial.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Por que essas noções de cartografia são importantes para quem trabalha com imóveis públicos?&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Porque a gestão patrimonial acontece, em grande medida, sobre o território.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Identificar e caracterizar um imóvel exige compreender sua localização, suas dimensões e seus limites.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Atividades relacionadas à incorporação e à regularização patrimonial dependem da correta identificação das áreas envolvidas.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A avaliação de um imóvel considera características do próprio bem e de sua localização.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A destinação exige compreender o imóvel, seu entorno e as possibilidades de uso.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">E as atividades de controle e fiscalização também dependem da capacidade de localizar áreas, identificar ocupações e acompanhar transformações no território.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Informação territorial e integração da gestão&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Por isso, a cartografia não deve ser entendida apenas como uma técnica para produzir mapas.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Ela oferece recursos para representar, localizar, medir e interpretar o território.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Quando essas informações são organizadas e relacionadas a outros dados patrimoniais, tornam-se também instrumentos de integração da gestão.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Uma localização corretamente representada pode ser utilizada em diferentes documentos, cadastros, análises e sistemas.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Isso favorece uma visão mais integrada dos imóveis públicos e permite relacionar informações produzidas em diferentes atividades da gestão patrimonial.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan data-fs=\"h3\">Para concluir\u003c/span>&nbsp;\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Neste vídeo, conhecemos algumas noções fundamentais para compreender a representação do território.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Vimos que pontos, linhas e polígonos permitem representar diferentes elementos espaciais.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Conhecemos a importância da escala e de medidas como distância, perímetro, área e altitude.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Vimos também como coordenadas permitem localizar pontos e por que precisamos conhecer os sistemas de coordenadas e de referência utilizados.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Falamos ainda de azimute, de levantamentos planimétricos e planialtimétricos e chegamos ao conceito de geoinformação e aos Sistemas de Informações Geográficas.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Você não precisa memorizar todos esses termos técnicos neste primeiro contato.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">O mais importante é reconhecer o que eles representam e perceber onde aparecem no cotidiano da gestão patrimonial.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Uma planta, um mapa, uma coordenada ou uma área exibida em um sistema são diferentes maneiras de traduzir o território em informação.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">E compreender essa informação é uma competência básica para quem atua na gestão de imóveis públicos.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Porque conhecer o patrimônio também significa saber onde ele está, como se organiza no território e como as informações sobre ele podem ser utilizadas de forma integrada na gestão pública.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">&nbsp;\u003c/span>\u003c/p>"}}]},{"id":"bxq5rodj","type":"pagefooter","props":{"code":"Noções básicas de Cartografia aplicadas à Gestão de Imóveis Públicos [M154]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Conteúdo/Roteiro","name":"Daniel Fonseca"},{"role":"Revisão","name":"Claudson Moreira"},{"role":"Design e Edição do vídeo","name":"Luís Henrique Lindner"},{"role":"Versão","name":"Julho de 2026"}]}}]}</script>

<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');
    var allowed = ['STRONG','B','EM','I','BR','P','SPAN'];
    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
