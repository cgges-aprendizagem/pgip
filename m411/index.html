<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M411 - A função socioambiental dos imóveis públicos","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"bhauz8uh","text":"Sobre o manual","hidden":false},{"id":"cjpjvsej","text":"O que significa função socioambiental? ","hidden":false}]}},"blocks":[{"id":"bz5clsam","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bn913j0t","type":"hero","props":{"kicker":"Fundamentos. estratégias e instrumentos de destinação patrimonial","kickerIcon":"compass","title":"A função socioambiental dos imóveis públicos","byline":"Manual de Regularização Fundiária em Terras da União","slot":"bn913j0t__slot"}},{"id":"bt71qcej","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"bhauz8uh","type":"titulo","props":{"text":"Sobre o manual","level":"h2"}},{"id":"b1qf3sm2","type":"prose","props":{"html":"\u003cp>Como resultado de um longo processo de aprendizado foi elaborado pela \u003cb>Secretaria do Patrimônio da União\u003c/b>, no ano de 2006, o \u003cb>\u003cmark data-hl=\"terra\">\u003ca href=\"https://memoria-spu.gestao.gov.br/publicacoes-e-relatorios-institucionais/manual-de-regularizacao-fundiaria-em-terras-da-uniao/\">Manual de Regularização Fundiária em Terras da União\u003c/a>\u003c/mark>\u003c/b>, com a finalidade de oferecer subsídios, diretrizes e recomendações a agentes públicos, especialistas, lideranças civis e demais atores envolvidos na promoção da inclusão socioterritorial e na defesa do patrimônio público do Brasil.\u003c/p>"}},{"id":"b47mx4jg","type":"figure","props":{"slot":"b47mx4jg__slot","src":"","fit":"contain","size":"full","title":"Manual de Regularização Fundiária em Terras da União","caption":"\u003ca href=\"https://memoria-spu.gestao.gov.br/publicacoes-e-relatorios-institucionais/manual-de-regularizacao-fundiaria-em-terras-da-uniao/\">Clique aqui para acessar o material na íntegra\u003c/a>&nbsp;","credit":"","__pullDown":false}},{"id":"b_ms3my3xg_pash","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Embora os capítulos B1 e B2 do Manual sejam redigidos com foco específico nos bens imóveis da \u003c/span>\u003cb style=\"text-wrap-mode: initial;\">União\u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">, os \u003c/span>\u003cb style=\"text-wrap-mode: initial;\">princípios legais e constitucionais apresentados \u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">neles se aplicam a \u003c/span>\u003cb style=\"text-wrap-mode: initial;\">qualquer ente da federação\u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\"> (Estados, Distrito Federal e Municípios). Isso ocorre pelos seguintes motivos detalhados nos textos:\u003c/span>\u003c/p>"}},{"id":"bwk3tg4x","type":"feature","props":{"columns":1,"card":true,"accent":"var(--terra-500)","layout":"side","items":[{"icon":"scale","title":"Princípio Constitucional Universal","text":"\u003cspan data-fs=\"body\">O capítulo B1 esclarece que, com a promulgação da Constituição Federal de 1988, \u003cb>toda propriedade - seja ela pública ou privada - passou a ter o dever de cumprir uma função social.\u003c/b> O cumprimento dessa função está associado às responsabilidades e obrigações do Estado brasileiro como um todo para com a sociedade. Portanto, usar bens públicos para promover a justiça social, garantir o direito à moradia e fomentar o desenvolvimento local é uma meta aplicável aos patrimônios estaduais e municipais também.\u003c/span>"},{"icon":"notebook-pen","title":"Aplicação do Estatuto da Cidade","text":"\u003cspan data-fs=\"body\">O capítulo B2 detalha que o cumprimento da função socioambiental exige a interpretação integrada da legislação urbana e ambiental. Para verificar o uso adequado da propriedade urbana pública, deve ser aplicado o \u003cb>Estatuto da Cidade\u003c/b>, que estabelece exigências fundamentais de ordenação e diretrizes gerais que proíbem a retenção especulativa e exigem o respeito ao direito a cidades sustentáveis. Essas são leis federais que regem a política urbana em todo o território nacional, independentemente de quem seja o titular da terra pública.\u003c/span>"},{"icon":"pencil-ruler","title":"Subordinação ao Plano Diretor Municipal","text":"\u003cspan data-fs=\"body\">O texto reforça que é o \u003cb>Plano Diretor do Município\u003c/b> que define o conteúdo da função social da propriedade. O uso de bens imóveis inseridos no território do município, independentemente de qual ente federativo seja o proprietário, deverá \u003cb>sempre observar as diretrizes do Plano Diretor\u003c/b>.\u003c/span>"},{"icon":"handshake","title":"Cooperação Obrigatória","text":"\u003cspan data-fs=\"body\">O manual ainda destaca em sua seção de gestão compartilhada que a cooperação entre os governos para garantir a função social da propriedade é uma diretriz geral do Estatuto da Cidade e, portanto, é\u003cb> obrigatória para a União, Estados, Distrito Federal e Municípios.\u003c/b>\u003c/span>\u003cb>\u003c/b>"}]}},{"id":"bwgy56mh","type":"prose","props":{"html":"\u003cp>Em suma, as \"trilhas\" e os marcos legais apresentados nos capítulos B1 e B2 refletem o paradigma jurídico-urbanístico brasileiro que obriga todos os entes federativos a darem um destino socioambiental adequado aos seus respectivos patrimônios imobiliários.\u003c/p>"}}]},{"id":"by0h729e","type":"section","props":{"width":"content","surface":"dark","pad":"lg"},"children":[{"id":"cjpjvsej","type":"titulo","props":{"text":"O que significa função socioambiental? ","level":"h2"}},{"id":"cpkkzmgy","type":"prose","props":{"html":"\u003cp>A função socioambiental dos imóveis públicos corresponde à obrigação de utilizar o patrimônio estatal em benefício da coletividade. Ela se concretiza quando os imóveis públicos contribuem para a promoção de direitos, a proteção ambiental, o desenvolvimento territorial, a inclusão social, a preservação cultural ou a geração de valor econômico para a sociedade. \u003c/p>"}},{"id":"bekv9g9x","type":"examplecard","props":{"label":"Exemplo prático","icon":"map-pin","color":"","slot":"bekv9g9x__slot","collapse":"none","title":"A experiência da União ","children":"\u003cp>A aplicação do conceito de função socioambiental ganhou destaque na gestão dos imóveis da União a partir dos anos 2000, quando a Secretaria do Patrimônio da União passou a incorporar de forma mais explícita objetivos relacionados à regularização fundiária, habitação de interesse social, proteção ambiental, desenvolvimento territorial e apoio a políticas públicas. \u003c/p>\u003cp>Essa experiência contribuiu para consolidar uma visão mais ampla do patrimônio público como instrumento de desenvolvimento, cidadania e sustentabilidade, influenciando debates e iniciativas em diferentes esferas da administração pública brasileira.\u003c/p>"}},{"id":"bx6sr0q3","type":"markerlist","props":{"variant":"icon","icon":"link","accent":"var(--slate-200)","items":[{"title":"Manual de Regularização Fundiária em Terras da União","text":"\u003ca href=\"https://memoria-spu.gestao.gov.br/publicacoes-e-relatorios-institucionais/manual-de-regularizacao-fundiaria-em-terras-da-uniao/\" data-btn=\"secondary\">Clique aqui para acessar o material\u003c/a>"}]}}]},{"id":"bbo8ndwj","type":"pagefooter","props":{"code":"A função socioambiental dos imóveis públicos [M411]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Resumo","name":"Angélia Faddoul&nbsp;"},{"role":"Versão","name":"Julho de 2026"}]}}]}</script>

<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('title') || el.getAttribute('data-definition') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('span').textContent = def;
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
