<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M411 - A função socioambiental dos imóveis públicos","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"cxtfevyw","text":"Para que servem os imóveis públicos?","hidden":false},{"id":"cci6d6r3","text":"Trilhas para o cumprimento da função socioambiental dos imóveis públicos","hidden":false},{"id":"cyim4qqz","text":"Respeito ao Estatuto da Cidade","hidden":false},{"id":"cqk990rr","text":"Aplicação do Plano Diretor do Município","hidden":false}]}},"blocks":[{"id":"bnixbstj","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bdeyyyr7","type":"hero","props":{"kicker":"Fundamentos. estratégias e instrumentos de destinação patrimonial","kickerIcon":"compass","title":"A função socioambiental dos imóveis públicos","byline":"o patrimônio estatal em benefício da coletividade","slot":"bdeyyyr7__slot"}},{"id":"bprz05wb","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cxtfevyw","type":"titulo","props":{"text":"Para que servem os imóveis públicos?","level":"h2"}},{"id":"cmdroyt7","type":"prose","props":{"html":"\u003cp>A Constituição Federal de 1988 introduziu um novo paradigma para a propriedade no Brasil. A partir dela, toda propriedade, pública ou privada, passou a estar associada ao cumprimento de uma função social.\u003c/p>\u003cp>Esse entendimento representa uma mudança significativa em relação à concepção tradicional da propriedade, historicamente associada ao uso exclusivo de seu titular. No novo modelo constitucional, o exercício do direito de propriedade deve contribuir para a promoção do bem coletivo, a redução das desigualdades sociais, a proteção ambiental e o desenvolvimento sustentável.\u003c/p>\u003cp>No caso dos imóveis públicos, essa responsabilidade é ainda mais evidente. Os bens pertencentes ao Estado (União, Estados, Distrito Federal e municípios) não existem apenas para abrigar atividades administrativas ou compor o patrimônio governamental. \u003cmark>Sua utilização deve estar orientada ao atendimento do interesse público e à produção de benefícios para a sociedade.\u003c/mark>\u003c/p>\u003cp>O cumprimento da \u003cb>função social\u003c/b> de uma propriedade pública deve estar associado às responsabilidades e obrigações do Estado brasileiro para com a sociedade. Assim, a destinação e o uso dos bens públicos têm como objetivo contribuir para a redução das desigualdades sociais e territoriais e a promoção da justiça social, garantindo o direito à moradia, bem como a geração de postos de trabalho e o incremento ao desenvolvimento local.\u003c/p>\u003cp>Somando-se ao princípio constitucional, todos os bens públicos, quer se localizem em área rural ou urbana, qualquer que seja sua destinação, devem ser utilizados de forma a priorizar o uso socioambiental dos bens em benefício da coletividade, levando em consideração as grandes diferenças regionais, sociais, econômicas e culturais entre os diversos segmentos da sociedade brasileira.\u003c/p>"}},{"id":"b0lq19fp","type":"callout","props":{"variant":"header","tone":"info","icon":"lightbulb","title":"função socioambiental","heading":"","children":"\u003cp>A \u003cb>função socioambiental dos imóveis públicos\u003c/b> corresponde à obrigação de utilizar o patrimônio estatal em benefício da coletividade. Ela se concretiza quando os imóveis públicos contribuem para a promoção de direitos, a proteção ambiental, o desenvolvimento territorial, a inclusão social, a preservação cultural ou a geração de valor econômico para a sociedade.\u003c/p>"}},{"id":"bew9m66e","type":"titulo","props":{"text":"Exemplos de formas de cumprimento da função socioambiental dos bens públicos","level":"h3"}},{"id":"bytk17f1","type":"kicker","props":{"icon":"bookmark","children":""}},{"id":"bzfkheek","type":"feature","props":{"columns":2,"card":true,"accent":"var(--terra-600)","layout":"side","items":[{"icon":"building","title":"","text":"Reconhecimento do direito à moradia de grupos sociais que estejam ocupando áreas públicas consolidadas como assentamentos urbanos, regularizando a posse da terra."},{"icon":"factory","title":"","text":"Destinação, de forma gratuita ou onerosa, de imóveis públicos urbanos para instalação de equipamentos que gerem postos de trabalho e promovam o desenvolvimento local e regional."},{"icon":"building-2","title":"","text":"Destinação de imóveis urbanos não utilizados e subutilizados para habitação de interesse social."},{"icon":"trees","title":"","text":"Destinação de áreas para a preservação do meio ambiente e dos recursos naturais, inclusive para a garantia do sustento das populações tradicionais."},{"icon":"sprout","title":"","text":"Reconhecimento do direito à terra da população dos assentamentos rurais consolidados, regularização a possa da terra."},{"icon":"drama","title":"","text":"Destinação de áreas para garantir o direito ao lazer, à cultura e manifestações culturais."},{"icon":"apple","title":"","text":"Destinação de áreas públicas rurais para fins de reforma agrária e agricultura familiar."},{"icon":"hospital","title":"","text":"Disponibilização de imóveis para sediar os serviços públicos."},{"icon":"school","title":"","text":"Destinação de forma gratuita ou onerosa, de imóveis públicos urbanos para instalação de equipamentos que promovam o desenvolvimento local e regional."},{"icon":"circle-dollar-sign","title":"","text":"Identificação de imóveis com vocação estritamente voltada ao mercado imobiliário passíveis de serem colocadas no mercado como efeito regulatório, com vocação arrecadadora, para subsidiar projetos de interesse social."}]}}]},{"id":"bwwtlzoh","type":"section","props":{"width":"content","surface":"dark","pad":"lg"},"children":[{"id":"cci6d6r3","type":"titulo","props":{"text":"Trilhas para o cumprimento da função socioambiental dos imóveis públicos","level":"h2"}},{"id":"bx29clna","type":"titulo","props":{"text":"Interpretação conjunta e integrada da legislação urbana e ambiental","level":"h3"}},{"id":"cz59vng4","type":"prose","props":{"html":"\u003cp>O cumprimento da função socioambiental dos imóveis públicos está vinculado ao uso e destinação destes bens de forma a proteger e reconhecer os direitos de diversos segmento da sociedade brasileira e, ao mesmo tempo, proteger o meio ambiente. Esses direitos são, por exemplo, o direito à moradia e à terra urbana e rural, bem como os direitos culturais da população. Portanto, para identificar o uso e destinação mais adequados dos bens imóveis públicos deve ser feita uma leitura conjugada e integrada da necessidade de proteger os direitos socioambientais com a legislação que trata do desenvolvimento urbano, da proteção ambiental, da política fundiária e do ordenamento territorial. Esses instrumentos definem critérios para o uso e ocupação do solo, para a proteção dos recursos naturais e para a promoção do desenvolvimento sustentável.\u003c/p>\u003cp>No âmbito da propriedade rural, especificamente, o cumprimento da função social da propriedade está expresso na contabilização do uso das terras públicas e devolutas com a política agrícola e com o Plano Nacional de Reforma Agrária, bem como com as políticas de turismo, especialmente ecoturismo.\u003c/p>\u003cp>Além disso, a função social da propriedade rural será garantida quando:\u003c/p>\u003cp>\u003col>\u003cli>&nbsp;houver um aproveitamento racional e adequado;\u003c/li>\u003cli>for utilizado adequadamente os recursos naturais disponíveis e dor preservado o meio ambiente;\u003c/li>\u003cli>forem observadas as disposições que regulam as relações de trabalho;\u003c/li>\u003cli>houver uma exploração que favoreça tanto o bem-estar dos proprietários como dos trabalhadores.\u003c/li>\u003c/ol>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Esta leitura e interpretação abrangem o Estatuto da Cidade, a legislação ambiental, os instrumentos de política fundiária e os Planos Diretores Municipais. Esses instrumentos permitem que a utilização dos imóveis públicos seja orientada por objetivos coletivos e alinhada às estratégias de desenvolvimento definidas pela sociedade.\u003c/span>\u003c/p>"}}]},{"id":"bj60xi3g","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"cyim4qqz","type":"titulo","props":{"text":"Respeito ao Estatuto da Cidade","level":"h2"}},{"id":"c1bnxno6","type":"prose","props":{"html":"\u003cp>Para verificar o uso e destinação mais adequados dos bens imóveis públicos, principalmente da propriedade urbana pública, deve ser aplicado o Estatuto da Cidade, que contém requisitos para a propriedade urbana cumprir a sua função social, tais como:\u003c/p>"}},{"id":"b1e991pb","type":"feature","props":{"columns":3,"card":true,"accent":"var(--terra-500)","layout":"top","items":[{"icon":"book-open-text","title":"","text":"Atender às exigências fundamentais de ordenação da cidade expressa no Plano Diretor."},{"icon":"users-round","title":"","text":"Assegurar o atendimento das necessidades dos cidadãos quanto à qualidade de vida, à justiça social e ao desenvolvimento das atividades econômicas."},{"icon":"building-2","title":"","text":"Respeitar as diretrizes gerais da política urbana estabelecidas pelo Estatuto da Cidade."}]}},{"id":"b7pl8axl","type":"panel","props":{"variant":"box","kicker":"uso e destinação","kickerIcon":"map-pin","title":"","color":"","bg":"var(--cloud-100)","body":"\u003cp>Sobre estas diretrizes gerais, vale destacar que a propriedade urbana pública, conforme expresso no Estatuto da Cidade, cumpre a sua função social quanto o seu uso e destinação:\u003c/p>"},"children":[{"id":"bfu31t0i","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b4yuyn5j","type":"markerlist","props":{"variant":"check","icon":"check","accent":"","items":[{"title":"","text":"Respeitam o direito às cidades sustentáveis que compreende o direito à terra urbana, à moradia, ao saneamento ambiental, à infraestrutura urbana, ao transporte e aos serviços públicos, ao trabalho e ao lazer;"},{"title":"","text":"Respeitam os planos, programas e projetos de desenvolvimento urbano definidos pela população e associações representativas dos vários segmentos da comunidade por meio dos instrumentos da gestão democrática da cidade;"},{"title":"","text":"Não resultam na sua utilização inadequada gerando usos incompatíveis e inconvenientes;"},{"title":"","text":"Não ocasionam parcelamento do solo, edificação ou o uso excessivo ou inadequado em relação à infraestrutura urbana;"},{"title":"","text":"Não geram instalação de empreendimentos ou atividades que possam funcionar como pólos geradores de tráfego, sem a previsão da infraestrurua correspondente;"}]}},{"id":"b_msi9p4bh_6ktf","type":"markerlist","props":{"variant":"check","icon":"check","accent":"","items":[{"title":"","text":"Eliminam a retenção especulativa de imóvel urbano, que resulta na sua subutilização ou não utilização;"},{"title":"","text":"Respeitam os planos, programas e projetos de desenvolvimento urbano definidos pela população e associações representativas dos vários segmentos da comunidade por meio dos instrumentos da gestão democrática da cidade;"},{"title":"","text":"Não resultam na deterioração das áreas urbanizadas e a poluição e degradação ambiental;"},{"title":"","text":"Resultam na proteção, preservação e recuperação do meio ambiente natural e construído, do patrimônio cultural, histórico, artístico, paisagístico e arqueológico;"},{"title":"","text":"Resultam na regularização fundiária e urbanização de áreas ocupadas por população de baixa renda mediante o estabelecimento de normas especiais de urbanização, uso e ocupação do solo e edificação, consideradas a situação socioeconômica e as normas ambientais."}]}}]}]}]},{"id":"bb7r2h4d","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"cqk990rr","type":"titulo","props":{"text":"Aplicação do Plano Diretor do Município","level":"h2"}},{"id":"cxcdtoq4","type":"prose","props":{"html":"\u003cp>De acordo com a Constituição Federal, é o Plano Diretor que define o conteúdo da função social da propriedade urbana. Ele é aprovado por lei municipal e determina o planejamento territorial dos municípios para os dez anos subsequentes, abrangendo tanto a área urbana com a área rural. \u003c/p>\u003cp>Ou seja, o que dá o significado concreto para a função social da propriedade em cada cidade é o Plano Diretor, regulamentando o tipo de uso que poderá ser dado em cada imóvel, o potencial construtivo em cada região das cidades, as áreas de expensão urbana, as áreas de proteção ambiental, as zonas de interesse social, entre outras regulamentações.\u003c/p>\u003cp>Mais do que um documento técnico, o Plano Diretor representa um pacto social construído pela comunidade local sobre o futuro do território. É nele que são estabelecidas as diretrizes para o uso e ocupação do solo, a proteção ambiental, a mobilidade urbana, a habitação, a infraestrutura e o desenvolvimento econômico.\u003c/p>\u003cp>Ao definir a destinação social, econômica e ambiental de cada parte do território do Municípios, o Plano Diretor garante terra urbana adequada para todas as atividades e para todos os segmentos sociais e prevê a utilização dos vazios urbanos (imóveis não utilizados ou subutilizados), bem como espaço para circulação, áreas para habitação popular, as áreas ocupadas por população de baixa renda passíveis de regularização etc.\u003c/p>"}},{"id":"bennul7c","type":"callout","props":{"variant":"header","tone":"warning","icon":"lightbulb","title":"Você sabia?","heading":"","children":"\u003cp>Dada a sua importância, o Plano Diretor é obrigatório para as cidades:\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Com mais de 20 mil habitantes.\u003c/li>\u003cli>Pertencentes a regiões metropolitanas e aglomerados urbanos.\u003c/li>\u003cli>Em áreas de influência de empreendimentos com significativo impacto ambiental.\u003c/li>\u003cli>Que queiram aplicar os instrumentos de parcelamento, edificação e utilização compulsórios, IPTU progressivo no tempo e desapropriação sanção.\u003c/li>\u003c/ul>\u003cp>\u003c/p>"}},{"id":"banl3nhe","type":"prose","props":{"html":"\u003cp>Tendo em vista a grande importância do Plano Diretor para a ordenação do território dos Municípios, o Estatuto da Cidade determina que a \u003cb>participação popular é obrigatória\u003c/b> em seu processo de elaboração e aprovação. Trata-se de uma nova visão do planejamento urbano que rompe com a concepção tradicional de que lei deve ser elaborada somente por técnicos. A partir de então, se reconhece o papel fundamental a ser desempenhado pela sociedade civil, especialmente por meio das associações comunitárias, cooperativas e movimentos populares na construção do futuro das cidades. Os prefeitos, inclusive, podem incorrer em improbidade administrativa se não respeitarem a participação popular e a publicidade nos processos de elaboração do Plano Diretor.\u003c/p>\u003cp>O que a Constituição Federal de 1988 e o Estatuto da Cidade fizeram foi inserir a definição do direito da propriedade num processo político. Não há, portanto, um conteúdo prévio do direito da propriedade. É o processo político de elaboração das leis urbanísticas que vai determinar o conteúdo desse direito. E é a legislação urbanística e ambiental, sobretudo a de âmbito local e especialmente por meio do Plano Diretor Municipal, que vai dizer quando, em que condições e em que medida a propriedade pública (assim como a privada) cumpre sua função social.\u003c/p>\u003cp>Neste contexto, toda e qualquer lei urbanística e ambiental no Brasil – seja a lei dos perímetros municipais, a lei do zoneamento territorial e, sobretudo, a lei do Plano Diretor – tem a função de instituir o paradigma da função social da propriedade e da cidade. Esse é o grande momento do encontro entre interesse individuais e coletivos no território municipal.\u003c/p>\u003cp>Sendo assim, a utilização dos bens imóveis públicos, inseridos no âmbito do território do Município, deverá, sempre, observar as diretrizes do Plano Diretor.\u003c/p>"}},{"id":"byhqb27d","type":"examplecard","props":{"label":"A experiência da UNIÃO","icon":"map-pin","color":"","slot":"byhqb27d__slot","collapse":"none","title":"","children":"\u003cp>A aplicação do conceito de função socioambiental ganhou destaque na gestão dos imóveis da União a partir dos anos 2000, quando a Secretaria do Patrimônio da União passou a incorporar de forma mais explícita objetivos relacionados à regularização fundiária, habitação de interesse social, proteção ambiental, desenvolvimento territorial e apoio a políticas públicas.\u003c/p>\u003cp>Essa experiência contribuiu para consolidar uma visão mais ampla do patrimônio público como instrumento de desenvolvimento, cidadania e sustentabilidade, influenciando debates e iniciativas em diferentes esferas da administração pública brasileira.\u003c/p>"}}]},{"id":"bzqn09m7","type":"pagefooter","props":{"code":"A função socioambiental dos imóveis públicos [M411]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"FOnte","name":"Adaptado dos capítulos B1 e B2 do \u003ca href=\"https://memoria-spu.gestao.gov.br/publicacoes-e-relatorios-institucionais/manual-de-regularizacao-fundiaria-em-terras-da-uniao/\">\u003cspan data-color=\"light\">Manual de Regularização Fundiária em Terras da União\u003c/span>\u003c/a> (Secretaria do Patrimônio da União – SPU, 2006)."},{"role":"adaptação","name":"Claudson Moreira"},{"role":"Design Educacional","name":"Luís Henrique Lindner"},{"role":"Versão","name":"Agosto de 2026"}]}}]}</script>

        var eras = Array.isArray(props.eras) ? props.eras.map(function(era){
          if(!era || typeof era !== 'object' || Array.isArray(era) || !Array.isArray(era.milestones)) return era;
          return Object.assign({}, era, {
            milestones: era.milestones.map(function(milestone){
              if(!milestone || typeof milestone !== 'object' || Array.isArray(milestone) || !Array.isArray(milestone.blocks) || !milestone.blocks.length) return milestone;
              return Object.assign({}, milestone, {
                content: React.createElement(React.Fragment, null,
                  block(milestone.content),
                  React.createElement('div', { className:'spu-embedded-blocks' }, milestone.blocks.map(function(nested, index){
                    return React.createElement(NS.BlockView, { key:nested.id || index, block:nested, mode:'preview' });
                  }))
                )
              });
            })
          });
        }) : props.eras;
        return React.createElement(Timeline, Object.assign({}, props, { eras:eras }));
      };
    }
    NS.__spuBuilderCompat = true;
  };
})();</script>
<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('title') || el.getAttribute('data-definition') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('span').textContent = def;
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
