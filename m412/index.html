<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M412 - Regimes de destinação","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"cj0v7ccm","text":"Regimes de direito real","hidden":false},{"id":"cg0c6djy","text":"Regimes de direito pessoal ou obrigacional","hidden":false},{"id":"cymwxnnb","text":"Regimes de outorga administrativa","hidden":false}]}},"blocks":[{"id":"br7sokuo","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bl7l2qcs","type":"hero","props":{"kicker":"Regimes de destinação","kickerIcon":"map-pinned","title":"Como o Estado atribui função aos imóveis públicos","byline":"um guia dos regimes de destinação","slot":"bl7l2qcs__slot"}},{"id":"bqu21bkv","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c2bph20x","type":"prose","props":{"html":"\u003cp>Os imóveis públicos podem ser utilizados para as mais diversas finalidades: sediar órgãos governamentais, apoiar políticas públicas, promover regularização fundiária, viabilizar empreendimentos econômicos, proteger comunidades tradicionais, gerar receitas ou mesmo ser transferidos definitivamente a outros entes ou particulares. Embora essas situações sejam frequentemente tratadas de forma genérica como “destinações”, elas envolvem relações jurídicas bastante distintas, com diferentes níveis de estabilidade, direitos conferidos aos destinatários, formas de remuneração, prazos, possibilidades de revogação e requisitos legais.\u003c/p>\u003cp>Compreender essas diferenças é fundamental para selecionar o mecanismo mais adequado a cada contexto e garantir segurança jurídica, transparência e coerência na gestão patrimonial. Entretanto, a diversidade de normas, nomenclaturas e práticas administrativas adotadas pelos diferentes entes federativos pode dificultar a comunicação entre profissionais e gerar interpretações divergentes sobre institutos aparentemente semelhantes.\u003c/p>\u003cp>Nesse contexto, iniciativas de padronização conceitual assumem papel estratégico. A organização sistemática dos regimes de destinação permite classificar os instrumentos existentes segundo sua natureza jurídica e seus efeitos patrimoniais, facilitando a produção de normas, o desenvolvimento de sistemas de informação, a gestão do conhecimento e o intercâmbio de experiências entre instituições. A \u003cb>Tabela Taxonômica de Regimes de Destinação Imobiliária\u003c/b> elaborada no âmbito da Secretaria do Patrimônio da União representa uma contribuição relevante nesse sentido e serve como referência para este material, cuja versão integral é apresentada em anexo. \u003c/p>\u003cp>Antes de prosseguir, convém distinguir dois conceitos fundamentais aqui adotados:\u003c/p>"}},{"id":"b1r0cekz","type":"feature","props":{"columns":1,"card":true,"accent":"","layout":"side","items":[{"icon":"landmark","title":"Regime de destinação imobiliária","text":"\u003cspan data-fs=\"body\">Relação jurídico-administrativa que define os direitos e as obrigações decorrentes da destinação de um imóvel público, estabelecendo a natureza da relação entre a Administração e o destinatário. \u003c/span>"},{"icon":"file-text","title":"Instrumento de destinação","text":"\u003cspan data-fs=\"body\">Documento que formaliza o regime adotado, materializando suas condições, prazos, encargos e efeitos jurídicos, como contratos, termos, certidões ou portarias. \u003c/span>"}]}},{"id":"bhq5d81u","type":"prose","props":{"html":"\u003cp>Apresentaremos, aqui, as principais classes de regimes de destinação aplicáveis aos imóveis públicos, explicando sua lógica, características e finalidades. A descrição detalhada de cada regime, bem como suas definições oficiais e fundamentos normativos, pode ser consultada na resolução e na tabela taxonômica reproduzidas ao final deste documento.\u003c/p>"}}]},{"id":"bvw3iwek","type":"section","props":{"width":"content","surface":"dark","pad":"lg"},"children":[{"id":"cj0v7ccm","type":"titulo","props":{"text":"Regimes de direito real","level":"h2"}},{"id":"c8c3bj2r","type":"prose","props":{"html":"\u003cp>Os regimes de direito real compreendem as formas de destinação em que a Administração Pública transfere a propriedade do imóvel ou constitui direitos reais limitados em favor de terceiros. Diferentemente dos regimes obrigacionais, essas relações produzem efeitos perante todos (oponibilidade erga omnes) e, em regra, podem ser registradas no cartório de registro de imóveis, conferindo maior estabilidade jurídica ao destinatário. São amplamente utilizados em políticas de regularização fundiária, desenvolvimento urbano, habitação, exploração econômica e reorganização patrimonial. A depender do caso, podem envolver alienação definitiva do bem ou apenas a constituição de direitos reais específicos, preservando a titularidade pública. Por sua relevância e diversidade, a \u003cspan data-term=\"TT\" title=\"Tabela Taxonômica de Regimes de Destinação Imobiliária\">TT\u003c/span> organiza esses regimes em duas grandes subclasses: os de \u003cb>transferência da propriedade\u003c/b> e os de \u003cb>direito real limitado\u003c/b>.\u003c/p>"}}]},{"id":"byeb2k41","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"c3udoi10","type":"titulo","props":{"text":"Regimes de transferência da propriedade","level":"h3"}},{"id":"cph8gxsc","type":"prose","props":{"html":"\u003cp>Essa subclasse reúne os regimes pelos quais o Poder Público transfere a propriedade do imóvel a terceiros em caráter definitivo. A transferência pode decorrer de decisão discricionária da Administração, quando há espaço para avaliação de conveniência e oportunidade, ou resultar diretamente de imposição legal, hipótese em que o atendimento dos requisitos previstos em lei vincula a atuação administrativa. Trata-se de importante instrumento para implementação de políticas públicas, regularização fundiária, reorganização patrimonial, alienação de ativos e cumprimento de obrigações legais. Embora a propriedade seja transferida, muitos desses regimes podem impor condições, encargos ou finalidades específicas que condicionam sua manutenção.\u003c/p>"}},{"id":"bgq0anjy","type":"accordion","props":{"numbered":false,"items":[{"title":"Alienação imobiliária discricionária","content":"\u003cp>Nos regimes de alienação discricionária, a Administração possui margem para decidir se a transferência da propriedade é conveniente ao interesse público. Essa avaliação considera fatores como oportunidade, política pública envolvida, interesse social, eficiência patrimonial e planejamento governamental. Incluem-se nessa categoria mecanismos voltados tanto à obtenção de receitas quanto à reorganização do patrimônio ou à implementação de projetos específicos. A escolha do regime adequado depende das características do imóvel, da finalidade pretendida e da legislação aplicável.\u003c/p>","blocks":[{"id":"bzz05rxi","type":"kicker","props":{"icon":"layout-list","children":"Regimes abrangidos","__pullUp":false,"__pullDown":true}},{"id":"bbajyz9z","type":"markerlist","props":{"variant":"ordered","icon":"check","accent":"","items":[{"title":"Dação em pagamento ","text":"Contrato de dação em pagamento"},{"title":"Doação ","text":"Contrato de doação"},{"title":"Integralização de cotas em Fundo de Investimento Imobiliário ","text":"Contrato de Integralização de Cotas em Fundo de Investimento Imobiliário"},{"title":"Investidura ","text":"Contrato de Investidura"},{"title":"Permuta ","text":"Contrato de Permuta"},{"title":"Remição de foro","text":"Contrato de Remição de Foro e Certificado de Remição de Foro (procedimento simplificado)"},{"title":"Venda ","text":"Contrato de compra e venda"}],"__pullUp":false}}]},{"title":"Alienação imobiliária vinculada","content":"Na alienação vinculada, a transferência da propriedade decorre diretamente do atendimento dos requisitos previstos em lei, sem margem relevante para juízo discricionário da Administração. São regimes normalmente associados à efetivação de direitos, regularização fundiária ou cumprimento de comandos legais específicos, em que a atuação do gestor consiste essencialmente em verificar o preenchimento das condições estabelecidas pelo ordenamento jurídico. Nesses casos, a destinação do imóvel representa instrumento de concretização de políticas públicas previamente definidas pelo legislador.","linkHref":"","linkLabel":"","linkButton":"","blocks":[{"id":"bek0k53d","type":"kicker","props":{"icon":"layout-list","children":"Regimes abrangidos","__pullDown":true}},{"id":"boqqunoo","type":"markerlist","props":{"variant":"ordered","icon":"check","accent":"","items":[{"title":"Legitimação fundiária ","text":"Certidão de Regularização Fundiária (CRF)."},{"title":"Reconhecimento de domínio ","text":"Título de Reconhecimento de Domínio."},{"title":"Transferência de propriedade para fins de Reurb-S ","text":"Certidão de Autorização de Transferência de domínio para fins de Reurb-S (CATReurb-S)."},{"title":"Transferência de propriedade por dispositivo legal específico ","text":"Termo de Transferência. "}]}}]}]}}]},{"id":"bo1tcdvj","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"c4f5u8ju","type":"titulo","props":{"text":"Regimes de direito real limitado","level":"h3"}},{"id":"cgqrnkyn","type":"prose","props":{"html":"\u003cp>Diferentemente da transferência da propriedade, esses regimes mantêm o domínio do imóvel com o Poder Público, mas atribuem ao destinatário determinados poderes jurídicos diretamente relacionados ao bem. Em geral, conferem maior estabilidade do que os vínculos meramente contratuais e exigem registro no cartório competente, assegurando publicidade e segurança jurídica. São amplamente empregados para viabilizar políticas habitacionais, regularização fundiária, desenvolvimento urbano, utilização econômica ou implantação de empreendimentos de longo prazo, preservando a titularidade pública sempre que conveniente ao interesse coletivo.\u003c/p>"}},{"id":"bpbpx7fw","type":"panel","props":{"variant":"box","kicker":"Regimes e respectivos instrumentos abrangidos","kickerIcon":"layout-list","title":"","color":"","bg":"var(--cloud-50)","body":""},"children":[{"id":"bdugkjij","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b2zlttkp","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-500)","items":[{"title":"Aforamento","text":"Contrato de aforamento"},{"title":"Concessão de Direito Real de Laje ","text":"Contrato de Concessão de Direito Real de Laje"},{"title":"Concessão de Direito Real de Uso ","text":"Contrato de Concessão de Direito Real de Uso; "},{"title":"Concessão de Direito de Superfície ","text":"Contrato de Concessão de Direito de Superfície; "}],"__pullDown":false}},{"id":"b_ms3l540p_ca0k","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-500)","items":[{"title":"Concessão de Uso Especial para Fins de Moradia ","text":"Contrato de Concessão de Uso Especial para Fins de Moradia; "},{"title":"Contrato de Promessa de compra e venda ","text":"Contrato de Promessa de compra e venda; "},{"title":"Transferência de Direito Real de Uso para fins de Reurb-S ","text":"Certidão de Autorização de Transferência de Direito Real de Uso para fins de regularização fundiária urbana de interesse social (CAT-Reurb-S)"}]}}]}]}]},{"id":"bj8hqgo6","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"cg0c6djy","type":"titulo","props":{"text":"Regimes de direito pessoal ou obrigacional","level":"h2"}},{"id":"c1hirxgf","type":"prose","props":{"html":"\u003cp>Nessa categoria, a Administração não transfere a propriedade nem constitui direito real sobre o imóvel. O que se estabelece é uma relação contratual ou obrigacional entre as partes, disciplinando o uso do bem por determinado período e sob condições específicas. Em regra, esses regimes oferecem maior flexibilidade para adequar a destinação às necessidades da política pública ou da gestão patrimonial, preservando o domínio público do imóvel.\u003c/p>\u003cp>São amplamente utilizados para permitir a utilização de imóveis por órgãos públicos, entidades privadas, organizações sociais ou particulares, podendo ser gratuitos ou onerosos, conforme o interesse público e a legislação aplicável. Também constituem importantes instrumentos de arrecadação patrimonial quando associados à cobrança pelo uso privativo dos bens públicos.\u003c/p>"}},{"id":"b_ms3lb7xs_z6fm","type":"panel","props":{"variant":"box","kicker":"Regimes abrangidos","kickerIcon":"layout-list","title":"","color":"","bg":"var(--sand-50)","body":""},"children":[{"id":"b_ms3lb7xs_nv0g","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b_ms3lb7xs_w30d","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-500)","items":[{"title":"Acordo de Cooperação Técnica para Regularização Fundiária Urbana ","text":"Acordo de Cooperação Técnica (ACT-Reurb)."},{"title":"Entrega ","text":"Termo de Entrega."},{"title":"Guarda provisória ","text":"Termo de Guarda Provisória."}]}},{"id":"b_ms3lb7xs_ekyd","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-500)","items":[{"title":"Transferência de gestão por determinação legal ","text":"Termo de Transferência de Gestão."},{"title":"Transferência de gestão de orlas e praias ","text":"Termo de Adesão à Gestão de Orlas e Praias (TAGP)."}]}}]}]}]},{"id":"bqytyoaq","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"cymwxnnb","type":"titulo","props":{"text":"Regimes de outorga administrativa","level":"h2"}},{"id":"c70bb15r","type":"prose","props":{"html":"\u003cp>Os regimes de outorga administrativa caracterizam-se pela prática de atos unilaterais da Administração que permitem, reconhecem ou autorizam determinados usos do imóvel público, normalmente em caráter precário, específico ou transitório. Diferentemente dos direitos reais e das relações obrigacionais típicas, essas outorgas não estabelecem vínculo contratual amplo nem conferem direito real sobre o bem, permanecendo sujeitas às condições impostas pelo poder público e à prevalência do interesse coletivo.\u003c/p>\u003cp>São instrumentos frequentemente empregados para disciplinar situações pontuais, como autorizações para realização de obras, implantação de infraestrutura, realização de eventos, utilização sustentável por comunidades tradicionais ou reconhecimento administrativo de determinadas ocupações. Em muitos casos, constituem soluções céleres e proporcionais para demandas que não justificam a celebração de contratos mais complexos.\u003c/p>"}},{"id":"b_ms3llgh7_bs16","type":"panel","props":{"variant":"box","kicker":"Principais regimes","kickerIcon":"alert-circle","title":"","color":"","bg":"var(--sand-50)","body":""},"children":[{"id":"b_ms3llgh7_hhv9","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b_ms3llgh7_rk18","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-500)","items":[{"title":"Autorização de obras ","text":"Portaria de Autorização de Obras."},{"title":"Autorização de passagem","text":"Termo de Autorização de Passagem [Gratuita | Onerosa]."},{"title":"Autorização de uso para fins comerciais ","text":"Termo de Autorização de Uso."}]}},{"id":"b_ms3llgh7_bsnz","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-500)","items":[{"title":"Autorização de Uso Sustentável ","text":"Termo de Autorização de Uso Sustentável (TAUS)."},{"title":"Inscrição de ocupação ","text":"Certidão de Outorga de Inscrição de Ocupação"},{"title":"Permissão de uso para eventos de curta duração ","text":"Termo de Permissão de Uso para eventos."}]}}]}]}]},{"id":"bkugs8ce","type":"section","props":{"width":"content","surface":"terra-dark","pad":"lg"},"children":[{"id":"b9lcf1l6","type":"panel","props":{"variant":"box","kicker":"Exemplo Da UNIÃO","kickerIcon":"landmark","title":"","color":"","bg":"var(--cloud-50)","body":"","__pullUp":false},"children":[{"id":"b13nxyuo","type":"prose","props":{"html":"\u003cp>\u003cb>\u003cspan data-fs=\"h3\">Padronizando a linguagem da gestão patrimonial\u003c/span>\u003cbr>\u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cspan data-fs=\"h5\">A experiência do Comitê de Gestão do Conhecimento (ComGC/SPU)\u003c/span>\u003c/span>\u003c/p>\u003cp>A gestão de imóveis públicos envolve centenas de conceitos, instrumentos e regimes jurídicos que, muitas vezes, recebem denominações distintas ou são utilizados de forma inconsistente por diferentes órgãos e entes federativos, inclusive internamente nestes. Para enfrentar esse desafio, a Secretaria do Patrimônio da União (SPU) instituiu o Comitê de Gestão do Conhecimento (ComGC), responsável por, dentre outras atribuições, desenvolver e manter tabelas taxonômicas voltadas à padronização da linguagem técnico-administrativa aplicada à gestão patrimonial.\u003c/p>\u003cp>Essas taxonomias organizam conceitos, reduzem ambiguidades terminológicas e favorecem a interoperabilidade entre sistemas, a produção de estatísticas, a gestão do conhecimento e a elaboração de normas e documentos institucionais. Embora concebidas para a realidade da SPU, constituem importante referência para qualquer instituição que atue na gestão de imóveis públicos.\u003c/p>\u003cp>Entre os principais produtos desenvolvidos destacam-se:\u003c/p>"}},{"id":"bblv4m9j","type":"accordion","props":{"numbered":false,"items":[{"title":" TT-01 – Tipos de Uso Imobiliário","content":"\u003cp>Classifica os diferentes usos atribuídos aos imóveis públicos, apoiando análises sobre função social, destinação e políticas públicas.\u003c/p>","linkLabel":"Acesse: \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Resolução ComGC/SPU/MGI nº 2/2025 (TT-01)\u003c/span>","linkHref":"https://memoria-spu.gestao.gov.br/wp-content/uploads/tainacan-items/54791/252031/SEI_50532576_Resolucao_2-4.pdf","linkButton":"primary"},{"title":" TT-02 – Regimes de Destinação Imobiliária","content":"\u003cp>Organiza e padroniza os regimes jurídicos utilizados para destinação de imóveis públicos, estruturando-os conforme sua natureza e efeitos patrimoniais.\u003c/p>","linkHref":"https://memoria-spu.gestao.gov.br/wp-content/uploads/tainacan-items/54791/273781/SEI_54999155_Resolucao_5_TT02.pdf","linkLabel":"Acesse: Resolução ComGC/SPU/MGI nº 5/2025 (TT-02)","linkButton":"primary"}]}}]}]},{"id":"b7n6chi5","type":"conclusion","props":{"kicker":"Para fechar","kickerIcon":"check","title":"Considerações finais","body":"\u003cp>A escolha do regime de destinação não é uma mera formalidade jurídica. Ela influencia diretamente a estabilidade da relação estabelecida, os direitos conferidos ao destinatário, a possibilidade de cobrança de contrapartidas, os mecanismos de fiscalização, o tratamento registral e o alcance das políticas públicas implementadas por meio dos imóveis.\u003c/p>\u003cp>Por essa razão, a utilização de uma classificação taxonômica padronizada contribui para aumentar a segurança jurídica, facilitar a interoperabilidade entre sistemas, qualificar a produção de informações patrimoniais e promover uma linguagem comum entre os diferentes entes e instituições responsáveis pela gestão do patrimônio imobiliário público. A Tabela Taxonômica de Regimes de Destinação Imobiliária da SPU constitui, nesse contexto, uma referência útil para compreender a diversidade e a complexidade dos instrumentos disponíveis para dar função social, econômica e institucional aos imóveis públicos.\u003c/p>\u003cp>Por fim, é importante destacar que a nomenclatura e a disciplina jurídica dos regimes de destinação podem variar entre os diferentes entes federativos. Estados, Distrito Federal e municípios podem prever instrumentos específicos ou adotar denominações distintas para institutos de natureza semelhante, assim como a União possui regimes próprios, a exemplo da inscrição de ocupação e do aforamento, decorrentes de sua história patrimonial e de legislação específica. Apesar dessas particularidades, grande parte dos regimes utilizados na gestão de imóveis públicos encontra fundamento no Direito Civil, especialmente no Código Civil brasileiro, complementado por normas urbanísticas, administrativas e patrimoniais de cada ente. A compreensão da natureza jurídica de cada regime é, portanto, mais relevante do que sua denominação específica, permitindo identificar soluções equivalentes em diferentes contextos institucionais.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"bp08buvw","type":"callout","props":{"variant":"header","tone":"warning","icon":"bookmark","title":"Atenção","heading":"Tabela Taxonômica de Regimes de Destinação Imobiliária (TT-02)","children":"\u003cp>Para aprofundar o estudo, recomenda-se a leitura da Resolução que institui a Tabela Taxonômica de Regimes de Destinação Imobiliária (TT-02), reproduzida integralmente ao final deste material. O documento apresenta as definições oficiais, fundamentos legais, instrumentos de formalização e demais atributos de cada regime, constituindo importante referência para a padronização conceitual e a gestão dos imóveis públicos.\u003c/p>\u003cp>\u003cb>\u003ca href=\"https://memoria-spu.gestao.gov.br/wp-content/uploads/tainacan-items/54791/273781/SEI_54999155_Resolucao_5_TT02.pdf\" data-btn=\"secondary\">Acesse aqui a TT-02\u003c/a>\u003c/b>\u003c/p>"}},{"id":"bupna9b3","type":"accordion","props":{"numbered":false,"items":[{"title":"Referências","content":"\u003cp>Secretaria do Patrimônio da União. (2025). \u003cb>Resolução ComGC/SPU/MGI nº 5, de 24 de outubro de 2025\u003c/b>: Institui a Tabela Taxonômica de Regimes de Destinação Imobiliária no âmbito da Secretaria do Patrimônio da União. Ministério da Gestão e da Inovação em Serviços Públicos. https://memoriaspu.gestao.gov.br\u003c/p>"}]}}]},{"id":"bhi2lp79","type":"pagefooter","props":{"code":"Regimes de destinação [M412]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Conteúdo","name":"Claudson Moreira"},{"role":"Revisão","name":"Angélia Faddoul"},{"role":"Design Educacional","name":"Luís Henrique Lindner"},{"role":"Versão","name":"Julho de 2026"}]}}]}</script>

<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');
    var allowed = ['STRONG','B','EM','I','BR','P','SPAN'];
    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
