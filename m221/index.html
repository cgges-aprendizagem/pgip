<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M221 - Due diligence aplicada à gestão de imóveis públicos","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"cg10ukjg","text":"Introdução","hidden":true},{"id":"cfvevqx2","text":"Diferentes formas de atuação na gestão dos imóveis","hidden":false},{"id":"c24brp04","text":"\u003ci>Due diligence\u003c/i> na gestão de imóveis públicos","hidden":false}]}},"blocks":[{"id":"befebsxa","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bvtgtbn8","type":"hero","props":{"kicker":"Análise técnico-jurídica","kickerIcon":"scale","title":"Análise preventiva de imóveis públicos&nbsp;","byline":"busca de elementos para decisões patrimoniais seguras","slot":"bvtgtbn8__slot"}},{"id":"b9g9172n","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cg10ukjg","type":"titulo","props":{"text":"Introdução","level":"h2"}},{"id":"cw75mh1r","type":"prose","props":{"html":"\u003cp>O objetivo do presente texto é demonstrar como a \u003ci>due diligence\u003c/i>, técnica geralmente aplicada no âmbito das transações particulares, pode também ser aplicada à gestão dos imóveis públicos, favorecendo a tomada de decisões mais seguras, através do reconhecimento dos principais elementos técnico-jurídicos envolvidos na análise preventiva.\u003c/p>\u003cp>Quando pensamos em imóveis públicos, é comum imaginar apenas uma praça, ruas ou demais logradouros de acesso franco e coletivo. Porém, o Estado possui três categorias de bens, que comportam análises e cuidados distintos: \u003cb>os bens de uso especial\u003c/b> (voltados ao funcionamento da própria Administração Pública, como hospitais, escolas e repartições públicas), \u003cb>os bens de uso comum\u003c/b> (aqueles de uso e fruição coletiva, como praças, praias e demais áreas congêneres) e \u003cb>os bens dominiais\u003c/b> (que compõem o patrimônio das pessoas jurídicas de direito público e sobre os quais o Estado possui maior amplitude de disposição, inclusive para destiná-los a particulares ou até mesmo aliená-los, observados os requisitos legais).\u003c/p>\u003cp>Em especial quanto aos bens da classe dominial, é preciso saber que, na prática, um imóvel público não “nasce pronto”. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Antes de ser incorporado, regularizado, destinado ou utilizado pelo Estado, ele precisa ser compreendido juridicamente, territorialmente e administrativamente.\u003c/span>\u003c/p>\u003cp>É nesse contexto que surge a importância da análise preventiva — ou, em linguagem contemporânea, da \u003ci>due diligence\u003c/i> aplicada aos imóveis públicos.\u003c/p>"}}]},{"id":"bdpnlo5x","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"cfvevqx2","type":"titulo","props":{"text":"Diferentes formas de atuação na gestão dos imóveis","level":"h2"}},{"id":"cem1vib6","type":"prose","props":{"html":"\u003cp>A tomada de decisões envolvendo imóveis, sejam eles públicos ou privados, normalmente não se resume a um único trabalho técnico. Antes que um imóvel seja adquirido, incorporado ao patrimônio público, destinado a determinada finalidade ou regularizado, diferentes perguntas precisam ser respondidas:\u003c/p>"}},{"id":"b8da4721","type":"panel","props":{"variant":"box","kicker":"Cada pergunta corresponde a uma forma distinta de atuação\u003cbr>","kickerIcon":"circle-question-mark","title":"","color":"","bg":"var(--cloud-200)","body":"","__pullUp":false},"children":[{"id":"bf2340li","type":"feature","props":{"columns":1,"card":false,"accent":"var(--terra-800)","layout":"side","items":[{"icon":"alert-triangle","title":"Existem riscos ou inconsistências envolvendo esse imóvel?","text":"análise preventiva"},{"icon":"clipboard-clock","title":"Caso existam pendências, como elas podem ser solucionadas?","text":"regularização imobiliária"},{"icon":"book-search","title":"Quais cautelas devem ser observadas para formalizar adequadamente o ato ou negócio jurídico pretendido?","text":"assessoria contratual"}]}}]},{"id":"bszp5ior","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A\u003c/span>\u003cb style=\"text-wrap-mode: initial;\"> análise preventiva\u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\"> busca identificar riscos e inconsistências antes da tomada de decisão. A \u003c/span>\u003cb style=\"text-wrap-mode: initial;\">regularização imobiliária \u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">tem por finalidade solucionar as pendências encontradas durante essa investigação. Já a \u003c/span>\u003cb style=\"text-wrap-mode: initial;\">assessoria contratual\u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\"> procura conferir segurança jurídica à formalização do negócio ou do ato pretendido.\u003c/span>\u003c/p>\u003cp>Embora complementares, trata-se de atividades distintas, que exigem métodos, estratégias e competências próprias.\u003c/p>","__pullDown":true}}]},{"id":"btsw72dk","type":"section","props":{"width":"wide","surface":"white","pad":"lg"},"children":[{"id":"bd2qyvb0","type":"figure","props":{"slot":"bd2qyvb0__slot","src":"","fit":"contain","size":"full","title":"processo de gestão imobiliária","caption":"","credit":"","__pullUp":true}}]},{"id":"bjpcjx0j","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cqc9p0lf","type":"titulo","props":{"text":"Análise preventiva de riscos","level":"h3"}},{"id":"cvrgz5v4","type":"prose","props":{"html":"\u003cp>Imagine que a Administração Pública precisa incorporar determinado imóvel ao patrimônio público, com a pretensão de destiná-lo a uma política pública ou regularizá-lo em favor de seus ocupantes.\u003c/p>\u003cp>Antes que qualquer decisão seja tomada, algumas perguntas precisam ser respondidas:\u003c/p>"}},{"id":"bo7u3el9","type":"markerlist","props":{"variant":"icon","icon":"message-circle-question-mark","accent":"var(--terra-500)","items":[{"title":"Quem é o titular do imóvel? A pessoa política ou outras entidades públicas?","text":""},{"title":"Seus limites físicos estão corretamente identificados?","text":""},{"title":"Existem divergências entre o cadastro e o registro imobiliário?","text":""},{"title":"Há restrições urbanísticas ou ambientais que precisam ser consideradas?","text":""},{"title":"Existem processos administrativos ou judiciais capazes de afetar sua utilização?","text":""}]}},{"id":"bfph5xgj","type":"callout","props":{"variant":"ear","tone":"note","icon":"lightbulb","title":"","heading":"","children":"\u003cp>A análise preventiva consiste justamente em investigar essas questões antes da tomada de decisão. Seu principal objetivo não é resolver os problemas encontrados, mas identificá-los antecipadamente para reduzir riscos e subsidiar decisões mais seguras. Em outras palavras, trata-se de compreender o imóvel antes de decidir sobre ele.\u003c/p>"}},{"id":"b3s5w3o2","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Nenhum imóvel está imune à existência de riscos ou inconsistências. Muitas vezes, eles não são percebidos em uma primeira análise documental e somente aparecem quando diferentes fontes de informação são confrontadas, como o cadastro, o registro imobiliário, documentos históricos, informações territoriais e dados administrativos.\u003c/span>\u003c/p>\u003cp>Por essa razão, \u003cb>\u003cmark data-hl=\"terra\">a análise preventiva pode ser compreendida como um verdadeiro diagnóstico do imóvel\u003c/mark>\u003c/b>. Seu propósito é identificar situações capazes de comprometer a finalidade que se pretende atribuir ao bem ou levantar hipóteses que podem dificultar a produção dos efeitos jurídicos esperados pelo negócio ou ato jurídico a ser celebrado.\u003c/p>"}},{"id":"bg5uoqng","type":"figure","props":{"slot":"bg5uoqng__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}},{"id":"by9lhhoo","type":"prose","props":{"html":"\u003cp>Em determinadas situações, por exemplo, a análise preventiva poderá identificar a existência de conflitos entre informações cadastrais e registrais, restrições ambientais não observadas ou a necessidade de complementação documental antes da prática do ato pretendido.\u003c/p>\u003cp>O que se espera do profissional responsável por essa etapa não é, necessariamente, apresentar a solução para todos os problemas identificados, mas apontar os riscos existentes e fornecer os elementos necessários para uma tomada de decisão mais consciente e segura.\u003c/p>"}}]},{"id":"bws1s10t","type":"section","props":{"width":"content","surface":"dark","pad":"lg"},"children":[{"id":"cd11adts","type":"titulo","props":{"text":"Regularização imobiliária\u003c/span>","level":"h3"}},{"id":"cw1p60m8","type":"prose","props":{"html":"\u003cp>Uma vez identificadas as pendências existentes, inicia-se uma nova etapa do trabalho.\u003c/p>"}},{"id":"b91bdl21","type":"pullquote","props":{"variant":"block","children":"Se a análise preventiva pode ser comparada ao diagnóstico realizado antes de um tratamento médico, a regularização imobiliária corresponde ao conjunto de medidas adotadas para solucionar os problemas encontrados, ou seja, corresponde ao tratamento em si.","cite":""}},{"id":"b2oom5ql","type":"callout","props":{"variant":"ear","tone":"attention","icon":"square-mouse-pointer","title":"","heading":"","children":"\u003cp>O objetivo é promover a adequação jurídica, registral, cadastral, urbanística ou administrativa do imóvel, removendo obstáculos que possam comprometer sua adequada utilização ou a produção dos efeitos jurídicos pretendidos.\u003c/p>"}},{"id":"b_mrzh5g18_rcsr","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Trata-se, portanto, de um serviço distinto da análise preventiva. Enquanto esta procura responder à pergunta \"quais são os riscos?\", a regularização imobiliária busca solucionar uma nova questão: \"como esses problemas podem ser resolvidos?\".\u003c/span>\u003c/p>\u003cp>Cada pendência identificada exigirá uma estratégia própria de atuação, razão pela qual a regularização imobiliária constitui atividade autônoma e complementar à análise preventiva.\u003c/p>"}}]},{"id":"bdd8yi32","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c4jo84vl","type":"titulo","props":{"text":"Assessoria contratual\u003c/span>","level":"h3"}},{"id":"c0j2m5em","type":"prose","props":{"html":"\u003cp>Superadas as etapas anteriores, pode ser necessário formalizar juridicamente a decisão tomada.\u003c/p>"}},{"id":"biufix00","type":"callout","props":{"variant":"ear","tone":"warning","icon":"lightbulb","title":"","heading":"","children":"\u003cp>A assessoria contratual corresponde ao trabalho de acompanhamento e assistência técnica prestado durante a celebração do ato ou do negócio jurídico relacionado ao imóvel.\u003c/p>"}},{"id":"b_mrzhgv1t_lag9","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Nesse momento, o profissional responsável atua para garantir que os instrumentos jurídicos produzidos reflitam adequadamente as cautelas identificadas nas etapas preliminares, observando as exigências legais aplicáveis e os interesses envolvidos.\u003c/span>\u003c/p>\u003cp>Mais do que redigir um documento, a assessoria contratual procura garantir que a decisão tomada seja corretamente traduzida para o plano jurídico, conferindo maior segurança à sua execução.\u003c/p>\u003cp>Assim, embora análise preventiva, a regularização imobiliária e a assessoria contratual possam coexistir em uma mesma demanda, elas representam momentos distintos do processo decisório relacionado ao imóvel, cada qual desempenhando papel próprio na construção de decisões patrimoniais mais seguras.\u003c/p>"}},{"id":"bqjkgh84","type":"datatable","props":{"caption":"","columns":[{"key":"c0","label":"Etapa"},{"key":"c1","label":"Pergunta"},{"key":"c2","label":"Resultado esperado"}],"rows":[{"c0":"Análise preventiva","c1":"Existem riscos?","c2":"Diagnóstico do imóvel"},{"c0":"Regularização imobiliária","c1":"Como solucionar as pendências?","c2":"Adequação do imóvel"},{"c0":"Assessoria contratual","c1":"Como formalizar a decisão tomada sobre o imóvel \u003cbr> (vender, permutar, doar, ceder etc)?","c2":"Segurança jurídica do ato"}],"dense":false,"highlightFirst":true,"striped":false,"tone":"petrol","className":"spu-table-wrap--tone-petrol"}}]},{"id":"ba6i60l5","type":"section","props":{"width":"content","surface":"terra-dark","pad":"lg"},"children":[{"id":"c24brp04","type":"titulo","props":{"text":"\u003ci>Due diligence\u003c/i> na gestão de imóveis públicos","level":"h2"}},{"id":"c7nw4em9","type":"prose","props":{"html":"\u003cp>No setor privado, o termo \u003ci>due diligence\u003c/i> é utilizado para designar uma investigação prévia realizada antes da aquisição de um imóvel ou de uma empresa. Como já foi explicado anteriormente, o objetivo é identificar riscos, inconsistências ou problemas capazes de comprometer a segurança da operação. Na gestão de imóveis públicos, a lógica é – ou poderia ser – semelhante.\u003c/p>"}},{"id":"bngsnwrk","type":"callout","props":{"variant":"ear","tone":"attention","icon":"alert-circle","title":"","heading":"","children":"\u003cp>Antes de reconhecer a dominialidade pública, incorporar um imóvel ao patrimônio público ou praticar atos de gestão patrimonial, é necessário realizar uma análise preventiva integrada. Essa análise envolve aspectos dominiais, registrais, cadastrais, territoriais, urbanísticos, ambientais e administrativos.\u003c/p>"}},{"id":"b_mrzc9z4f_bzwj","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A finalidade não é apenas conferir documentos, mas produzir segurança técnica e jurídica para a tomada de decisão administrativa – qual a melhor vocação ou destinação para aquele imóvel público, considerando, entre outros fatores, a análise preventiva dos aspectos integrados citados.\u003c/span>\u003c/p>"}}]},{"id":"b0a6o131","type":"section","props":{"width":"content","surface":"warm","pad":"lg","__pullUp":false},"children":[{"id":"cxercvuq","type":"titulo","props":{"text":"O imóvel público não existe apenas com o registro","level":"h3"}},{"id":"c2gkqs1h","type":"prose","props":{"html":"\u003cp>Um dos pontos mais importantes da gestão patrimonial pública é compreender que o registro imobiliário, embora essencial para assegurar a legitimidade e a confiança das transações imobiliárias, possui limites quando estamos falando de bens públicos.\u003c/p>\u003cp>O fato de um imóvel estar matriculado em nome de um particular não significa, necessariamente, a inexistência de domínio público sobre ele. Grande parte dos bens públicos possui origem na teoria do direito de conquista, a qual, em síntese, estabelece que o território nacional foi arrecadado pela coroa portuguesa e transmitido às pessoas públicas que a sucederam. \u003c/p>\u003cp>Por isso, o domínio de grande parte dos bens públicos provém diretamente da lei, não de transações como ocorre entre os particulares. Assim, as Constituições federais estabeleceram, ao longo da história do país, quais bens pertencem aos Estados, aos Municípios e ao ente político nacional – a União Federal.\u003c/p>","__pullUp":false}},{"id":"bezy3en8","type":"figure","props":{"slot":"bezy3en8__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}},{"id":"b_mrzhodlc_311e","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Com efeito, aquele ditado muito usual no Direito Registral Imobiliário \u003c/span>\u003ci style=\"text-wrap-mode: initial; color: inherit;\">“só é dono quem registra (em cartório)”\u003c/i>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\"> não é tão aplicável aos imóveis públicos, pois o fundamento constitutivo do direito do Estado sobre esses bens provém, em sua grande parte, diretamente da lei.\u003c/span>\u003c/p>\u003cp>Desse modo, a ausência de matrícula em nome do ente público não impede, por si só, a existência de domínio público. Em regra, repete-se, o domínio público sobre determinado imóvel deriva diretamente da lei, não do registro em cartório. Este, é bem verdade, serve para “alargar” o domínio do ente público sobre os bens que integram o seu patrimônio imobiliário, dando conhecimento desse direito às demais pessoas.\u003c/p>\u003cp>Nesse contexto, a análise preventiva exige integração entre diferentes sistemas de informação: registro imobiliário, cadastro patrimonial, dados geoespaciais, memoriais descritivos, plantas e documentos históricos.\u003c/p>","__pullUp":false}},{"id":"bn9elnnm","type":"callout","props":{"variant":"header","tone":"warning","icon":"lightbulb","title":"Em outras palavras","heading":"","children":"\u003cp>A análise preventiva patrimonial não pode depender exclusivamente do cartório nem exclusivamente do cadastro ou de sistemas corporativos.\u003c/p>"}}]},{"id":"bqmr439r","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c280ul88","type":"titulo","props":{"text":"O que deve ser analisado? ","level":"h3"}},{"id":"cjsdfm4s","type":"prose","props":{"html":"\u003cp>A \u003ci>due diligence\u003c/i> aplicada aos imóveis públicos pode envolver \u003cb>cinco grandes dimensões de análise\u003c/b>:\u003c/p>"}},{"id":"bxs5lyh2","type":"contentslider","props":{"hint":"Dimensões de análise","accent":"var(--terra-600)","showTabNumbers":true,"slides":[{"showImage":false,"slot":"bxs5lyh2__slides_1_slot","alt":"","caption":"","label":"","title":"\u003cspan data-fs=\"h4\">Titularidade e cadeia dominial\u003c/span>","subtitle":"Afinal, de quem é esse imóvel?","description":"No caso dos bens públicos, essa resposta nem sempre pode ser encontrada apenas na matrícula imobiliária, pois muitos imóveis possuem origens históricas específicas decorrentes de sucessões legislativas, antigas formas de aquisição patrimonial ou de outros mecanismos previstos em lei. Por essa razão, a análise preventiva deve investigar a origem da propriedade e a cadeia dominial do imóvel, confrontando informações históricas, registrais e administrativas que permitam compreender como a titularidade foi constituída ao longo do tempo e se ela é compatível com a realidade patrimonial apresentada.","linkHref":"","linkLabel":"","tabLabel":"Titularidade","labelIcon":"award"},{"showImage":false,"slot":"c_up3h3r7__imageSlot","alt":"","caption":"","label":"","title":"\u003cspan data-fs=\"h4\">Cadastro e territorialidade\u003c/span>","subtitle":"As informações jurídicas e territoriais do imóvel correspondem entre si?","description":"A análise preventiva deve confrontar dados cadastrais, registrais e geoespaciais para verificar se a descrição jurídica do imóvel coincide com sua representação física no território, identificando eventuais sobreposições, divergências documentais ou inconsistências relacionadas aos seus limites. A integração dessas informações é essencial para que a tomada de decisão administrativa esteja apoiada em bases patrimoniais confiáveis.","linkHref":"","linkLabel":"","tabLabel":"Cadastro","labelIcon":"move-3d"},{"showImage":false,"slot":"c_dyi2jvr__imageSlot","alt":"","caption":"","label":"","title":"\u003cspan data-fs=\"h4\">Situação urbanística e ambiental\u003c/span>","subtitle":"A utilização pretendida para o imóvel é compatível com suas características urbanísticas e ambientais?","description":"Para isso, devem ser observadas as restrições legais incidentes sobre o bem, sua inserção territorial, as formas de ocupação existentes e a compatibilidade entre sua destinação e o interesse público envolvido. Mais do que identificar impedimentos formais, essa análise permite avaliar se o imóvel poderá cumprir adequadamente a função que dele se espera, reduzindo riscos relacionados à sua utilização futura.","linkHref":"","linkLabel":"","tabLabel":"Situação","labelIcon":"trees"},{"showImage":false,"slot":"c_9qayema__imageSlot","alt":"","caption":"","label":"","title":"\u003cspan data-fs=\"h4\">Aspectos administrativos e judiciais\u003c/span>","subtitle":"Existem processos administrativos ou judiciais capazes de afetar a situação jurídica do imóvel ou comprometer a decisão pretendida?","description":"Litígios possessórios, ações reivindicatórias, procedimentos administrativos pendentes ou entendimentos consolidados pelos tribunais podem influenciar significativamente a estratégia de atuação da Administração Pública. Conhecer previamente esses elementos permite antecipar riscos e evitar decisões fundadas em informações incompletas ou fragmentadas.","linkHref":"","linkLabel":"","tabLabel":"Aspectos","labelIcon":"scale"},{"showImage":false,"slot":"c_8hscdf7__imageSlot","alt":"","caption":"","label":"","title":"\u003cspan data-fs=\"h4\">Identificação de riscos e tomada de decisão\u003c/span>","subtitle":"","description":"Todas as informações obtidas nas etapas anteriores convergem para a elaboração de um relatório de riscos, cuja finalidade é subsidiar a tomada de decisão patrimonial. Esse documento sintetiza as potencialidades, limitações e inconsistências identificadas durante a análise preventiva, permitindo avaliar a viabilidade da incorporação, destinação, regularização ou utilização pretendida para o imóvel. Mais do que apontar problemas, o relatório oferece ao gestor os elementos necessários para decidir de maneira mais consciente, segura e alinhada ao interesse público.","linkHref":"","linkLabel":"","tabLabel":"Decisão","labelIcon":"sticky-note-check"}]}},{"id":"bqv7kaj0","type":"prose","props":{"html":"\u003cp>O objetivo final da análise preventiva é identificar inconsistências cadastrais, fragilidade dominial, judicialização, sobreposição territorial, conflitos registrais e passivos ambientais.\u003c/p>","__pullDown":true}}]},{"id":"bv8rwkgp","type":"section","props":{"width":"wide","surface":"none","pad":"lg"},"children":[{"id":"ber5ecni","type":"figure","props":{"slot":"ber5ecni__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":"","__pullDown":true,"__pullUp":false}}]},{"id":"bp4a72rb","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"b10w44os","type":"examplecard","props":{"label":"Exemplo","icon":"map-pin","color":"","slot":"b10w44os__slot","collapse":"none","title":"Caso prático simplificado","children":"\u003cp>Imagine uma área ocupada há décadas por particulares. Em que pese essa ocupação, o cadastro patrimonial indica tratar-se de área pertencente a determinado ente público. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Por outro lado, o cartório apresenta matrícula em nome de terceiros.\u003c/span>\u003c/p>\u003cp>\u003cb>E agora? \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Como regularizar esta área, preservando a titularidade do ente público, sem prejudicar o direito daqueles que construíram seus imóveis naquele espaço? \u003c/span>\u003c/b>\u003c/p>\u003cp>A resposta não pode surgir apenas do que consta no registro ou no cadastro patrimonial isoladamente.\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Será necessário examinar a cadeia dominial, confrontar plantas e memoriais, analisar dados territoriais, impedimentos urbanísticos ou ambientais e verificar o perfil socioeconômico dos particulares, até compreender o histórico jurídico da área e quais regimes de regularização são aplicáveis à situação.\u003c/span>\u003c/p>\u003cp>Esse é um exemplo típico de análise técnico-jurídica preventiva aplicada à gestão de imóveis públicos.\u003c/p>"}}]},{"id":"b6t2ly0s","type":"conclusion","props":{"kicker":"Para fechar","kickerIcon":"check","title":"Considerações finais","body":"\u003cp>A gestão de imóveis públicos exige mais do que o conhecimento isolado da legislação administrativa, do direito registral, urbanístico ou ambiental. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Ela depende da integração entre todos esses ramos, pois só assim será possível conjugar direito, território, cadastro e informação administrativa.\u003c/span>\u003c/p>\u003cp>\u003cb>\u003c/b>\u003c/p>\u003cspan data-color=\"ochre-light\">\u003cp>\u003cb>\u003c/b>\u003c/p>\u003c/span>\u003cspan data-fs=\"body-lg\">\u003cspan data-color=\"ochre-light\">\u003cp>\u003cb>A \u003ci>due diligence\u003c/i> aplicada aos imóveis públicos representa justamente essa visão integrada: compreender o imóvel antes da decisão.\u003c/b>\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003c/p>\u003c/span>\u003cp>Mais do que definir os limites físicos e incorporar imóveis ao patrimônio público, trata-se de produzir segurança, legitimidade e qualidade na atuação estatal.\u003c/p>\u003cp>Em conclusão, a gestão patrimonial pública exige uma análise preventiva integrada, combinando elementos jurídicos, registrais, cadastrais, territoriais e administrativos para subsidiar decisões seguras sobre imóveis públicos.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"bf5pa75l","type":"callout","props":{"variant":"ear","tone":"info","icon":"notebook-pen","title":"","heading":"","children":"\u003cp>\u003cspan data-fs=\"body\">Este material foi adaptado a partir da publicação \"\u003ca href=\"https://jus.com.br/artigos/119627/due-diligence-de-imoveis-publicos-analise-preventiva-para-a-tomada-de-decisoes-seguras\">Due Diligence de Imóveis Públicos: análise preventiva para a tomada de decisões seguras\u003c/a>\", do mesmo autor.\u003c/span>\u003c/p>"}},{"id":"by4k99o9","type":"referencias","props":{"title":"Referências","defaultOpen":false,"items":["\u003cp>SCAVONE JUNIOR, Luiz Antonio. \u003cb>Direito imobiliário\u003c/b> – Teoria e prática. 9. ed. rev., atual. e ampl. Rio de Janeiro: Forense, 2015.\u003c/p>\u003cp>BANDEIRA DE MELLO, Celso Antônio. \u003cb>Curso de direito administrativo\u003c/b>. 17. ed. rev. ampl. e atual. São Paulo: Malheiros, 2004.\u003c/p>\u003cp>BRANDELLI, Leonardo. \u003cb>Registro de imóveis\u003c/b>: eficácia material. Rio de Janeiro: Forense, 2016.\u003c/p>\u003cp>LEÃO JUNIOR, Paulo da Silva Martins. As formas previstas na legislação estadual e a competência para administração do patrimônio púbico imobiliário do Estado do Rio de Janeiro. \u003ci>In\u003c/i>: COUTINHO, José Roberto de Andrade (Org.). \u003cb>Direito Imobiliário Público\u003c/b>. Rio de Janeiro, Lumes Juris, 1997.\u003c/p>\u003cp>ABE, Nilma de Castro. \u003cb>Gestão do patrimônio público imobiliário: \u003c/b>aspectos jurídicos da destinação, delimitação, fiscalização e responsabilidade. 2. ed. rev. e atual. Belo Horizonte: Fórum, 2013.\u003c/p>"]}}]},{"id":"b34td5p4","type":"pagefooter","props":{"code":"Due diligence aplicada à gestão de imóveis públicos [M221]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncnd","credits":[{"role":"Conteúdo","name":"Carlos Alberto Sobral Coimbra Junior"},{"role":"Revisão","name":"Ana Tulia de Macedo, Claudson Moreira"},{"role":"design educacional","name":"Luís Henrique Lindner"},{"role":"versão","name":"Julho 2026"}],"__pullUp":false}}]}</script>

<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });

<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('title') || el.getAttribute('data-definition') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('span').textContent = def;
      document.body.appendChild(pop);

        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;

        ev.preventDefault();
        ev.stopPropagation();

        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };

      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
