<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M413 - Destinar um imóvel público - um problema imobiliário ou uma decisão de Estado","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"c5x9jj9w","text":"Por que este material importa?","hidden":false},{"id":"chd0n1zp","text":"Antes de escolher a destinação: \u003cspan style=\"font-weight: normal;\">que valor público o imóvel pode gerar?\u003c/span>","hidden":false},{"id":"cczs88xb","text":"Imóveis diferentes, soluções diferentes","hidden":false},{"id":"c1rwyllo","text":"O que considerar na escolha da destinação?","hidden":false},{"id":"cv3wzhhd","text":"Como transformar critérios em uma decisão de destinação?","hidden":false}]}},"blocks":[{"id":"bjpclbph","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bbnt51kf","type":"hero","props":{"kicker":"Fundamentos. estratégias e instrumentos de destinação patrimonial","kickerIcon":"milestone","title":"Destinar um imóvel público","byline":"um problema imobiliário ou uma decisão de Estado?","slot":"bbnt51kf__slot"}},{"id":"bj657k1f","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c5x9jj9w","type":"titulo","props":{"text":"Por que este material importa?","level":"h2"}},{"id":"cut1jo3a","type":"prose","props":{"html":"\u003cp>Destinar um imóvel público não é apenas escolher entre vender, ceder, alugar, construir ou manter determinado bem. A decisão envolve compreender a vocação do imóvel, sua inserção no território, as políticas públicas que pode apoiar, os custos e benefícios de cada alternativa e, sobretudo, o valor público que pode gerar para a sociedade.\u003c/p>\u003cp>Este material propõe justamente essa reflexão. Ele dialoga com conteúdos anteriores do Programa, que  apresentaram a função socioambiental da propriedade pública, os regimes de destinação e a relação entre patrimônio, território e políticas públicas. Aqui, o foco avança para uma questão central da gestão patrimonial: \u003cb>\u003cmark data-hl=\"petrol\">como pensar a destinação como uma decisão de Estado e não apenas como uma solução imobiliária?\u003c/mark>\u003c/b>\u003c/p>\u003cp>A leitura não apresenta uma fórmula pronta para decidir. Seu objetivo é ampliar o olhar sobre os critérios que precisam ser considerados e mostrar por que diferentes imóveis podem exigir soluções completamente diferentes.\u003c/p>"}},{"id":"box174vx","type":"callout","props":{"variant":"ear","tone":"attention","icon":"file-text","title":"Material adaptado","heading":"","children":"\u003cp>Este conteúdo foi adaptado para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos a partir do trabalho originalmente desenvolvido por \u003cb>Rodrigo Pessoa Trajano\u003c/b> em sua dissertação de mestrado em Administração Pública pela Fundação Getulio Vargas (FGV). As reflexões acadêmicas são retomadas aqui em linguagem mais direta e aplicadas aos desafios da gestão patrimonial pública.\u003c/p>"}}]},{"id":"bl74s5nw","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"chd0n1zp","type":"titulo","props":{"text":"Antes de escolher a destinação: \u003cspan style=\"font-weight: normal;\">que valor público o imóvel pode gerar?\u003c/span>","level":"h2"}},{"id":"cgwhks7y","type":"prose","props":{"html":"\u003cp>Quando se discute a destinação de um imóvel público, a pergunta quase sempre surge de forma simplificada.\u003c/p>"}},{"id":"bqq63zj9","type":"feature","props":{"columns":4,"card":true,"accent":"","layout":"top","items":[{"icon":"circle-dollar-sign","title":"","text":"\u003cb>Devemos vender?\u003c/b>"},{"icon":"house","title":"","text":"\u003cb>Devemos construir moradias?\u003c/b>"},{"icon":"hospital","title":"","text":"\u003cb>Devemos instalar um órgão público?\u003c/b>"},{"icon":"file-text","title":"","text":"\u003cb>Devemos alugar?\u003c/b>"}]}},{"id":"b3bryewv","type":"prose","props":{"html":"\u003cp>À primeira vista, parecem perguntas objetivas. Mas talvez a pergunta mais importante talvez seja outra:\u003c/p>"}},{"id":"bbhqy5b8","type":"feature","props":{"columns":1,"card":false,"accent":"var(--terra-600)","layout":"side","items":[{"icon":"circle-question-mark","title":"\u003cspan data-font=\"serif\">\u003ci>\u003cspan data-fs=\"body-lg\">\u003cmark style=\"\">\u003cspan style=\"font-weight: normal;\">Qual é a maior geração de \u003c/span>valor público\u003cspan style=\"font-weight: normal;\"> que este imóvel pode produzir para a sociedade?\u003c/span>\u003c/mark>\u003c/span>\u003c/i>\u003c/span>","text":"Essa mudança de perspectiva altera completamente a forma de enxergar o patrimônio imobiliário público.\u003cbr>"}]}},{"id":"b_mst17pfd_u9dc","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Durante muito tempo, os imóveis públicos foram tratados predominantemente sob duas óticas. Para alguns, representam apenas \u003cmark data-hl=\"petrol\">infraestrutura necessária ao funcionamento do Estado\u003c/mark>: locais onde funcionam escolas, hospitais, universidades, quartéis, repartições públicas e demais equipamentos destinados à prestação de serviços. Para outros, representam um \u003cmark data-hl=\"terra\">estoque patrimonial capaz de gerar receitas\u003c/mark> mediante alienações ou locações. \u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Ambas as visões captam dimensões importantes do patrimônio público, mas não esgotam suas possibilidades de utilização. \u003c/span>\u003c/p>"}},{"id":"bxrfmg77","type":"imagereveal","props":{"beforeLabel":"Geração de Receita","afterLabel":"Infraestrutura de Estado","beforeSlot":"bxrfmg77__beforeSlot","afterSlot":"bxrfmg77__afterSlot","heightMode":"adapted","caption":""}},{"id":"b_msuydyll_nehm","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Os imóveis públicos constituem\u003cmark> recursos estratégicos\u003c/mark> de que o Estado dispõe para implementar políticas públicas e atuar sobre o território. São ativos capazes de promover desenvolvimento econômico, reduzir desigualdades regionais, organizar o território, proteger o meio ambiente, fomentar cadeias produtivas, induzir investimentos privados, viabilizar infraestrutura, assegurar políticas habitacionais, preservar patrimônios históricos e culturais, garantir segurança nacional e fortalecer a presença do Estado em regiões estratégicas. \u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cb>Sua importância transcende o próprio mercado imobiliário.\u003c/b> \u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">A gestão patrimonial não deve ser compreendida apenas como administração de propriedades, mas como parte da atuação do Estado na implementação de políticas públicas, na organização do território e na geração de valor para a sociedade.\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">A literatura internacional demonstra que os Estados modernos deixam de tratar imóveis como meras instalações físicas para administrá-los como recursos estratégicos, alinhando eficiência operacional, sustentabilidade financeira e geração de valor público. Contudo, a gestão pública ainda enfrenta fragilidades críticas: inventários incompletos, ausência de visão estratégica e planejamento de longo prazo, escassez de dados qualificados e baixa articulação institucional. Tais gargalos comprometem a tomada de decisão, que se torna ainda mais desafiadora quando considerada a enorme diversidade do patrimônio imobiliário estatal.\u003c/span>\u003c/p>"}},{"id":"bq7cezop","type":"callout","props":{"variant":"ear","tone":"warning","icon":"alert-circle","title":"","heading":"","children":"\u003cp>A primeira decisão não é, necessariamente, escolher entre vender, ceder, alugar, construir ou manter. Antes disso, é preciso compreender o que aquele imóvel pode representar em seu contexto e quais resultados públicos diferentes alternativas de uso podem produzir.\u003c/p>"}}]},{"id":"bvv57yzc","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cczs88xb","type":"titulo","props":{"text":"Imóveis diferentes, soluções diferentes","level":"h2"}},{"id":"bewl3uzf","type":"prose","props":{"html":"\u003cp>O patrimônio público reúne imóveis muito diferentes entre si, inseridos em contextos territoriais, jurídicos, sociais, ambientais e econômicos igualmente diversos.\u003c/p>\u003cp>Uma área urbana consolidada possui desafios completamente distintos daqueles encontrados em uma gleba rural. Uma antiga estação ferroviária exige soluções diferentes das aplicáveis a um prédio histórico, uma área portuária, uma ilha oceânica, um terreno industrial, um aeroporto desativado, uma faixa de fronteira, uma floresta pública, um imóvel inserido em comunidade tradicional ou um edifício localizado no centro financeiro de uma capital.\u003c/p>"}},{"id":"bk5yx399","type":"callout","props":{"variant":"ear","tone":"info","icon":"house","title":"","heading":"","children":"\u003cp>\u003c/p>\u003cspan data-fs=\"body-lg\">\u003cp>\u003cspan data-color=\"petrol\">\u003c/span>\u003c/p>\u003c/span>\u003cspan data-font=\"display\">\u003cspan data-fs=\"body-lg\">\u003cp>\u003cspan data-color=\"petrol\">Cada imóvel possui limitações jurídicas, características físicas, contexto territorial, dinâmica econômica e potencialidades completamente distintas. Por isso, \u003cmark>as possibilidades de destinação variam enormemente\u003c/mark>. \u003c/span>\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Alguns imóveis possuem clara vocação para políticas habitacionais. Outros apresentam localização privilegiada para instalação de hospitais, escolas, universidades ou equipamentos administrativos. Há imóveis cuja melhor utilização pode ocorrer mediante concessões para exploração turística. Outros podem impulsionar polos logísticos, parques tecnológicos, áreas industriais ou projetos de infraestrutura. Existem imóveis cuja maior contribuição consiste na preservação ambiental ou na proteção de comunidades tradicionais. Há também aqueles cuja melhor alternativa pode ser sua alienação, especialmente quando não apresentam interesse público específico e quando o custo de sua manutenção supera os benefícios decorrentes de sua permanência no patrimônio estatal.\u003c/span>\u003c/p>\u003cp>\u003cb>Por exemplo\u003c/b>: um imóvel localizado em região industrial consolidada pode apresentar maior potencial para atrair investimentos, gerar empregos e ampliar a arrecadação tributária. Já um edifício histórico, situado no centro da cidade, talvez gere maior valor se restaurado para atividades culturais do que alienado ao mercado.\u003c/p>"}},{"id":"bp28ad5a","type":"prose","props":{"html":"\u003cp>\u003cmark data-hl=\"terra\">Nenhuma solução é universalmente correta.\u003c/mark> A alternativa mais adequada depende das características do imóvel, de sua inserção no território, das restrições existentes, das demandas da sociedade e dos objetivos das políticas públicas. \u003c/p>"}},{"id":"cdn5eouo","type":"titulo","props":{"text":"\u003cspan style=\"font-weight: normal;\">Nem automática, nem ignorada.\u003c/span> \u003cbr>Estratégica. ","level":"h3"}},{"id":"co7z3v33","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Se um imóvel público não deve ser destinado sem considerar a melhor geração de valor para a sociedade, tampouco deve ser mantido sem utilização indefinidamente apenas porque pertence ao Estado. A ausência de destinação também produz consequências.\u003c/span>\u003c/p>"}},{"id":"b71gfk2w","type":"callout","props":{"variant":"header","tone":"success","icon":"dollar-sign","title":"Quanto custa um imóvel ocioso?","heading":"","children":"\u003cp>Imóveis ociosos representam custos de m\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">anutenção,&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">de vigilância, d\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">e deterioração,&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">jurídicos e&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">administrativos.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Mas existe um custo frequentemente ignorado: o\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">&nbsp;\u003cb>custo de oportunidade\u003c/b>.&nbsp;\u003c/span>\u003c/p>","color":""}},{"id":"buehg3l4","type":"prose","props":{"html":"\u003cp>Cada imóvel mantido sem destinação representa uma oportunidade negligenciada de produzir valor econômico, social ou ambiental. Ao manter um terreno vazio, pode-se deixar de gerar moradias. Ao manter fechado um edifício público, pode-se deixar de oferecer serviços. Ao conservar improdutiva uma área com potencial para investimentos, pode-se deixar de criar empregos. Ao manter imóveis sem estratégia de utilização, o Estado também pode deixar de arrecadar receitas capazes de financiar políticas públicas.\u003c/p>"}},{"id":"btsob5zk","type":"markerlist","props":{"variant":"icon","icon":"alert-triangle","accent":"var(--terra-600)","items":[{"title":"\u003cspan style=\"font-weight: normal;\">\u003cspan data-color=\"terra\">Isso não significa que todo imóvel desocupado deva ser imediatamente destinado ou alienado. Em determinadas situações, sua preservação, manutenção como reserva patrimonial ou proteção para utilização futura também pode atender a um interesse público. O ponto é reconhecer que \u003cmark>manter um imóvel sem uso deve igualmente resultar de uma decisão fundamentada, e não simplesmente da ausência de decisão\u003c/mark>.\u003c/span>\u003c/span>\u003cbr>","text":""}]}},{"id":"bhedsuxe","type":"prose","props":{"html":"\u003cp>A literatura sobre gestão patrimonial identifica precisamente esse problema ao destacar que o Estado frequentemente administra seus imóveis como estruturas físicas, e não como ativos estratégicos, o que dificulta a otimização do uso do espaço, reduz a produtividade do patrimônio e limita sua capacidade de geração de receitas sustentáveis.\u003c/p>"}}]},{"id":"b7g0e9bu","type":"section","props":{"width":"wide","surface":"terra-dark","pad":"lg"},"children":[{"id":"brzmheen","type":"panel","props":{"variant":"box","kicker":"Exercitando seus conhecimentos","kickerIcon":"notebook-pen","title":"","color":"","bg":"var(--sand-50)","body":"\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"bpotdm0g","type":"figure","props":{"slot":"bpotdm0g__slot","src":"","fit":"contain","size":"full","title":"","caption":"\u003cbr>","credit":""}},{"id":"bjyl46ef","type":"prose","props":{"html":"\u003cp>\u003cspan data-fs=\"h5\">\u003cspan data-fs=\"h4\">Com base no que você estudou até aqui, qual seria a melhor destinação para o imóvel público da imagem acima?&nbsp;\u003c/span>\u003c/span>\u003c/p>"}}]},{"id":"b22ktrnd","type":"kicker","props":{"icon":"mouse-pointer","children":"Clique no cartão com a sua opção de destinação"}},{"id":"btqfuflj","type":"columns","props":{"count":"4","ratio":"equal","gap":"sm"},"children":[{"id":"b_msv98jgy_sjeb","type":"flashcard","props":{"term":"Habitação","description":"","definition":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Ainda não temos informações suficientes para decidir.\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Precisamos conhecer o imóvel, seu contexto, as demandas, as restrições, os custos e os resultados esperados.\u003c/span>\u003c/p>","icon":"home","color":"var(--slate-600)"}},{"id":"b19w7x7r","type":"flashcard","props":{"term":"Equipamento público","description":"","definition":"\u003cp>Ainda não temos informações suficientes para decidir.\u003c/p>\u003cp>Precisamos conhecer o imóvel, seu contexto, as demandas, as restrições, os custos e os resultados esperados.\u003c/p>","icon":"ferris-wheel","color":"var(--slate-600)"}},{"id":"b_msv98u2j_w7wx","type":"flashcard","props":{"term":"Alienação","description":"","definition":"\u003cp>Ainda não temos informações suficientes para decidir.\u003c/p>\u003cp>Precisamos conhecer o imóvel, seu contexto, as demandas, as restrições, os custos e os resultados esperados.\u003c/p>","icon":"circle-dollar-sign","color":"var(--slate-600)"}},{"id":"b_msv98zg4_7i1s","type":"flashcard","props":{"term":"Preservação","description":"","definition":"\u003cp>Ainda não temos informações suficientes para decidir.\u003c/p>\u003cp>Precisamos conhecer o imóvel, seu contexto, as demandas, as restrições, os custos e os resultados esperados.\u003c/p>","icon":"tree-deciduous","color":"var(--slate-600)"}}]}]},{"id":"b9ceymk1","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c1rwyllo","type":"titulo","props":{"text":"O que considerar na escolha da destinação?","level":"h2"}},{"id":"cflfb96h","type":"prose","props":{"html":"\u003cp>Reconhecer que não existe uma solução automática nos leva a um ponto central da destinação: \u003cb>a\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">&nbsp;resposta dificilmente será encontrada em critérios únicos.&nbsp;\u003c/span>\u003c/b>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">É necessário analisar as características, as possibilidades de uso e o contexto de cada imóvel. Destinar é uma decisão resultante da interação de diversos fatores, envolvendo as seguintes dimensões:\u003c/span>\u003c/p>"}},{"id":"bx2o33hp","type":"columns","props":{"count":"2","ratio":"equal","gap":"sm"},"children":[{"id":"bqneenb7","type":"flashcard","props":{"term":"Territorial e física","description":"","definition":"\u003cp>\u003cul>\u003cli>localização; \u003c/li>\u003cli>características físicas; \u003c/li>\u003cli>infraestrutura existente; \u003c/li>\u003cli>inserção e dinâmica territorial. \u003c/li>\u003c/ul>\u003c/p>","icon":"map-pinned","color":"var(--petrol-600)"}},{"id":"b_mst20yme_33ve","type":"flashcard","props":{"term":"Jurídica e urbanística","description":"","definition":"\u003cp>\u003c/p>\u003cul>\u003cli>regime jurídico e eventuais restrições aplicáveis ao imóvel; \u003c/li>\u003cli>Plano Diretor municipal; \u003c/li>\u003cli>zoneamento urbano; \u003c/li>\u003cli>demais regras de uso e ocupação do território. \u003c/li>\u003c/ul>\u003cp>\u003c/p>","icon":"scale","color":"var(--petrol-600)"}},{"id":"b_mst210mh_qeg3","type":"flashcard","props":{"term":"Social, ambiental e institucional","description":"","definition":"\u003cp>\u003c/p>\u003cul>\u003cli>\u003cspan style=\"color: inherit; font-family: inherit; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">demanda social; \u003c/span>\u003c/li>\u003cli>\u003cspan style=\"color: inherit; font-family: inherit; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">função  socioambiental da propriedade pública; \u003c/span>\u003c/li>\u003cli>\u003cspan style=\"color: inherit; font-family: inherit; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">sustentabilidade ambiental; \u003c/span>\u003c/li>\u003cli>\u003cspan style=\"color: inherit; font-family: inherit; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">necessidades dos órgãos públicos; \u003c/span>\u003c/li>\u003cli>\u003cspan style=\"color: inherit; font-family: inherit; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">interesse estratégico do Estado. \u003c/span> \u003c/li>\u003c/ul>\u003cp>\u003c/p>","icon":"sprout","color":"var(--petrol-600)"}},{"id":"b_mst211vv_rox6","type":"flashcard","props":{"term":"Econômica","description":"","definition":"\u003cp>\u003c/p>\u003cul>\u003cli>mercado imobiliário; \u003c/li>\u003cli>potencial econômico; \u003c/li>\u003cli>custos de manutenção; \u003c/li>\u003cli>potencial de geração de receitas e outros benefícios econômicos.\u003c/li>\u003c/ul>\u003cp>\u003c/p>","icon":"coins","color":"var(--petrol-600)"}}]},{"id":"b4v0slgs","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Cada um desses fatores pode influenciar a decisão. Um mesmo imóvel pode apresentar elevada rentabilidade financeira caso seja alugado. Outro poderá gerar maior benefício mediante alienação. Outro talvez jamais devesse deixar o patrimônio público.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Há situações em que vender produz maior eficiência. Imagine um imóvel de elevado valor de mercado, sem utilização pública previsível, localizado em região cuja valorização atingiu maturidade e cuja manutenção impõe custos crescentes ao Estado.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A alienação pode converter um ativo improdutivo em recursos financeiros imediatamente disponíveis para investimentos prioritários. Em outras circunstâncias, entretanto, vender significa abrir mão de uma fonte permanente de receitas.\u003c/span>\u003c/p>"}},{"id":"bjnchdx5","type":"callout","props":{"variant":"ear","tone":"note","icon":"lightbulb","title":"","heading":"","children":"\u003cp>Um edifício comercial bem localizado pode proporcionar rendimentos contínuos por décadas mediante locação, preservando simultaneamente o patrimônio estatal.\u003c/p>","color":""}},{"id":"b_mst27tk9_75g5","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Do ponto de vista econômico, a decisão depende de variáveis como expectativa de valorização imobiliária, taxa de ocupação, custos de manutenção, fluxo de caixa esperado, necessidade imediata de recursos, risco de mercado e horizonte temporal da política pública.\u003c/span>\u003c/p>\u003cp>Essas variáveis econômicas são importantes, mas representam apenas uma das dimensões da decisão. Uma alternativa economicamente atrativa, por exemplo, pode ser incompatível com as regras de uso do território ou com uma necessidade social prioritária. Da mesma forma, uma finalidade pública desejável pode encontrar limitações nas características físicas ou jurídicas do imóvel.\u003c/p>\u003cp>A destinação também precisa considerar os resultados sociais, ambientais, territoriais e institucionais que cada alternativa pode produzir. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Portanto, a discussão não deve ser reduzida à dicotomia entre vender ou manter.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">A decisão resulta justamente da análise conjunta desses diferentes elementos.\u003c/span>\u003c/p>"}},{"id":"bu6ge5yx","type":"panel","props":{"variant":"box","kicker":"valor público | o melhor retorno","kickerIcon":"blocks","title":"","color":"","bg":"","body":"\u003cp>O verdadeiro debate consiste em identificar\u003cb> qual alternativa produz maior valor público para a sociedade ao longo do tempo\u003c/b>. Esse valor, contudo, não pode ser medido exclusivamente em dinheiro.\u003c/p>"},"children":[{"id":"by0jcwmb","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b844j1kk","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-800)","items":[{"title":"Existem retornos financeiros.","text":""},{"title":"Existem retornos sociais.","text":""},{"title":"Existem retornos ambientais.","text":""}]}},{"id":"b_mst2czpr_f1y9","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--terra-800)","items":[{"title":"Existem retornos urbanos.","text":""},{"title":"Existem retornos institucionais.","text":""}]}}]},{"id":"brke9z09","type":"prose","props":{"html":"\u003cp>A dificuldade reside justamente em compatibilizar todos eles. \u003c/p>","__pullUp":true}}]}]},{"id":"bx5uf4qq","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"cv3wzhhd","type":"titulo","props":{"text":"Como transformar critérios em uma decisão de destinação?","level":"h2"}},{"id":"c6mcbx97","type":"prose","props":{"html":"\u003cp>Cada alternativa pode produzir resultados distintos e mobilizar diferentes dimensões do valor público discutidas anteriormente.\u003c/p>\u003cp>No caso dos imóveis rurais públicos, por exemplo, a decisão pode envolver alternativas como regularização fundiária, reforma agrária, conservação ambiental, concessões florestais, projetos de energia renovável, atividades produtivas ou preservação de comunidades tradicionais.\u003c/p>\u003cp>Uma área destinada à conservação ambiental pode gerar benefícios ecológicos de longo prazo. Outra, destinada à agricultura familiar, pode promover desenvolvimento regional e segurança alimentar. Uma terceira, utilizada para geração de energia renovável, pode contribuir para a transição energética e gerar receitas públicas.\u003c/p>"}},{"id":"bwugnm6u","type":"callout","props":{"variant":"header","tone":"warning","icon":"lightbulb","title":"importante","heading":"","children":"\u003cp>Os exemplos mostram que os critérios apresentados anteriormente não funcionam como uma lista de verificação capaz de indicar, automaticamente, a melhor destinação. Eles precisam ser analisados em conjunto e relacionados às alternativas concretamente possíveis para cada imóvel.\u003c/p>"}},{"id":"b_mst2yn2v_ycrg","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">O desafio da gestão patrimonial moderna consiste justamente em criar mecanismos capazes de comparar alternativas tão diferentes. \u003c/span>\u003c/p>\u003cp>Para você que atua com a gestão de imóveis públicos, esse desafio exige olhar para além de um único critério ou de uma solução previamente definida. Significa reunir e compreender as diferentes informações disponíveis sobre o imóvel, seu contexto e as alternativas possíveis, reconhecendo que aspectos jurídicos, territoriais, sociais, ambientais, institucionais e econômicos podem influenciar a decisão.\u003c/p>\u003cp>Essa perspectiva não significa que, individualmente, seja responsável por definir a destinação do imóvel. As decisões são tomadas no âmbito das competências e dos processos próprios de cada instituição. Significa, porém, compreender a complexidade dessas escolhas e reconhecer os diferentes elementos que precisam ser considerados na análise e na atuação profissional.\u003c/p>"}}]},{"id":"b7k0cnd9","type":"conclusion","props":{"kicker":"Para fechar","kickerIcon":"check","title":"Conclusão","body":"\u003cp>Ao longo deste material, partimos de uma pergunta aparentemente simples: \u003cb>\u003cspan data-color=\"ochre-light\">o que fazer com um imóvel público?\u003c/span>\u003c/b> Vimos, porém, que vender, alugar, manter, ceder, regularizar ou construir representam possibilidades que precisam ser consideradas diante das características e do contexto de cada imóvel e dos diferentes resultados que podem produzir.\u003c/p>\u003cp>Ao final, talvez a pergunta inicial continue sem resposta definitiva. E isso não representa um problema. Pelo contrário. Significa reconhecer que não existe solução única para um patrimônio cuja diversidade reflete a própria complexidade do Estado brasileiro. Talvez o verdadeiro desafio da gestão patrimonial não seja decidir entre vender, alugar, manter, ceder, regularizar ou construir. O verdadeiro desafio seja decidir, em cada caso concreto, qual destinação melhor transforma um patrimônio público em benefício público. \u003c/p>\u003cp>Nessa perspectiva, mais importante do que assumir previamente que um imóvel deve permanecer no patrimônio, ser alienado ou receber determinado uso, é compreender o valor que as diferentes alternativas podem produzir para a sociedade.\u003c/p>\u003cp>Essa reflexão convida a ampliar o olhar sobre o patrimônio. Além de conhecer procedimentos e instrumentos, é importante compreender o imóvel em seu contexto e perceber como as informações produzidas, as análises realizadas e as alternativas consideradas podem contribuir para decisões voltadas ao desenvolvimento, à eficiência administrativa, à justiça territorial e à promoção do interesse coletivo.\u003c/p>"},"children":[{"id":"berl172h","type":"panel","props":{"variant":"box","kicker":"Para refletir","kickerIcon":"brain","title":"","color":"","bg":"","body":"\u003cp>A destinação de um imóvel público envolve escolhas que podem produzir resultados muito diferentes. Pensando nos desafios discutidos ao longo deste material, reflita:\u003c/p>"},"children":[{"id":"bemmw118","type":"feature","props":{"columns":1,"card":false,"accent":"var(--terra-500)","layout":"side","items":[{"icon":"circle-question-mark","title":"","text":"\u003cspan data-fs=\"body\">Na sua atuação, que aspectos tendem a receber mais atenção na análise de uma destinação? Há dimensões (territoriais, sociais, ambientais, econômicas ou institucionais) que podem acabar sendo menos consideradas? \u003c/span>"},{"icon":"circle-question-mark","title":"","text":"\u003cspan data-fs=\"body\">Como evitar que uma solução aparentemente adequada à primeira vista seja adotada sem que outras possibilidades tenham sido suficientemente avaliadas? \u003c/span>"},{"icon":"circle-question-mark","title":"","text":"\u003cspan data-fs=\"body\">O que torna difícil comparar alternativas de destinação que podem gerar benefícios de naturezas tão diferentes para a sociedade? \u003c/span>"},{"icon":"circle-question-mark","title":"","text":"\u003cspan data-fs=\"body\">Considerando o seu papel no processo, como você pode contribuir para que a decisão sobre a destinação seja mais bem informada e considere o imóvel, seu contexto e as diferentes possibilidades de geração de valor público?\u003c/span>"}]}}]},{"id":"bo51knuk","type":"referencias","props":{"title":"Este material foi adaptado de","defaultOpen":true,"items":["TRAJANO, Rodrigo Pessoa. \u003cb>A estratégia de gestão dos imóveis públicos da União.\u003c/b> 2023. Dissertação (Mestrado Profissional em Administração Pública) – Escola Brasileira de Administração Pública e de Empresas, Fundação Getulio Vargas, Rio de Janeiro, 2023. Disponível em: \u003ca href=\"https://hdl.handle.net/10438/34196\" target=\"_blank\" rel=\"noopener noreferrer\">https://hdl.handle.net/10438/34196\u003c/a>. Acesso em: 16 ago. 2026."]}}]},{"id":"buzt4eye","type":"pagefooter","props":{"code":"Destinar um imóvel público: um problema imobiliário ou uma decisão de Estado? [M413] ","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Conteúdo","name":"Rodrigo Pessoa Trajano"},{"role":"Revisão","name":"Claudson Moreira"},{"role":"Design Educacional","name":"Luís Henrique Lindner"},{"role":"Versão","name":"Agosto de 2026"}]}}]}</script>

4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4\"/>\u003cpath d=\"M5 21h14\"/>","tree-deciduous":"\u003cpath d=\"M8 19a4 4 0 0 1-2.24-7.32A3.5 3.5 0 0 1 9 6.03V6a3 3 0 1 1 6 0v.04a3.5 3.5 0 0 1 3.24 5.65A4 4 0 0 1 16 19Z\"/>\u003cpath d=\"M12 19v3\"/>"}</script>

<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();

<script>
(function(){
  var popById = {};

  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');

    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');

        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }

    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;

      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();

      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');

      el.removeAttribute('title');

      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;

        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');

        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }

  window.addEventListener('scroll',repositionOpen,true);

  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
