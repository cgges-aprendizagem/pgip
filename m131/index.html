<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M131 - Arquitetura normativa da gestão de bens imóveis públicos no Brasil","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"cylj3zsh","text":"Um sistema normativo, e não uma única lei patrimonial","hidden":false},{"id":"cj0uy7j8","text":"Camada 1: Bens públicos, titularidade e competências","hidden":false},{"id":"b_msiaag6w_wm7g","text":"Camada 2: Administração&nbsp; patrimonial imobiliária pública ","hidden":false},{"id":"cepp8lva","text":"Camada 3: Segurança jurídica, registro e propriedade ","hidden":false},{"id":"c1l9qvwd","text":"Camada 4: Território, ambiente e função socioambiental ","hidden":false},{"id":"c5cftkyc","text":"Como as camadas se conectam","hidden":false},{"id":"c6164bud","text":"Fluxo de análise normativa para Gestão de Imóveis Públicos","hidden":false}]}},"blocks":[{"id":"bjmfuhk2","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"behapctr","type":"hero","props":{"kicker":"Governança e Regulação da propriedade pública","kickerIcon":"scale","title":"Arquitetura normativa da gestão de bens imóveis públicos no Brasil","byline":"Compreendendo os principais marcos normativos que orientam a gestão dos imóveis públicos","slot":"behapctr__slot"}},{"id":"b1wwoqfi","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"b1ctnkgd","type":"callout","props":{"variant":"ear","tone":"attention","icon":"lightbulb","title":"Antes de iniciar","heading":"","children":"\u003cp>O material \u003cb>\u003ca href=\"https://cgges-aprendizagem.github.io/pgip/m121/\" target=\"_blank\" rel=\"noopener noreferrer\">Bens imóveis públicos: classificação e titularidade\u003c/a>\u003c/b> apresenta conceitos relacionados aos bens imóveis públicos e à sua natureza jurídica. Se você ainda não viu, vale a pena conhecê-lo, pois oferece referências importantes para a compreensão dos temas abordados aqui.  \u003c/p>\u003cp>No presente material, ampliamos o olhar: o foco passa do imóvel público em si para a sua gestão e para as diferentes dimensões normativas que incidem sobre ela.  \u003c/p>"}},{"id":"bkzion68","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A gestão de imóveis públicos é orientada por um amplo conjunto de normas. Algumas tratam diretamente do patrimônio de cada ente federativo; outras disciplinam matérias que também incidem sobre sua gestão, como direitos reais, registros públicos, ordenamento urbano, proteção ambiental, regularização fundiária, contratações e contabilidade pública. \u003c/span>\u003c/p>\u003cp>Essa multiplicidade está relacionada às próprias características da propriedade pública. A relação da Administração com seus bens possui especificidades em relação à propriedade privada, uma vez que o patrimônio público está vinculado à realização de finalidades de interesse público. Por isso, \u003cmark>sua gestão não pode ser compreendida apenas a partir das normas que definem e classificam os bens públicos, mas requer a consideração dos diferentes regimes jurídicos que incidem sobre o imóvel e sobre as decisões relativas ao seu uso, proteção e administração\u003c/mark> (Baptista, 2017).  \u003c/p>\u003cp>A compreensão dos imóveis públicos também não se limita à identificação de sua titularidade. A perspectiva jurídico-administrativa incorpora uma dimensão funcional, que considera a finalidade e o uso atribuídos ao bem. Titularidade e função são, assim, elementos complementares para compreender a gestão dos bens públicos (Cristóvam e Bertoncini, 2019). \u003c/p>\u003cp>Chamamos aqui de \u003cb>arquitetura normativa da gestão patrimonial imobiliária pública\u003c/b> a \u003cmark data-hl=\"green\">organização didática dos diferentes conjuntos normativos que incidem sobre a gestão de um imóvel público\u003c/mark>. Essa organização não corresponde a uma hierarquia normativa nem a uma classificação jurídica rígida: trata-se de um modelo elaborado para fins de compreensão e aprendizagem, que evidencia como diferentes regimes se articulam em torno de uma mesma decisão patrimonial. Essa perspectiva também se conecta a outros temas do Programa, como a distribuição de competências entre instituições, o ordenamento territorial, o registro imobiliário e os processos e instrumentos da gestão de imóveis públicos. \u003c/p>"}},{"id":"bzhhhy05","type":"callout","props":{"variant":"header","tone":"info","icon":"lightbulb","title":"Vale reforçar\u003cbr>","heading":"","children":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Como destacamos lá no início, os conceitos de bem imóvel público, sua classificação e titularidade são explorados com mais profundidade no material \u003ca href=\"https://cgges-aprendizagem.github.io/pgip/m121/\" target=\"_blank\" rel=\"noopener noreferrer\">\u003cb>Bens imóveis públicos: classificação e titularidade\u003c/b>\u003c/a>. Se quiser retomar ou aprofundar esses conceitos, recomendamos a leitura antes de seguir para as demais camadas. \u003c/span>\u003c/p>"}}]},{"id":"bs46778t","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"cylj3zsh","type":"titulo","props":{"text":"Um sistema normativo, e não uma única lei patrimonial","level":"h2"}},{"id":"cjkrhen4","type":"prose","props":{"html":"\u003cp>A gestão patrimonial imobiliária pública se caracteriza por demandar uma abordagem necessariamente\u003cmark> interdisciplinar e sistêmica\u003c/mark>. Embora essa seja uma característica comum ao Direito brasileiro, a disciplina dos imóveis públicos não se concentra em um único ramo do Direito, sendo construída a partir da interpretação sistêmica entre normas dispersas em diferentes níveis (constitucionais, legais e infralegais). Não se trata de uma exceção à lógica do ordenamento jurídico brasileiro, mas de um campo em que essa característica se manifesta de forma particularmente evidente, exigindo do gestor a integração de conceitos e institutos de diferentes naturezas. Essa complexidade decorre da própria natureza dos bens imóveis.\u003c/p>"}},{"id":"bwxetn0k","type":"pullquote","props":{"variant":"block","fontSize":"auto","children":"Um imóvel público é simultaneamente um ativo patrimonial, um bem jurídico, uma parcela do território, um elemento ambiental e, também, um instrumento de implementação de políticas públicas. ","cite":""}},{"id":"bi2cwdf1","type":"prose","props":{"html":"\u003cp>Sua gestão envolve desde questões relacionadas à propriedade e ao registro imobiliário até aspectos ligados ao planejamento urbano, à proteção ambiental, ao combate às desigualdades, à regularização fundiária, à contabilidade pública e às contratações administrativas.\u003c/p>\u003cp>Por essa razão, compreender a gestão patrimonial exige mais do que conhecer leis específicas sobre imóveis públicos. É necessário compreender \u003cmark>como diferentes conjuntos normativos se relacionam e se complementam\u003c/mark> para formar uma arquitetura regulatória ampla e integrada.\u003c/p>"}},{"id":"b51zyrog","type":"callout","props":{"variant":"ear","tone":"attention","icon":"lightbulb","title":"","heading":"","children":"\u003cp>O objetivo deste material não é apresentar todas as normas aplicáveis à gestão patrimonial, mas ajudar você a entender \u003cb>a estrutura geral desse sistema normativo\u003c/b>: quais tipos de normas incidem sobre a gestão dos imóveis públicos, como elas se conectam e por que a gestão patrimonial exige uma leitura integrada entre patrimônio, território, ambiente, registro, contratação pública e função socioambiental.\u003c/p>"}},{"id":"bsj169ma","type":"prose","props":{"html":"\u003cp>Para apresentar de forma simples e sistematizada o amplo conjunto de normas que incidem sobre a gestão dos bens imóveis públicos, adotamos uma organização em \u003cb>quatro grandes camadas\u003c/b>. Trata-se de um modelo desenvolvido com finalidade didática, que busca reunir conjuntos de normas relacionados entre si e evidenciar as conexões entre eles. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A primeira reúne as normas que definem e caracterizam o objeto da gestão patrimonial, tratando da natureza, classificação e titularidade dos bens públicos. A segunda reúne as normas diretamente relacionadas à sua administração. A terceira trata da propriedade, dos direitos sobre os imóveis, do registro e da segurança jurídica. A quarta reúne normas de outros campos que, embora não sejam propriamente patrimoniais, incidem diretamente sobre a gestão dos imóveis em razão de sua localização, características ou finalidade. \u003c/span>\u003c/p>"}},{"id":"bghfckv9","type":"callout","props":{"variant":"header","tone":"warning","icon":"alert-circle","title":"importante","heading":"","children":"\u003cp>As camadas apresentadas neste material foram organizadas apenas para facilitar o estudo. Elas agrupam temas relacionados à gestão patrimonial e não representam uma ordem de importância ou uma hierarquia entre as normas jurídicas.\u003c/p>"}}]},{"id":"bjs338v8","type":"section","props":{"width":"content","surface":"terra-dark","pad":"lg"},"children":[{"id":"bc5b05dh","type":"figure","props":{"slot":"bc5b05dh__slot","src":"","fit":"contain","size":"full","title":"ARQUITETURA NORMATIVA DA GESTÃO PATRIMONIAL IMOBILIÁRIA","caption":"","credit":""}}]},{"id":"bflwiue3","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"byfa0m2h","type":"kicker","props":{"icon":"compass","children":"Explore as camadas"}},{"id":"cj0uy7j8","type":"titulo","props":{"text":"Camada 1: Bens públicos, titularidade e competências","level":"h2"}},{"id":"b2anumop","type":"prose","props":{"html":"\u003cp>A primeira camada reúne normas que ajudam a responder a questões fundamentais para a gestão patrimonial: \u003cmark data-hl=\"sand\">o que caracteriza um bem como público, a qual ente federativo ele pertence e como se distribuem as competências relacionadas à sua gestão\u003c/mark>.\u003c/p>\u003cp>A Constituição Federal ocupa posição central nessa estrutura. Ela enumera os bens pertencentes à União e aos estados e estabelece a repartição de competências entre União, estados, Distrito Federal e municípios. Essa distribuição é importante porque diferentes entes podem exercer competências legislativas ou administrativas sobre matérias que incidem na gestão de um mesmo imóvel.\u003c/p>"}},{"id":"b99gvmr1","type":"callout","props":{"variant":"ear","tone":"attention","icon":"lightbulb","title":"","heading":"","children":"\u003cp>Essa repartição de competências é um dos elementos centrais da gestão patrimonial brasileira. Embora cada ente federativo tenha autonomia para administrar seus próprios imóveis, nem todas as matérias podem ser disciplinadas localmente. Questões relacionadas à propriedade, aos registros públicos, à desapropriação, ao direito agrário e às normas gerais de licitações e contratos, por exemplo, dependem de legislação federal ou de normas nacionais. \u003c/p>"}},{"id":"btk9g12u","type":"prose","props":{"html":"\u003cp>A definição geral dos bens públicos, por sua vez, é estabelecida pelo Código Civil, que considera públicos os bens do domínio nacional pertencentes às pessoas jurídicas de direito público interno e os classifica, quanto à destinação, em bens de uso comum do povo, de uso especial e dominicais.\u003c/p>\u003cp>Essa camada reúne, portanto, as normas fundamentais para identificar a natureza pública do bem, sua titularidade e a distribuição de competências entre os entes federativos, elementos estes que condicionam a aplicação dos demais conjuntos normativos examinados nas camadas seguintes.\u003c/p>"}},{"id":"bo18w2q0","type":"kicker","props":{"icon":"scale","children":"Principais marcos normativos"}},{"id":"bc63vk69","type":"accordion","props":{"numbered":false,"items":[{"title":"Constituição Federal de 1988","content":"\u003cul>\u003cli>Art. 20 – Bens da União \u003c/li>\u003cli>\u003cspan style=\"color: inherit;\">Art. 23 – Competências comuns \u003c/span>\u003c/li>\u003cli>\u003cspan style=\"color: inherit;\">Art. 24 – Competências concorrentes \u003c/span>\u003c/li>\u003cli>\u003cspan style=\"color: inherit;\">Arts. 25 e 26 – Competências e bens dos Estados\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"color: inherit;\">Art. 30 – Competências municipais\u003c/span>\u003c/li>\u003c/ul>","linkHref":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","linkLabel":"Confira o marco completo","linkButton":"primary","blocks":[]},{"title":"Código Civil — Lei nº 10.406/2002","content":"\u003cul>\u003cli>Art. 98 — Definição de bens públicos&nbsp;\u003c/li>\u003cli>Art. 99 — Classificação dos bens públicos&nbsp;\u003c/li>\u003cli>Arts. 100 a 103 — Regras gerais relativas aos bens públicos\u003c/li>\u003c/ul>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","linkLabel":"Confira o marco completo","linkButton":"primary"}]}}]},{"id":"b_msiaag6w_jnxr","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"b_msiaag6w_wm7g","type":"titulo","props":{"text":"Camada 2: Administração&nbsp; patrimonial imobiliária pública ","level":"h2"}},{"id":"b_msiaag6w_a2wy","type":"prose","props":{"html":"\u003cp>A segunda camada reúne as normas que disciplinam diretamente a administração dos bens imóveis públicos. É o núcleo executivo da gestão patrimonial e concentra os instrumentos utilizados pelos órgãos responsáveis para adquirir, cadastrar, avaliar, utilizar, proteger e destinar seus imóveis, ou seja, para executar a gestão desse patrimônio. \u003c/p>\u003cp>Tradicionalmente, essa dimensão é associada às atividades patrimoniais clássicas, como\u003cmark data-hl=\"petrol\"> aquisição, incorporação, cadastro, avaliação, destinação, alienação, fiscalização e manutenção\u003c/mark>. São essas normas que permitem ao Estado identificar seus imóveis, reconhecer direitos, formalizar instrumentos de utilização, controlar ocupações e promover a adequada gestão do patrimônio imobiliário. \u003c/p>"}},{"id":"b_msiaag6w_a2l3","type":"callout","props":{"variant":"ear","tone":"info","icon":"alert-circle","title":"","heading":"","children":"\u003cp>A gestão patrimonial não se limita às normas patrimoniais propriamente ditas. Grande parte das atividades relacionadas aos imóveis depende também de regras de licitação e contratação pública. A aquisição, a alienação e a locação de de imóveis pela Administração, a concessão de direito real de uso e diversos outros instrumentos estão sujeitos às normas federais.\u003c/p>"}},{"id":"b_msiaag6w_6tm8","type":"prose","props":{"html":"\u003cp>Outro componente fundamental dessa camada é a \u003cb>contabilidade patrimonial\u003c/b>. Os imóveis públicos representam parcela significativa do patrimônio dos entes federativos e precisam ser corretamente reconhecidos, avaliados, reavaliados e evidenciados nas demonstrações contábeis. Nesse contexto, instrumentos como o \u003cmark data-hl=\"green\">Manual de Contabilidade Aplicada ao Setor Público (MCASP)\u003c/mark> e as \u003cmark data-hl=\"green\">Normas Brasileiras de Contabilidade Aplicadas ao Setor Público (NBC TSP)\u003c/mark> desempenham papel essencial para assegurar transparência, comparabilidade e qualidade das informações patrimoniais. \u003c/p>\u003cp>Por reunir normas relacionadas à gestão, à contratação e à contabilização dos imóveis públicos, esta camada representa o núcleo mais visível da administração patrimonial e aquele com o qual os gestores normalmente possuem contato mais direto. \u003c/p>\u003cp>Embora existam marcos normativos nacionais relevantes, especialmente para a gestão dos imóveis da União, cada estado, o Distrito Federal e os municípios possuem competência para disciplinar a administração de seus próprios patrimônios imobiliários. Por essa razão, a gestão patrimonial brasileira é complementada por um amplo conjunto de leis, decretos, regulamentos e normas internas que tratam de temas como aquisição, cadastro, destinação, alienação, avaliação, fiscalização e arrecadação patrimonial. Essas normas refletem as particularidades institucionais e territoriais de cada ente federativo, mas devem observar os princípios constitucionais e as normas gerais aplicáveis em âmbito nacional. \u003c/p>"}},{"id":"b_msiaag6w_wnto","type":"kicker","props":{"icon":"scale","children":"Principais marcos normativos"}},{"id":"b_msiaag6w_vol9","type":"accordion","props":{"numbered":false,"items":[{"title":"Decreto-Lei nº 9.760/1946 ","content":"\u003cp>Principal marco histórico da administração dos bens imóveis da União. Disciplina a identificação, demarcação, utilização, ocupação e diversos regimes patrimoniais aplicáveis aos imóveis federais. \u003c/p>\u003cp>\u003c/p>\u003cp>\u003ci style=\"\">\u003cspan data-font=\"serif\">\u003cspan data-color=\"terra\">Embora aplicável à União, constitui uma das principais referências históricas e conceituais da gestão patrimonial imobiliária brasileira. \u003c/span>\u003c/span>\u003c/i>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del9760.htm","linkLabel":"Confira o Decreto completo","linkButton":"secondary","blocks":[]},{"title":"Lei nº 9.636/1998 ","content":"\u003cp>Principal marco contemporâneo da gestão dos imóveis da União. Regulamenta aquisição, incorporação, cadastro, avaliação, destinação, utilização, alienação e regularização fundiária de imóveis federais. \u003c/p>\u003cp>\u003ci>\u003cspan data-font=\"serif\">\u003cspan data-color=\"terra\">Apresenta diversos instrumentos e conceitos que influenciam práticas adotadas por outros entes federativos. \u003c/span>\u003c/span>\u003c/i>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/l9636.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Leis patrimoniais estaduais, distritais e municipais ","content":"\u003cp>Cada ente federativo possui competência para disciplinar a gestão de seus próprios bens imóveis. Essas normas tratam de temas como aquisição, incorporação, cadastro, avaliação, utilização, cessão, concessão de uso, alienação, regularização patrimonial, arrecadação de receitas patrimoniais, fiscalização e proteção dos imóveis públicos. \u003c/p>\u003cp>\u003ci>\u003cspan data-font=\"serif\">\u003cspan data-color=\"terra\">Constituem a principal base normativa da gestão patrimonial cotidiana dos estados, do Distrito Federal e dos municípios, complementando as normas gerais e os princípios estabelecidos pela Constituição e pela legislação nacional. \u003c/span>\u003c/span>\u003c/i>\u003c/p>","linkHref":"","linkLabel":"","linkButton":"secondary"},{"title":"Lei nº 14.133/2021 ","content":"\u003cp>Estabelece normas gerais de licitações e contratação e contém disposições aplicáveis a determinadas operações envolvendo imóveis públicos, especialmente alienação, além da aquisição e locação de imóveis pela Administração.\u003c/p>\u003cp>\u003ci style=\"text-wrap-mode: initial; color: rgb(158, 61, 32); font-family: Spectral, Georgia, &quot;Times New Roman&quot;, serif;\">Dispositivos de destaque:\u003c/i>\u003c/p>\u003cspan data-font=\"serif\">\u003cspan data-color=\"terra\">\u003cp>\u003c/p>\u003cul>\u003cli>\u003ci>Art. 74, V – aquisição ou locação de imóvel cujas características de instalações e de localização tornem necessária sua escolha.&nbsp;\u003c/i>\u003c/li>\u003cli>\u003ci>Arts. 76 e 77 – Alienação de bens públicos.  \u003c/i>\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003c/span>\u003c/span>","linkHref":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Manual de Contabilidade Aplicada ao Setor Público (MCASP)","content":"\u003cp>Principal referência nacional para contabilização dos ativos imobiliários públicos, aplicável à União, estados, Distrito Federal e municípios. \u003c/p>\u003cp>\u003ci>\u003c/i>\u003c/p>\u003cspan data-font=\"serif\">\u003cp>\u003ci>\u003c/i>\u003c/p>\u003cspan data-color=\"terra\">\u003cp>\u003ci>Conteúdo de destaque: \u003c/i>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>reconhecimento patrimonial;  \u003c/i>\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>mensuração e reavaliação;  \u003c/i>\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>evidenciação contábil dos imóveis públicos.\u003c/i>\u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003c/span>\u003c/span>","linkHref":"https://www.gov.br/tesouronacional/pt-br/contabilidade-e-custos/manuais","linkLabel":"Confira o Manual completo","linkButton":"secondary"}]}}]},{"id":"bytjczpv","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cepp8lva","type":"titulo","props":{"text":"Camada 3: Segurança jurídica, registro e propriedade ","level":"h2"}},{"id":"c9dm848x","type":"prose","props":{"html":"\u003cp>A gestão patrimonial depende não apenas da existência física dos imóveis, mas também da segurança jurídica associada aos direitos que incidem sobre eles. É essa a função da terceira camada normativa. \u003c/p>\u003cp>Essa camada reúne normas e instrumentos que contribuem para identificar e qualificar juridicamente os direitos incidentes sobre os imóveis, dar publicidade às situações jurídicas registráveis e conferir segurança às relações patrimoniais.\u003c/p>"}},{"id":"b6irbkim","type":"callout","props":{"variant":"ear","tone":"success","icon":"lightbulb","title":"","heading":"","children":"\u003cp>O registro imobiliário ocupa papel central nessa camada. É por meio dele que parte dos direitos sobre os imóveis são formalizados, publicizados e protegidos perante terceiros. Matrículas, averbações, registros de aquisição, alienação e constituição de direitos reais são exemplos de instrumentos fundamentais para a segurança jurídica do patrimônio público. \u003c/p>"}},{"id":"bzkl4f0x","type":"prose","props":{"html":"\u003cp>A evolução da legislação cadastral e registral também tem ampliado a integração entre informações jurídicas, cadastrais e geoespaciais. Nesse contexto, sistemas e cadastros Sistema de Gestão Fundiária (SIGEF), o Cadastro Ambiental Rural (CAR), o Cadastro Imobiliário Brasileiro (CIB} e os serviços eletrônicos dos registros de imóveis vêm ampliando as possibilidades de integração entre informações cadastrais, registrais e geoespaciais\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">.\u003c/span>\u003c/p>\u003cp>\u003cmark data-hl=\"terra\">Para a gestão patrimonial, essa integração é estratégica\u003c/mark>. Não basta saber que um imóvel pertence ao Estado; é necessário que essa condição esteja juridicamente demonstrada, registrada e apoiada em informações consistentes. A ausência de regularidade dominial ou registral pode comprometer ou limitar destinações, dificultar regularizações fundiárias, gerar conflitos e limitar a implementação de políticas públicas. \u003c/p>"}},{"id":"brir676f","type":"pullquote","props":{"variant":"block","fontSize":"auto","children":"Por essa razão, patrimônio, cadastro, registro e segurança jurídica constituem dimensões inseparáveis da gestão patrimonial. ","cite":""}},{"id":"b1lgq4eo","type":"kicker","props":{"icon":"scale","children":"Principais marcos normativos"}},{"id":"bia6xcnx","type":"accordion","props":{"numbered":false,"items":[{"title":"Código Civil (Lei nº 10.406/2002) ","content":"\u003cp>Disciplina propriedade, posse, direitos reais, usucapião, superfície, servidões e demais institutos fundamentais para a gestão patrimonial. \u003c/p>\u003cp>\u003c/p>\u003cspan data-color=\"terra\">\u003ci>\u003cp>\u003c/p>\u003cspan data-font=\"serif\">\u003cp>Dispositivos de destaque: \u003c/p>\u003cp>\u003cul>\u003cli>Arts. 1.196 a 1.224 – Posse  \u003c/li>\u003cli>Arts. 1.225 a 1.510-E – Direitos reais  \u003c/li>\u003c/ul>\u003c/p>\u003c/span>\u003cp>\u003c/p>\u003c/i>\u003c/span>\u003cp>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Lei nº 6.015/1973 (Lei de Registros Públicos) ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Estrutura o sistema registral brasileiro e disciplina matrículas, registros e averbações imobiliárias. \u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003cspan data-font=\"serif\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003cspan data-color=\"terra\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Dispositivos de destaque: \u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Arts. 167 a 288 – Registro de imóveis  \u003c/i>\u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/l6015compilada.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Lei nº 10.267/2001 ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Institui o georreferenciamento obrigatório dos imóveis rurais e promove a integração entre cadastro e registro. \u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003cspan data-font=\"serif\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003cspan data-color=\"terra\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Dispositivos de destaque: \u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Alterações na Lei de Registros Públicos  \u003c/i>\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Certificação de imóveis rurais  \u003c/i>\u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/leis_2001/l10267.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Decreto nº 11.208/2022 (Cadastro Imobiliário Brasileiro – CIB) ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Dispõe sobre o Sistema Nacional de Gestão de Informações Territoriais e sobre o Cadastro Imobiliário Brasileiro e regula o compartilhamento de dados relativos a bens imóveis. \u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003cspan data-color=\"terra\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003cspan data-font=\"serif\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Destaques: \u003c/i>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Integração de cadastros públicos e privados  \u003c/i>\u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>Criação do \u003cspan data-term=\"BICE\" data-definition=\"Nos termos do art. 3°, XII, do decreto em questão:&lt;p&gt;Bens públicos ou privados de uso especial e os bens do patrimônio cultural integrantes do domínio da União, dos Estados, do Distrito Federal e dos Municípios, incluído o espaço aéreo sobre esses bens, o subsolo e as áreas do mar territorial, da zona econômica exclusiva e da plataforma continental, como:&lt;/p&gt;&lt;p&gt;a) usinas nucleares, hidrelétricas e termoelétricas;&lt;/p&gt;&lt;p&gt;b) parques eólicos e plantas solares;&lt;/p&gt;&lt;p&gt;c) plataformas, sondas de prospecção e plantas de refino de petróleo e gás;&lt;/p&gt;&lt;p&gt;d) portos, eclusas, aeroportos e terminais rodoviários, ferroviários e hidroviários;&lt;/p&gt;&lt;p&gt;e) aquedutos, gasodutos e minerodutos;&lt;/p&gt;&lt;p&gt;f) aquíferos e jazidas minerais;&lt;/p&gt;&lt;p&gt;g) rodovias, estradas, vias vicinais, túneis, pontes e viadutos;&lt;/p&gt;&lt;p&gt;h) praças e logradouros;&lt;/p&gt;&lt;p&gt;i) museus, prédios, monumentos históricos e sítios arqueológicos;&lt;/p&gt;&lt;p&gt;j) terras indígenas e terras devolutas;&lt;/p&gt;&lt;p&gt;k) lagos, lagoas, rios, quedas-d’água, reservatórios de barragens, açudes, cursos-d’água navegáveis, mananciais e espelhos-d’água; e&lt;/p&gt;&lt;p&gt;l) parques, florestas, áreas ambientais e unidades de conservação.&lt;/p&gt;\">BICE\u003c/span> (Banco de Identificação Cadastral de Imóveis)  \u003c/i>\u003c/span>\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/decreto/d11208.htm","linkLabel":"Confira o Decreto completo","linkButton":"secondary"},{"title":"Lei nº 14.382/2022 ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Marco da modernização do sistema registral brasileiro e da implantação do Sistema Eletrônico dos Registros Públicos (SERP).  \u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/l14382.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"}]}}]},{"id":"b19mupfl","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"c1l9qvwd","type":"titulo","props":{"text":"Camada 4: Território, ambiente e função socioambiental ","level":"h2"}},{"id":"c0h9lq7l","type":"prose","props":{"html":"\u003cp>A quarta camada reúne normas que não são, em sua maioria, normas de gestão patrimonial propriamente ditas. São normas urbanísticas, ambientais, fundiárias, costeiras, culturais e de outros campos que possuem objetos próprios, mas incidem diretamente sobre a gestão dos imóveis públicos, condicionando possibilidades de uso, ocupação, proteção, transformação e destinação.\u003c/p>\u003cp>Todo imóvel público está inserido em um território e sujeito às normas aplicáveis à sua localização, às suas características e à finalidade pretendida. Por isso, \u003cmark data-hl=\"green\">uma decisão patrimonial não pode considerar apenas quem é o proprietário ou qual instrumento de gestão será utilizado: é necessário identificar também os demais regimes jurídicos que incidem sobre aquele imóvel\u003c/mark>.\u003c/p>"}},{"id":"b8i5uy6i","type":"contentslider","props":{"hint":"Confira as dimensões desta camada","accent":"var(--green-700)","showTabNumbers":false,"slides":[{"showImage":false,"slot":"b8i5uy6i__slides_1_slot","alt":"","caption":"","labelIcon":"ruler-dimension-line","label":"","tabLabel":"Ordenamento urbano","title":"Ordenamento urbano","subtitle":"","description":"No ambiente urbano, a gestão dos imóveis públicos se relaciona diretamente com as normas de planejamento, uso, ocupação e parcelamento do solo. A Constituição atribui aos municípios a promoção do adequado ordenamento territorial e estabelece o Plano Diretor como instrumento básico da política de desenvolvimento e expansão urbana. O Estatuto da Cidade disciplina diretrizes e instrumentos da política urbana, enquanto a Lei nº 6.766/1979 estabelece normas sobre o parcelamento do solo urbano, especialmente por meio de loteamento e desmembramento. A localização e as características urbanísticas do imóvel são, portanto, elementos importantes para identificar as normas que devem ser consideradas em sua gestão. \u003cbr>","linkHref":"","linkLabel":""},{"showImage":false,"slot":"c_a0stzlr__imageSlot","alt":"","caption":"","labelIcon":"waves-horizontal","label":"","tabLabel":"Gestão costeira","title":"Gestão costeira","subtitle":"","description":"A zona costeira possui regime específico de planejamento e gestão. A \u003ca href=\"https://www.planalto.gov.br/ccivil_03/leis/l7661.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Lei nº 7.661/1988\u003c/a> instituiu o Plano Nacional de Gerenciamento Costeiro (PNGC), que orienta a utilização dos recursos da Zona Costeira e estabelece bases para seu gerenciamento. Imóveis públicos situados nesses espaços podem, portanto, estar sujeitos a normas específicas decorrentes de sua localização.","linkHref":"","linkLabel":""},{"showImage":false,"slot":"c_delkxie__imageSlot","alt":"","caption":"","labelIcon":"sprout","label":"","tabLabel":"Proteção ambiental","title":"Proteção ambiental","subtitle":"","description":"A utilização dos imóveis públicos também está sujeita às normas de proteção ambiental. Áreas de preservação permanente, unidades de conservação, vegetação protegida e outros espaços ambientalmente protegidos podem estabelecer condições ou restrições ao uso dos imóveis. A Constituição assegura o direito ao meio ambiente ecologicamente equilibrado e atribui ao Poder Público deveres relacionados à sua defesa e preservação.","linkHref":"","linkLabel":""},{"showImage":false,"slot":"c_eucy685__imageSlot","alt":"","caption":"","labelIcon":"tractor","label":"","tabLabel":"Política fundiária","title":"Política fundiária","subtitle":"","description":"A dimensão fundiária é especialmente relevante para imóveis rurais, terras públicas e processos de regularização fundiária. Esses regimes podem incidir sobre a gestão dos imóveis públicos, especialmente quando sua utilização ou destinação se relaciona ao ordenamento fundiário, à regularização de ocupações ou à implementação de políticas de acesso à terra e à moradia.","linkHref":"","linkLabel":""},{"showImage":false,"slot":"c_hh59qhs__imageSlot","alt":"","caption":"","labelIcon":"","label":"","tabLabel":"Proteção do patrimônio cultural","title":"Proteção do patrimônio cultural","subtitle":"","description":"Imóveis públicos podem possuir valor histórico, artístico, arqueológico, paisagístico ou cultural e estar sujeitos a regimes específicos de proteção. Tombamento, registro de áreas envoltórias e outras formas de proteção podem estabelecer condicionantes para intervenções, reformas, usos e destinações.","linkHref":"","linkLabel":""}]}},{"id":"b_msj232w2_3x9g","type":"prose","props":{"html":"\u003cp>Essa camada evidencia que a gestão dos imóveis públicos não pode considerar apenas as normas patrimoniais ou registrais. A localização, as características e a finalidade do imóvel podem atrair a incidência de diferentes regimes urbanísticos, ambientais e fundiários, que precisam ser considerados nas decisões sobre seu uso e destinação. Ao mesmo tempo, a dimensão funcional da propriedade pública exige considerar sua vinculação à realização de finalidades de interesse público e ao cumprimento de sua função socioambiental (BAPTISTA, 2017; CRISTÓVAM; BERTONCINI, 2019).\u003c/p>"}},{"id":"bh1tyova","type":"kicker","props":{"icon":"scale","children":"Principais marcos normativos"}},{"id":"brjsuyss","type":"accordion","props":{"numbered":false,"items":[{"title":"Lei nº 10.257/2001 (Estatuto da Cidade) ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Principal marco da política urbana brasileira. Regulamenta os arts. 182 e 183 da Constituição e estabelece instrumentos para o cumprimento da função social da propriedade. \u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003c/span>\u003c/p>\u003cspan data-color=\"terra\">\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003ci>\u003c/i>\u003c/span>\u003c/p>\u003cspan data-font=\"serif\">\u003ci>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Dispositivos de destaque: \u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Art. 2º – Diretrizes gerais da política urbana  \u003c/span>\u003c/li>\u003cli>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Arts. 39 a 42-B – Plano Diretor  \u003c/span>\u003c/li>\u003c/ul>\u003c/p>\u003c/i>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003c/span>\u003c/p>\u003c/span>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/leis_2001/l10257.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Plano Diretor Municipal\u003cbr>","content":"\u003cp>\u003cspan style=\"color: inherit;\">Principal instrumento de ordenamento territorial local. Define uso do solo, expansão urbana, áreas de interesse social e proteção ambiental. \u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>\u003cspan style=\"color: inherit;\">\u003cspan data-color=\"terra\">\u003cspan data-font=\"serif\">\u003ci>Consulte o Plano Diretor do município correspondente. \u003c/i>\u003c/span>\u003c/span>\u003c/span>\u003c/li>\u003c/ul>\u003c/p>","linkHref":"","linkLabel":"","linkButton":""},{"title":"Lei nº 12.651/2012 (Código Florestal) ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Estabelece regras para proteção da vegetação nativa e condiciona a utilização de imóveis públicos e privados. \u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Lei nº 9.985/2000 (SNUC) ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Institui o Sistema Nacional de Unidades de Conservação e disciplina áreas protegidas que afetam diretamente a gestão patrimonial. \u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Lei nº 13.465/2017 ","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Principal marco contemporâneo da regularização fundiária urbana e rural. \u003c/span>\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13465.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Lei nº 7.661/1988 (Plano Nacional de Gerenciamento Costeiro) ","content":"\u003cp>Institui o Plano Nacional de Gerenciamento Costeiro como parte integrante da Política Nacional para os Recursos do Mar e Política Nacional do Meio Ambiente.\u003c/p>","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/l7661.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Lei nº 6.766/1979 — Parcelamento do Solo Urbano","content":"Disciplina o parcelamento do solo urbano, especialmente por meio de loteamento e desmembramento, estabelecendo requisitos urbanísticos e procedimentos aplicáveis.","linkHref":"https://www.planalto.gov.br/ccivil_03/leis/l6766compilado.htm","linkLabel":"Confira a Lei completa","linkButton":"secondary"},{"title":"Decreto-Lei nº 25, de 30 de novembro de 1937 - Patrimônio cultural","content":"Imóveis públicos podem estar sujeitos a regimes de proteção do patrimônio cultural, inclusive por meio de tombamento e outros instrumentos previstos na legislação de proteção ao patrimônio histórico, artístico e cultural. Essas restrições podem condicionar obras, reformas, alterações de uso e a própria destinação do imóvel.","linkHref":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del0025.htm","linkLabel":"Confira o Decreto-Lei","linkButton":"secondary"}]}}]},{"id":"by4hlqs8","type":"section","props":{"width":"content","surface":"dark","pad":"lg"},"children":[{"id":"c5cftkyc","type":"titulo","props":{"text":"Como as camadas se conectam","level":"h2"}},{"id":"ctelxium","type":"prose","props":{"html":"\u003cp>Embora apresentadas separadamente para fins didáticos, \u003cb>\u003cspan data-color=\"ochre-light\">as quatro camadas normativas não funcionam de forma isolada\u003c/span>\u003c/b>. Pelo contrário, elas se complementam e se influenciam mutuamente. \u003c/p>\u003cp>Uma mesma ação patrimonial pode exigir a observância simultânea de normas constitucionais, patrimoniais, registrais, urbanísticas, ambientais e fundiárias. A destinação de uma área pública para habitação de interesse social, por exemplo, pode envolver competências constitucionais, instrumentos patrimoniais, regularização registral, observância do Plano Diretor, atendimento à legislação ambiental e aplicação de normas de contratação pública. \u003c/p>\u003cp>Isso não significa que todas sejam normas patrimoniais. Significa que diferentes regimes jurídicos podem incidir sobre uma mesma decisão relativa a um imóvel público.&nbsp;\u003c/p>\u003cp>Essa interação permanente demonstra que a gestão patrimonial não pode ser compreendida apenas a partir da legislação patrimonial propriamente dita. Ela depende de uma visão integrada do sistema normativo e da capacidade de compreender como diferentes normas se articulam em torno dos imóveis públicos. \u003c/p>"}}]},{"id":"behgl72t","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"c6164bud","type":"titulo","props":{"text":"Fluxo de análise normativa para Gestão de Imóveis Públicos","level":"h2"}},{"id":"cktqpkwi","type":"prose","props":{"html":"\u003cp>A gestão de imóveis públicos exige análise integrada de normas de diferentes naturezas.\u003c/p>\u003cp>Responda às perguntas abaixo, clique em cada cartão, identifique as normas aplicáveis e escolha o instrumento adequado para garantir legalidade, eficiência e atendimento ao interesse público.\u003c/p>"}},{"id":"bsqaran4","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"bs5j5ndd","type":"flashcard","props":{"term":"1. De quem é o imóvel?","description":"Qual ente federativo é o proprietário ou gestor responsável?","definition":"\u003cp>\u003cspan style=\"color: inherit;\">\u003cspan data-fs=\"h5\">\u003c/span>\u003c/span>\u003cspan data-fs=\"body-lg\">De quem é o imóvel?\u003c/span>\u003c/p>\u003cp>\u003cul>\u003cli>União, estado, Distrito Federal ou município?\u003c/li>\u003cli>Verificar a legislação patrimonial específica do ente.\u003c/li>\u003c/ul>\u003cp>\u003c/p>","icon":"shield-user","showIcon":true,"useCoverImage":false,"coverSlot":"c_gnaur6w__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--slate-600)"}},{"id":"b_msj4kt8r_fdth","type":"flashcard","props":{"term":"2. Onde está localizado?","description":"Qual é a localização do imóvel?","definition":"\u003cp>\u003cspan style=\"color: inherit;\">\u003cspan data-fs=\"h5\">\u003c/span>\u003c/span>\u003cspan data-fs=\"body-lg\">Onde está localizado?\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Endereço, coordenadas ou descrição territorial.\u003c/li>\u003cli>Identificar o município e eventuais sobreposições territoriais.\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003c/p>","icon":"map-pinned","showIcon":true,"useCoverImage":false,"coverSlot":"c_tsnmer1__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--green-600)"}},{"id":"b_msj4tw8d_pf8o","type":"flashcard","props":{"term":"3. Qual sua natureza?","description":"O imóvel é urbano, rural, costeiro, ambiental, histórico, especial, edificado ou não edificado?","definition":"\u003cp>\u003cspan style=\"color: inherit;\">\u003cspan data-fs=\"h5\">\u003c/span>\u003c/span>\u003cspan data-fs=\"body-lg\">Qual sua natureza?\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Define o conjunto de normas aplicáveis: urbanisticas, ambientais, fundiárias, culturais, de patrimônio histórico etc.\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003c/p>","icon":"trees","showIcon":true,"useCoverImage":false,"coverSlot":"c_jjmdjub__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--terra-600)"}},{"id":"b_msj4wv8v_2khz","type":"flashcard","props":{"term":"4. O que se pretende fazer com o imóvel?","description":"Qual é a finalidade ou destinação pretendida?","definition":"\u003cp>\u003cspan style=\"color: inherit;\">\u003cspan data-fs=\"h5\">\u003c/span>\u003c/span>\u003cspan data-fs=\"body-lg\">O que se pretende fazer com o imóvel?\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Uso direto, cessão, concessão, alienação, permuta, locação, regularização, obra, proteção, desmembramento etc.\u003c/li>\u003cli>A finalidade influencia o regime jurídico e os requisitos legais.\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003c/p>","icon":"pencil-sparkles","showIcon":true,"useCoverImage":false,"coverSlot":"c_3vrmrce__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--ochre-700)"}},{"id":"b_msj5bm36_2r4l","type":"flashcard","props":{"term":"5. Há restrições urbanísticas ou ambientais?","description":"O Plano Diretor, leis de uso do solo ou normas ambientais impõem restrições ao imóvel?","definition":"\u003cp>\u003cspan style=\"color: inherit;\">\u003cspan data-fs=\"h5\">\u003c/span>\u003c/span>\u003cspan data-fs=\"body-lg\">Há restrições urbanísticas ou ambientais?\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Verificar Plano Diretor, zoneamento, áreas de interesse social, áreas de proteção APP, unidade de conservação, patrimônio cultural, etc.\u003c/li>\u003cli>Podem limitar o uso, a ocupação ou a destinação.\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003c/p>","icon":"building-2","showIcon":true,"useCoverImage":false,"coverSlot":"c_q9rrntv__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--terra-700)"}},{"id":"b_msj57cmc_8gtf","type":"flashcard","props":{"term":"6. Qual regime de destinação pode ser utilizado?","description":"Qual é o instrumento adequado para viabilizar a destinação ou o uso pretendido?","definition":"\u003cp>\u003cspan style=\"color: inherit;\">\u003cspan data-fs=\"h5\">\u003c/span>\u003c/span>\u003cspan data-fs=\"body-lg\">Qual instrumento jurídico?\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli>Licitação, concessão, permissão, cessão, autorização, doação, venda, termo de cooperação, desafetação, regularização etc.\u003c/li>\u003cli>Respeitar requisitos legais e procedimentais.\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003c/p>","icon":"building-2","showIcon":true,"useCoverImage":false,"coverSlot":"c_gieqw3s__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--petrol-800)"}}]}]},{"id":"brvaz5dz","type":"section","props":{"width":"content","surface":"terra-dark","pad":"lg"},"children":[{"id":"cqavfhvp","type":"titulo","props":{"text":"Onde consultar normas sobre imóveis públicos&nbsp;","level":"h3"}},{"id":"cwhzmis9","type":"prose","props":{"html":"\u003cp>A Secretaria do Patrimônio da União (SPU) mantém um repositório institucional que, dentre outros elementos, reúne normas legais e infralegais aplicadas à gestão dos imóveis da União, como leis, decretos, portarias e outros atos normativos.\u003c/p>\u003cp>Essa coleção integra o MemóriaSPU, repositório institucional de conhecimento da SPU criado para reunir, preservar e dar acesso a conteúdos relacionados à trajetória e à atuação do órgão.\u003c/p>\u003cp>\u003ca href=\"https://memoria-spu.gestao.gov.br/normas-e-documentos/\" target=\"_blank\" rel=\"noopener noreferrer\" data-btn=\"primary\">Consulte a coleção de normas aplicadas à gestão dos imóveis da União\u003c/a>\u003c/p>"}}]},{"id":"basm8oyf","type":"conclusion","props":{"kicker":"Para Reflexão","kickerIcon":"check","title":"","body":"\u003cp>Ao analisar uma decisão envolvendo um imóvel público, considere:\u003c/p>\u003cp>\u003cul>\u003cli>Conhecer quem é o proprietário do imóvel é suficiente para identificar as normas aplicáveis à sua gestão? O que mais precisa ser considerado?&nbsp;\u003c/li>\u003cli>Uma mesma decisão patrimonial pode estar sujeita a normas de diferentes entes federativos e de diferentes campos jurídicos? Como identificar essas incidências?&nbsp;\u003c/li>\u003cli>Como a localização, as características e a finalidade pretendida para um imóvel podem alterar o conjunto de normas que precisa ser observado?&nbsp;\u003c/li>\u003cli>Na sua realidade de trabalho, quais conjuntos normativos costumam ser considerados nas decisões sobre imóveis públicos? Há dimensões que recebem menos atenção do que deveriam?\u003c/li>\u003c/ul>\u003c/p>"},"children":[{"id":"byyei2dk","type":"accordion","props":{"numbered":false,"items":[{"title":"Referências","content":"\u003cp>BAPTISTA, Patrícia. Regime jurídico dos bens públicos: perspectiva civilista, funcionalização e outros temas. In: NUNES JÚNIOR, Vidal Serrano et al. (coord.). \u003ci>Enciclopédia Jurídica da PUCSP\u003c/i>: Direito Administrativo e Constitucional. São Paulo: PUC-SP, 2017.&nbsp;\u003c/p>\u003cp>BRASIL. \u003ci>Constituição da República Federativa do Brasil de 1988\u003c/i>. Brasília, DF: Presidência da República, 1988.&nbsp;\u003c/p>\u003cp>BRASIL. \u003ci>Decreto-Lei nº 9.760, de 5 de setembro de 1946.\u003c/i> Dispõe sobre os bens imóveis da União e dá outras providências. Brasília, DF: Presidência da República, 1946.&nbsp;\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 6.015, de 31 de dezembro de 1973\u003c/i>. Dispõe sobre os registros públicos e dá outras providências. Brasília, DF: Presidência da República, 1973.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 6.938, de 31 de agosto de 1981\u003c/i>. Dispõe sobre a Política Nacional do Meio Ambiente, seus fins e mecanismos de formulação e aplicação, e dá outras providências. Brasília, DF: Presidência da República, 1981.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 9.636, de 15 de maio de 1998\u003c/i>. Dispõe sobre a regularização, administração, aforamento e alienação de bens imóveis de domínio da União e dá outras providências. Brasília, DF: Presidência da República, 1998.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 9.985, de 18 de julho de 2000\u003c/i>. Regulamenta o art. 225, § 1º, incisos I, II, III e VII, da Constituição Federal, institui o Sistema Nacional de Unidades de Conservação da Natureza e dá outras providências. Brasília, DF: Presidência da República, 2000.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 10.257, de 10 de julho de 2001\u003c/i>. Regulamenta os arts. 182 e 183 da Constituição Federal, estabelece diretrizes gerais da política urbana e dá outras providências. Brasília, DF: Presidência da República, 2001.&nbsp;\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 10.267, de 28 de agosto de 2001\u003c/i>. Altera dispositivos das Leis nº 4.947/1966, nº 5.868/1972, nº 6.015/1973, nº 6.739/1979 e nº 9.393/1996, relacionados ao cadastro e ao georreferenciamento de imóveis rurais. Brasília, DF: Presidência da República, 2001.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 10.406, de 10 de janeiro de 2002\u003c/i>. Institui o Código Civil. Brasília, DF: Presidência da República, 2002.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 11.428, de 22 de dezembro de 2006\u003c/i>. Dispõe sobre a utilização e proteção da vegetação nativa do Bioma Mata Atlântica e dá outras providências. Brasília, DF: Presidência da República, 2006.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 11.481, de 31 de maio de 2007\u003c/i>. Dá nova redação a dispositivos das Leis nº 9.636/1998, nº 8.666/1993, nº 11.124/2005, nº 10.406/2002, nº 9.514/1997 e nº 6.015/1973 e dos Decretos-Leis nº 9.760/1946, nº 271/1967, nº 1.876/1981 e nº 2.398/1987; prevê medidas voltadas à regularização fundiária de interesse social em imóveis da União. Brasília, DF: Presidência da República, 2007.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 12.651, de 25 de maio de 2012\u003c/i>. Dispõe sobre a proteção da vegetação nativa e dá outras providências. Brasília, DF: Presidência da República, 2012.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 13.465, de 11 de julho de 2017\u003c/i>. Dispõe, entre outras matérias, sobre a regularização fundiária rural e urbana. Brasília, DF: Presidência da República, 2017.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 14.133, de 1º de abril de 2021\u003c/i>. Lei de Licitações e Contratos Administrativos. Brasília, DF: Presidência da República, 2021.\u003c/p>\u003cp>BRASIL. \u003ci>Decreto nº 11.208, de 26 de setembro de 2022\u003c/i>. Institui o Sistema Nacional de Gestão de Informações Territoriais e regulamenta o Cadastro Imobiliário Brasileiro e o compartilhamento de dados relativos a bens imóveis. Brasília, DF: Presidência da República, 2022.\u003c/p>\u003cp>BRASIL. \u003ci>Lei nº 14.382, de 27 de junho de 2022\u003c/i>. Dispõe sobre o Sistema Eletrônico dos Registros Públicos e dá outras providências. Brasília, DF: Presidência da República, 2022.\u003c/p>\u003cp>BRASIL. Ministério da Fazenda. Secretaria do Tesouro Nacional. \u003ci>Manual de contabilidade aplicada ao setor público\u003c/i> (MCASP), 11 ed. Brasília, DF: Secretaria do Tesouro Nacional, 2024.&nbsp;\u003c/p>\u003cp>CRISTÓVAM, José Sérgio da Silva; BERTONCINI, Eduardo Junqueira. Bens públicos no Direito brasileiro: uma análise sob a perspectiva das funções social e econômica da propriedade pública. \u003ci>Revista de Direito Administrativo e Gestão Pública\u003c/i>, Belém, v. 5, n. 2, p. 118-136, jul./dez. 2019.&nbsp;\u003c/p>"}]}}]},{"id":"batn5cvl","type":"pagefooter","props":{"code":"Arquitetura normativa da gestão de bens imóveis públicos no Brasil [M131]","context":"Este material foi   function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');
    var allowed = ['STRONG','B','EM','I','BR','P','SPAN'];
    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
</body>
</html>
