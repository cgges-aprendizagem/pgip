<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M611 - Por que fiscalizar e proteger o patrimônio público?","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"c8v9xk0g","text":"Afinal, o que a fiscalização busca proteger?","hidden":false},{"id":"cu7g8brz","text":"A natureza da atividade fiscalizatória: \u003cspan style=\"font-weight: normal;\">por que o Estado pode intervir?\u003c/span>","hidden":false}],"enabled":false}},"blocks":[{"id":"bft21zdm","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"b3s4pufp","type":"hero","props":{"kicker":"Fundamentos do controle e proteção do patrimônio","kickerIcon":"shield-check","title":"Por que fiscalizar e proteger o patrimônio público?","byline":"proteção dos bens imóveis públicos e dos direitos da coletividade","slot":"b3s4pufp__slot"}},{"id":"bc3887eq","type":"section","props":{"width":"content","surface":"none","pad":"lg","__pullDown":true},"children":[{"id":"bhh82tov","type":"prose","props":{"html":"\u003cp>Uma área pública pode continuar formalmente pertencendo ao Estado e, ainda assim, perder gradualmente sua integridade, seu uso adequado ou até mesmo sua disponibilidade para a coletividade.\u003c/p>\u003cp>Observe as três situações apresentadas abaixo. Elas são diferentes entre si, mas têm algo em comum: mostram problemas que podem crescer e se tornar muito mais difíceis de enfrentar quando não são identificados e acompanhados a tempo.\u003c/p>\u003cp>\u003col>\u003cli>Explore cada situação e reflita:  O que está em risco? Quem é afetado? Em que momento a atuação do Poder Público poderia fazer diferença?\u003c/li>\u003cli>Clique sobre cada cartão e compare as suas reflexões com as questões apresentadas.\u003c/li>\u003c/ol>\u003c/p>"}}]},{"id":"b7zalnt0","type":"sectionslider","props":{"loop":true},"children":[{"id":"cd5jm4qk","type":"sectionslide","props":{"width":"wide","surface":"none","pad":"md","__pullUp":false,"__pullDown":false},"children":[{"id":"b8fvpc9b","type":"panel","props":{"variant":"box","kicker":"Situação 01","kickerIcon":"land-plot","title":"\u003cspan data-color=\"ochre-light\">Uma área pública começa a ser ocupada\u003c/span>","color":"var(--cloud-50)","bg":"var(--slate-700)","body":"\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b6trucgh","type":"columns","props":{"count":2,"ratio":"last-wide","gap":"sm"},"children":[{"id":"b1920sz2","type":"figure","props":{"slot":"b1920sz2__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}},{"id":"b_msw9m9bl_7kvx","type":"flashcard","props":{"term":"","description":"\u003cspan data-fs=\"body\">Na borda de um terreno público desocupado surgem algumas construções. Com o passar dos anos, a ocupação cresce, novas edificações aparecem e lotes começam a ser negociados informalmente. Quando o Poder Público volta sua atenção para a área, a situação já envolve muitas famílias e diferentes interesses.\u003c/span>","definition":"\u003cp>\u003cb>\u003cspan data-fs=\"h6\">\u003cspan data-color=\"light\">\u003cspan data-fs=\"body-lg\">O que poderia ter sido identificado quando surgiram as primeiras ocupações? O que muda quando a situação permanece anos sem acompanhamento?\u003c/span>\u003c/span>\u003c/span>\u003c/b>\u003c/p>","icon":"rotate-cw","color":"var(--slate-800)","showIcon":true,"useCoverImage":false,"coverSlot":"c_cpcha58__imageSlot","coverAlt":"","frontCue":"Reflita e compare","backCue":"Clique para voltar"}}]}]}]},{"id":"b_mswfso44_03di","type":"sectionslide","props":{"width":"wide","surface":"none","pad":"md","__pullUp":false,"__pullDown":false},"children":[{"id":"b_mswfso44_t4hk","type":"panel","props":{"variant":"box","kicker":"Situação 02","kickerIcon":"trees","title":"\u003cspan data-color=\"ochre-light\">Um espaço público perde o acesso coletivo\u003c/span>","color":"var(--cloud-50)","bg":"var(--petrol-700)","body":"\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b_mswfso44_hg17","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"sm"},"children":[{"id":"b_mswfso44_oeeb","type":"flashcard","props":{"term":"","description":"\u003cspan style=\"font-size: 17px;\">Uma área às margens de um rio, lago ou outro espaço de acesso coletivo começa a receber cercas, píeres, construções e outras intervenções. Gradualmente, acessar aquele espaço se torna mais difícil e parcelas da área passam a ser utilizadas como se fossem privadas.&nbsp;\u003c/span>","definition":"\u003cp>\u003cfont face=\"Red Hat Display, Archivo, system-ui, sans-serif\">\u003cspan style=\"font-size: 19px; letter-spacing: -0.204px;\">\u003cb>\u003cspan data-color=\"light\">Quem perde quando uma área destinada ao uso coletivo passa, na prática, a atender predominantemente a interesses particulares?&nbsp;\u003c/span>\u003c/b>\u003c/span>\u003c/font>\u003c/p>","icon":"rotate-cw","color":"var(--slate-800)","showIcon":true,"useCoverImage":false,"coverSlot":"b_mswfso44_oeeb__coverSlot","coverAlt":"","frontCue":"Reflita e compare","backCue":"Clique para voltar"}},{"id":"b_mswfso44_5iey","type":"figure","props":{"slot":"b_mswfso44_5iey__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]}]},{"id":"b_mswfsnfe_1wsl","type":"sectionslide","props":{"width":"wide","surface":"none","pad":"md","__pullUp":false,"__pullDown":false},"children":[{"id":"b_mswfsnfe_98bi","type":"panel","props":{"variant":"box","kicker":"Situação 03","kickerIcon":"ferris-wheel","title":"\u003cspan data-color=\"ochre-light\">Um imóvel é utilizado para outra finalidade\u003c/span>","color":"var(--cloud-50)","bg":"var(--ink-700)","body":"\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b_mswfsnfe_2rly","type":"columns","props":{"count":2,"ratio":"last-wide","gap":"sm"},"children":[{"id":"b_mswfsnfe_fqt7","type":"figure","props":{"slot":"b_mswfsnfe_fqt7__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}},{"id":"b_mswfsnfe_g4z4","type":"flashcard","props":{"term":"","description":"\u003cspan style=\"font-size: 17px;\">Um imóvel público foi destinado para determinada finalidade de interesse público, mas, com o tempo, passa a ser utilizado de forma diferente daquela prevista. A mudança não foi formalizada nem acompanhada pelo órgão responsável.&nbsp;\u003c/span>","definition":"\u003cp>\u003cb>\u003cspan data-fs=\"h6\">\u003cspan data-color=\"light\">\u003cspan data-fs=\"body-lg\">Destinar um imóvel é suficiente para assegurar que ele continuará cumprindo a finalidade prevista?&nbsp;\u003c/span>\u003c/span>\u003c/span>\u003c/b>\u003c/p>","icon":"rotate-cw","color":"var(--slate-800)","showIcon":true,"useCoverImage":false,"coverSlot":"b_mswfsnfe_g4z4__coverSlot","coverAlt":"","frontCue":"Reflita e compare","backCue":"Clique para voltar"}}]}]}]}]},{"id":"bfsbxj7f","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"c9pfk6xj","type":"titulo","props":{"text":"O que essas situações têm em comum?","level":"h3"}},{"id":"c0pdwroq","type":"prose","props":{"html":"\u003cp>Os exemplos mostram que proteger um imóvel público não significa apenas reagir quando um dano já ocorreu. Ocupações irregulares, usos incompatíveis com a destinação, deterioração física e intervenções não autorizadas podem começar de forma pouco perceptível e se agravar ao longo do tempo.\u003c/p>\u003cp>Essas situações podem surgir de maneiras diferentes e nem sempre são percebidas quando começam. Quando não identificadas e acompanhadas, podem se consolidar ao longo do tempo, ampliando danos, conflitos, custos e prejuízos ao interesse coletivo. É justamente a existência desses riscos que torna necessário conhecer e acompanhar permanentemente a situação do patrimônio público.\u003c/p>\u003cp>As ocupações irregulares representam uma das infrações mais recorrentes e preocupantes, sobretudo quando recaem sobre bens de uso comum do povo, como praias, margens de rios e outras áreas de livre acesso. Além de violarem o regime jurídico desses bens, tais ocupações restringem o acesso da coletividade e frequentemente provocam degradação ambiental.\u003c/p>\u003cp>Da mesma forma, o desvio de finalidade descaracteriza a destinação pública do imóvel, impedindo que ele cumpra os objetivos para os quais foi destinado.\u003c/p>\u003cp>Outro aspecto relevante refere-se à conservação do patrimônio. Imóveis públicos desocupados ou geridos de forma inadequada tendem a deteriorar-se rapidamente, depreciando-se e podendo representar riscos à integridade das edificações e à segurança da população. \u003c/p>"}},{"id":"bl1jq355","type":"kicker","props":{"icon":"shield-alert","children":"Os riscos podem atingir diferentes dimensões do patrimônio"}},{"id":"bzttee0n","type":"figure","props":{"slot":"bzttee0n__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]},{"id":"blumgvp8","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c8v9xk0g","type":"titulo","props":{"text":"Afinal, o que a fiscalização busca proteger?","level":"h2"}},{"id":"cvu2tcm2","type":"prose","props":{"html":"\u003cp>Pense novamente nos casos apresentado no início deste material e nas situações comuns abordadas . É justamente aí que a fiscalização patrimonial encontra sua razão de ser.\u003c/p>\u003cp>Fiscalizar permite conhecer a situação dos imóveis, identificar irregularidades e riscos, produzir evidências e agir antes que determinados problemas se consolidem. As informações produzidas também subsidiam outras atividades da gestão patrimonial, como cadastro, regularização, destinação, planejamento e adoção de medidas administrativas.\u003c/p>"}},{"id":"bdj03bxb","type":"callout","props":{"variant":"ear","tone":"attention","icon":"lightbulb","title":"","heading":"","children":"\u003cp>As ações de fiscalização produzem informações e evidências relevantes para a gestão patrimonial, subsidiando atividades como cadastro, regularização, destinação, planejamento e adoção de medidas administrativas relacionadas aos bens públicos. Ao identificar situações de ocupação, uso, conservação e conformidade dos imóveis, a fiscalização fornece elementos técnicos que apoiam a tomada de decisões pelos gestores públicos, contribuem para a proteção do patrimônio público e favorecem o aperfeiçoamento da gestão patrimonial.\u003c/p>","color":""}},{"id":"b_mswgzdb3_glrl","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Isso significa que \u003cmark data-hl=\"petrol\">fiscalização e gestão não são atividades separadas\u003c/mark>. Conhecer o que está acontecendo com um imóvel é condição para decidir o que precisa ser preservado, corrigido ou transformado.\u003c/span>\u003c/p>\u003cp>Ao identificar precocemente situações que possam comprometer a integridade, a destinação ou a adequada utilização dos bens públicos, a fiscalização também contribui para o gerenciamento dos riscos relacionados ao patrimônio público, favorecendo a adoção de medidas preventivas e corretivas pela Administração.\u003c/p>\u003cp>A proteção do patrimônio público é uma função permanente da Administração Pública. Independentemente de o imóvel pertencer à União, a um estado, ao Distrito Federal ou a um município, sua gestão deve assegurar que o bem permaneça protegido e seja utilizado de acordo com sua finalidade e com o interesse coletivo.\u003c/p>\u003cp>Além de sua função preventiva e repressiva, a fiscalização possui importante caráter pedagógico e dissuasório. A presença permanente do Estado transmite à sociedade a mensagem de que o patrimônio público é efetivamente protegido, reduzindo a ocorrência de novas irregularidades e fortalecendo a cultura de res peito aos bens públicos.\u003c/p>\u003cp>Assim, fiscalizar os bens imóveis públicos é assegurar que um patrimônio pertencente a toda a sociedade permaneça preservado em sua integridade física, respeitado em sua destinação legal e gerido de forma eficiente e transparente.\u003c/p>"}},{"id":"bfz9c0sd","type":"callout","props":{"variant":"header","tone":"attention","icon":"shield-alert","title":"","heading":"","children":"\u003cp>Fiscalizar significa assegurar que o interesse coletivo prevaleça sobre interesses individuais incompatíveis com o regime jurídico dos bens públicos. Mais do que uma atividade administrativa, a fiscalização patrimonial constitui instrumento de proteção dos bens imóveis públicos e dos direitos da coletividade.\u003c/p>","color":""}}]},{"id":"b1atiult","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"cu7g8brz","type":"titulo","props":{"text":"A natureza da atividade fiscalizatória: \u003cspan style=\"font-weight: normal;\">por que o Estado pode intervir?\u003c/span>","level":"h2"}},{"id":"cur83go4","type":"prose","props":{"html":"\u003cp>A atividade fiscalizatória encontra fundamento no poder de polícia da Administração Pública, que confere ao Estado a prerrogativa de condicionar, restringir e controlar o exercício de direitos individuais em benefício da coletividade. Conforme leciona \u003cspan data-term=\"Hely Lopes Meirelles\" data-definition=\"MEIRELLES, Hely Lopes. &lt;b&gt;Direito administrativo brasileiro&lt;/b&gt;. 45. ed. Salvador: Juspodivm, 2025.\">Hely Lopes Meirelles\u003c/span>, trata-se da faculdade de que dispõe a Administração para \u003cmark data-hl=\"terra\">limitar o uso de bens, atividades e direitos individuais em prol do interesse público ou da coletividade\u003c/mark>. No âmbito patrimonial, esse poder legitima a atuação do Poder Público para prevenir e identificar infrações administrativas relacionadas aos bens imóveis, adotando as medidas cabíveis e promovendo a articulação com os órgãos competentes quando constatados ilícitos de outra natureza.\u003c/p>\u003cp>A fiscalização patrimonial possui natureza \u003cb>preventiva\u003c/b>. Ao identificar precocemente situações de irregularidade ou de risco, permite que a Administração Pública atue antes que os danos ao patrimônio público se consolidem, reduzindo custos administrativos, conflitos e prejuízos ao interesse coletivo.\u003c/p>\u003cp>Da mesma forma, caso, durante a fiscalização patrimonial, sejam identificados indícios de crime ou de outras infrações cuja apuração não seja de competência da SPU, estes devem ser comunicados aos órgãos competentes, tais como o Ministério Público, as forças policiais, os órgãos ambientais e as demais autoridades responsáveis, para adoção das medidas legais cabíveis. A atuação articulada entre os diferentes órgãos públicos fortalece a proteção do patrimônio público, permitindo que cada instituição exerça suas competências legais de forma complementar e coordenada.\u003c/p>\u003cp>Considerando a amplitude, a diversidade e a complexidade do patrimônio público, bem como as limitações de recursos humanos, materiais e orçamentários, \u003cmark>a atividade fiscalizatória deve ser planejada e orientada por critérios técnicos de priorização\u003c/mark>. A definição desses critérios é fundamental para direcionar os esforços de fiscalização às situações de maior relevância para o interesse público, tema desenvolvido na competência seguinte.\u003c/p>"}},{"id":"bv168kmd","type":"examplecard","props":{"label":"Exemplo prático - Experiência da União","icon":"map-pin","color":"var(--ochre-600)","slot":"bv168kmd__slot","collapse":"closed","title":"A experiência da Secretaria do Patrimônio da União","body":"\u003cp>Os bens imóveis da União constituem um patrimônio de valor inestimável para a sociedade brasileira. Terrenos de marinha, praias marítimas e fluviais, ilhas, rios federais, terras devolutas, imóveis funcionais, entre outros bens elencados no art. 20 da Constituição Federal de 1988, pertencem à União e devem atender a finalidades que transcendem interesses individuais, voltando-se à consecução do interesse público. \u003c/p>\u003cp>Essa finalidade é sintetizada na missão institucional da Secretaria do Patrimônio da União (SPU):\u003c/p>"},"children":[{"id":"bg8mdgdj","type":"pullquote","props":{"variant":"block","fontSize":"body-lg","children":"\u003ci>Conhecer, zelar e garantir que cada imóvel da União cumpra sua função socioambiental, em harmonia com a função arrecadadora, em apoio aos programas estratégicos para a Nação.\u003c/i>","cite":"\u003cbr>"}},{"id":"bwjt6768","type":"prose","props":{"html":"\u003cp>\u003cmark>Sem uma fiscalização patrimonial efetiva, essa missão torna-se inviável\u003c/mark>, deixando o patrimônio público vulnerável a ocupações irregulares, usos incompatíveis com sua destinação legal, degradação física e outras formas de utilização indevida que comprometem o interesse coletivo. A fiscalização patrimonial constitui, portanto, instrumento para assegurar que os bens públicos cumpram sua função social, ambiental e econômica.\u003c/p>\u003cp>No caso da União, a fiscalização patrimonial frequentemente incide sobre imóveis que abrigam ecossistemas sensíveis, como manguezais, margens de rios, praias e áreas costeiras. Nessas situações, embora a proteção ambiental constitua atribuição dos órgãos ambientais, a atuação da SPU é fundamental para identificar intervenções irregulares que afetem o patrimônio da União. Quando, no exercício da fiscalização, são constatados indícios de infrações ambientais, a SPU comunica os órgãos ambientais competentes para adoção das providências cabíveis em suas respectivas esferas de atuação.\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Considerando a amplitude, a diversidade e a complexidade do patrimônio imobiliário da União, não é possível fiscalizar todos os imóveis e situações ao mesmo tempo. Por isso, a SPU organiza sua atuação a partir de planejamento e de critérios de priorização, buscando direcionar os recursos disponíveis para as demandas de maior relevância e risco. Essa experiência, incluindo o Plano Anual de Fiscalização e o uso de critérios objetivos e informações territoriais para definir prioridades, é apresentada em material específico do Programa.\u003c/span>\u003c/p>"}}]}]},{"id":"b05zfdhe","type":"conclusion","props":{"kicker":"Para refletir","kickerIcon":"check","title":"","body":"\u003cp>Ao concluir a leitura, volte mentalmente às situações apresentadas no início.\u003c/p>\u003cp>\u003c/p>"},"children":[{"id":"ba5idxfo","type":"markerlist","props":{"variant":"ordered","icon":"check","accent":"var(--ochre-600)","items":[{"title":"\u003cspan data-color=\"ochre-light\" style=\"font-weight: normal;\">Na realidade que você conhece, que situações podem comprometer a integridade, o uso adequado ou a finalidade dos imóveis públicos?\u003c/span>\u003cbr>","text":""},{"title":"\u003cspan data-color=\"ochre-light\" style=\"font-weight: normal;\">Você se recorda de algum caso em que um problema relativamente pequeno se tornou mais difícil de resolver porque não foi identificado ou enfrentado a tempo? O que uma atuação preventiva poderia ter mudado?\u003c/span>\u003cbr>","text":""},{"title":"\u003cspan data-color=\"ochre-light\" style=\"font-weight: normal;\">Nos processos ou atividades dos quais você já participou, as informações produzidas pela fiscalização são utilizadas apenas para corrigir irregularidades ou também ajudam a tomar outras decisões sobre os imóveis?\u003c/span>\u003cbr>","text":""},{"title":"\u003cspan data-color=\"ochre-light\" style=\"font-weight: normal;\">Quando um problema encontrado em um imóvel público envolve competências de diferentes instituições, qual é a importância da articulação entre elas para proteger o patrimônio e o interesse coletivo?\u003c/span>\u003cbr>","text":""}]}}]},{"id":"bg5rgid8","type":"pagefooter","props":{"code":"Por que fiscalizar e proteger o patrimônio público? [M611]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Conteúdo","name":"Danilo dos San (function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');
    var allowed = ['STRONG','B','EM','I','BR','P','SPAN'];
    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
</body>
</html>
