<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M151 - Conhecendo a gestão patrimonial imobiliária","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"chvkm7fq","text":"1. Caracterização patrimonial imobiliária","hidden":false},{"id":"c4z4gjyo","text":"2. Gestão do ingresso patrimonial","hidden":false},{"id":"c6v7csup","text":"3. Avaliação e contabilidade patrimonial imobiliária","hidden":false},{"id":"c5rq4qx2","text":"4. Destinação imobiliária","hidden":false},{"id":"cx535qro","text":"5. Gestão econômica e de receitas patrimoniais","hidden":false},{"id":"cdm506gy","text":"6. Controle, fiscalização e proteção patrimonial","hidden":false},{"id":"cod3oi97","text":"7. Gestão da informação, dados e conhecimento patrimonial","hidden":false}]}},"blocks":[{"id":"bdjxgx2b","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bjzv3d8m","type":"hero","props":{"kicker":"Processos, sistemas e instrumentos de gestão de imóveis públicos","kickerIcon":"compass","title":"Conhecendo a gestão patrimonial imobiliária","byline":"funções, conexões e ciclo de vida dos imóveis públicos","slot":"bjzv3d8m__slot"}},{"id":"bo1kfqt4","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"chg2bclk","type":"prose","props":{"html":"\u003cp>A gestão patrimonial imobiliária pública é composta por um conjunto diversificado de funções que acompanham todo o ciclo de vida dos imóveis públicos. Essas funções envolvem desde a identificação e consolidação do patrimônio até sua destinação, utilização, fiscalização, proteção, valoração econômica e gestão da informação. Embora executadas por equipes e instituições distintas, elas são interdependentes e contribuem para um objetivo comum: assegurar que os imóveis públicos sejam conhecidos, protegidos e utilizados de forma compatível com o interesse público.  \u003c/p>\u003cp>Assim como qualquer patrimônio precisa ser conhecido e administrado para gerar valor, os imóveis públicos dependem de processos permanentes de gestão que abrangem desde o reconhecimento jurídico e físico de sua existência até sua utilização efetiva para finalidades sociais, ambientais, econômicas ou administrativas ou, ainda, a sua baixa patrimonial definitiva (caso da venda, por exemplo). Essas atividades envolvem profissionais de diferentes áreas, como direito, engenharia, arquitetura, geografia, contabilidade, administração, economia e tecnologia da informação. \u003c/p>\u003cp>Embora cada instituição pública possua competências e estruturas próprias, as funções fundamentais da gestão patrimonial imobiliária tendem a ser semelhantes em diferentes esferas de governo. Em maior ou menor grau, todos os gestores públicos que atuam com imóveis precisam saber \u003cb>\u003cmark data-hl=\"green\">quais são os imóveis sob responsabilidade\u003c/mark>\u003c/b> e responder a perguntas como: \u003c/p>"}},{"id":"bfgrk0tb","type":"feature","props":{"columns":3,"card":true,"accent":"","layout":"top","items":[{"icon":"map-pin","title":"Onde estão localizados?","text":""},{"icon":"scale","title":"Qual sua situação jurídica?","text":""},{"icon":"circle-dollar-sign","title":"Quanto valem?","text":""},{"icon":"tree-pine","title":"Como estão sendo utilizados?","text":""},{"icon":"hospital","title":"Estão cumprindo sua função pública? ","text":""},{"icon":"life-buoy","title":"Existem riscos ou irregularidades?","text":""}]}},{"id":"by6hwlyv","type":"callout","props":{"variant":"ear","tone":"attention","icon":"alert-circle","title":"","heading":"","children":"\u003cp>Este material apresenta as principais funções finalísticas da gestão patrimonial imobiliária pública a partir da \u003cb>\u003ca href=\"https://memoria-spu.gestao.gov.br/normas-e-documentos/resolucao-comgc-spu-mgi-no-5-de-24-de-outubro-de-2025/\">Tabela Taxonômica de Funções Finalísticas de Gestão Patrimonial Imobiliária\u003c/a>\u003c/b> da Secretaria do Patrimônio da União. O objetivo não é aprofundar procedimentos específicos, mas oferecer uma visão integrada da cadeia de valor da gestão patrimonial e de como suas diferentes funções se conectam ao longo do ciclo de vida dos imóveis públicos. \u003c/p>"}}]},{"id":"bzdw18n5","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"cb56n0hl","type":"titulo","props":{"text":"O ciclo de vida do imóvel público ","level":"h3"}},{"id":"bzo6npcb","type":"prose","props":{"html":"\u003cp>As funções de gestão patrimonial imobiliária atuam de forma integrada e contínua para garantir que os imóveis públicos sejam conhecidos, protegidos e ptilizados de forma compatível com o interesse público.\u003c/p>"}},{"id":"bjeez3gz","type":"figure","props":{"slot":"bjeez3gz__slot","src":"","fit":"contain","size":"full","title":"OPCAO A","caption":"As funções interagem permanentemente. Informações geradas em qualquer etapa alimentam as demais, retroalimentando o ciclo e permitindo novas demandas de caracterização, ingresso, avaliação, destinação, arrecadação, fiscalização e proteção dos imóveis públicos.","credit":""}},{"id":"by2fq3h2","type":"figure","props":{"slot":"by2fq3h2__slot","src":"","fit":"contain","size":"full","title":"OPCAO B","caption":"As funções interagem permanentemente. Informações geradas em qualquer etapa alimentam as demais, retroalimentando o ciclo e permitindo novas demandas de caracterização, ingresso, avaliação, destinação, arrecadação, fiscalização e proteção dos imóveis públicos.","credit":""}},{"id":"bixb6wap","type":"figure","props":{"slot":"bixb6wap__slot","src":"","fit":"contain","size":"full","title":"OPCAO C","caption":"As funções interagem permanentemente. Informações geradas em qualquer etapa alimentam as demais, retroalimentando o ciclo e permitindo novas demandas de caracterização, ingresso, avaliação, destinação, arrecadação, fiscalização e proteção dos imóveis públicos.","credit":""}}]},{"id":"b7map14t","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"chvkm7fq","type":"titulo","props":{"text":"1. Caracterização patrimonial imobiliária","level":"h2"}},{"id":"cvhglqkq","type":"prose","props":{"html":"\u003cp>A caracterização patrimonial imobiliária reúne as atividades destinadas a identificar, reconhecer, delimitar e individualizar os imóveis públicos. É a função responsável por responder uma pergunta fundamental: \u003cb>o que efetivamente pertence ao Estado?\u003c/b>\u003c/p>\u003cp>Essa etapa envolve procedimentos técnicos e jurídicos voltados à identificação de bens públicos e à definição de seus limites físicos e dominiais. Dependendo da natureza do bem, podem ser realizados procedimentos de identificação direta, demarcação ou discriminação de terras públicas.\u003c/p>"}},{"id":"b65prrm3","type":"callout","props":{"variant":"ear","tone":"attention","icon":"alert-circle","title":"","heading":"","children":"\u003cp>A correta caracterização do patrimônio constitui a base para todas as demais funções de gestão. Sem saber exatamente onde está o imóvel, quais são seus limites ou qual sua situação dominial, torna-se impossível avaliar, destinar, fiscalizar ou proteger adequadamente o patrimônio público.\u003c/p>"}},{"id":"b0w0yg70","type":"kicker","props":{"icon":"text-initial","children":"Glossário das principais funções "}},{"id":"b8joap9w","type":"accordion","props":{"numbered":false,"items":[{"title":"Caracterização patrimonial imobiliária","content":"\u003cp>Função de gestão patrimonial que contempla conjunto de procedimentos técnicos e administrativos destinados à identificação, delimitação, demarcação, discriminação, individualização e reconhecimento jurídico de bens públicos, incluindo águas públicas, ilhas, terrenos de marinha e terras devolutas. \u003c/p>","imageSlot":"c_q5131hn__imageSlot"},{"title":"Identificação direta","content":"Subfunção de caracterização patrimonial imobiliária que compreende o conjunto de procedimentos técnicos voltados ao reconhecimento e delimitação física de áreas com base em elementos objetivos como a localização e a natureza do bem (ilhas, águas públicas, praias, manguezais), dispensando a instauração de processos formais de demarcação ou discriminação. ","imageSlot":"c_72k38rd__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Demarcação patrimonial imobiliária","content":"Subfunção de caracterização patrimonial imobiliária que compreende o conjunto de procedimentos técnicos e administrativos destinados à definição, materialização e reconhecimento dos limites de bens públicos cuja caracterização depende de critérios legais específicos, mediante instauração de procedimento formal próprio. ","imageSlot":"c_2krkg8q__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Discriminação patrimonial imobiliária","content":"Subfunção de caracterização patrimonial imobiliária que compreende o conjunto de procedimentos administrativos ou judiciais destinados à identificação, separação e reconhecimento das terras públicas em relação às terras particulares, promovendo a definição da titularidade dominial das áreas envolvidas.","imageSlot":"c_q5hqk1r__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Identificação direta de águas públicas","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Categoria da subfunção de identificação direta que contempla conjunto de procedimentos técnicos destinados a reconhecer e delimitar fisicamente áreas cobertas por águas públicas, bens de uso comum do povo, como mares, rios e lagos, dispensando a instauração de processos formais de demarcação ou discriminação.\u003c/span>\u003c/p>","imageSlot":"c_uty1r4y__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Identificação direta de ilhas","content":"Categoria da subfunção de identificação direta que compreende o conjunto de procedimentos técnicos destinados a reconhecer e delimitar fisicamente ilhas, porções de terra cercadas por águas públicas, dispensando a instauração de processos formais de demarcação ou discriminação. ","imageSlot":"c_drp92rl__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Identificação direta de praias","content":"Categoria da subfunção de identificação direta que compreende o conjunto de procedimentos técnicos destinados a reconhecer e delimitar fisicamente praias marítimas e fluviais, bens de uso comum do povo, definidos como faixas de terra banhadas por águas públicas, dispensando a instauração de processos formais de demarcação ou discriminação. ","imageSlot":"c_or95vdn__imageSlot","linkHref":"","linkLabel":"","linkButton":""}]}}]},{"id":"b8733a9e","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c4z4gjyo","type":"titulo","props":{"text":"2. Gestão do ingresso patrimonial","level":"h2"}},{"id":"cnpsolmb","type":"prose","props":{"html":"\u003cp>Após sua identificação, os imóveis precisam ser formalmente incorporados ao patrimônio público. A consolidação dominial e patrimonial reúne as atividades relacionadas à aquisição, incorporação e regularização dos imóveis.\u003c/p>\u003cp>Essa função abrange desde a aquisição de imóveis por compra, doação, desapropriação ou outros instrumentos legais até o registro cartorial e o cadastramento nos sistemas corporativos de gestão patrimonial. Também compreende a regularização de registros, retificações e adequações cadastrais necessárias para garantir segurança jurídica e controle patrimonial. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Em outras palavras, essa função transforma um bem identificado em um bem efetivamente reconhecido e gerido pelo Estado.\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Além do registro cartorial, quando cabível, a incorporação de um imóvel exige seu cadastramento nos sistemas corporativos, permitindo sua gestão, monitoramento e destinação.\u003c/span>\u003c/p>"}},{"id":"bvbrdfx9","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"file-plus-corner","title":"Aquisição e constituição de direitos imobiliários","color":"","bg":"var(--petrol-50)","body":"\u003cp>A aquisição e constituição de direitos imobiliários compreende o conjunto de atividades destinadas a \u003cb>incorporar novos imóveis ou direitos ao patrimônio público\u003c/b>. Trata-se da porta de entrada de bens e direitos no acervo patrimonial do Estado, permitindo que imóveis sejam obtidos para implantação de políticas públicas, proteção ambiental, regularização fundiária, infraestrutura, prestação de serviços públicos ou outras finalidades de interesse coletivo.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b0lf5u10","type":"feature","props":{"columns":2,"card":false,"accent":"var(--petrol-600)","layout":"top","items":[{"icon":"square-dashed-mouse-pointer","title":"\u003cspan style=\"font-weight: normal;\">Envolve \u003c/span>diferentes formas de aquisição e constituição\u003cspan style=\"font-weight: normal;\"> previstas na legislação: compra e venda, doação, desapropriação, arrecadação de imóveis, adjudicação, transferência entre órgãos ou entes federativos, reconhecimento de domínio, sucessão patrimonial e recebimento de bens decorrentes de decisões judiciais.\u003c/span>","text":""},{"icon":"scale","title":"\u003cspan style=\"font-weight: normal;\">Abrange a \u003c/span>constituição de direitos imobiliários, como servidões, concessões de direito real, direitos de superfície e outros\u003cspan style=\"font-weight: normal;\"> instrumentos que permitam ao poder público exercer competências ou viabilizar políticas públicas \u003cmark>sem necessariamente adquirir a propriedade plena do imóvel\u003c/mark>.\u003c/span>","text":""}]}},{"id":"b9xxbugx","type":"prose","props":{"html":"\u003cp>Além da formalização jurídica dos atos, essa função envolve análises técnicas, dominiais, registrais, fundiárias e de viabilidade que subsidiam a tomada de decisão sobre a incorporação de novos ativos ao patrimônio público.\u003c/p>"}}]},{"id":"b_mrwjx804_fgbr","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"book-open-check","title":"Incorporação patrimonial imobiliária","color":"","bg":"var(--petrol-50)","body":"\u003cp>A incorporação patrimonial imobiliária reúne as atividades responsáveis por \u003cb>formalizar o ingresso dos imóveis ou direitos imobiliários nos sistemas de controle e gestão do patrimônio público\u003c/b>. Seu objetivo é garantir que os bens adquiridos ou reconhecidos sejam efetivamente registrados, cadastrados e integrados aos instrumentos utilizados pelo Estado para sua administração, monitoramento e utilização.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b_mrwjyubc_dr3h","type":"feature","props":{"columns":2,"card":false,"accent":"var(--petrol-600)","layout":"top","items":[{"icon":"vector-square","title":"\u003cspan style=\"font-weight: normal;\">Compreende a \u003c/span>identificação e individualização\u003cspan style=\"font-weight: normal;\"> dos imóveis incorporados, o \u003c/span>cadastramento\u003cspan style=\"font-weight: normal;\"> em sistemas corporativos de gestão patrimonial, a \u003c/span>vinculação\u003cspan style=\"font-weight: normal;\"> às unidades responsáveis por sua administração e, quando cabível, a realização dos \u003c/span>atos registrais\u003cspan style=\"font-weight: normal;\"> necessários perante os Cartórios de Registro de Imóveis.\u003c/span>","text":""},{"icon":"clipboard-list","title":"\u003cspan style=\"font-weight: normal;\">Inclui procedimentos relacionados à \u003c/span>atualização de inventários\u003cspan style=\"font-weight: normal;\"> patrimoniais, \u003c/span>registros administrativos\u003cspan style=\"font-weight: normal;\"> e \u003c/span>registros contábeis\u003cspan style=\"font-weight: normal;\"> que asseguram a \u003cmark>correta representação do patrimônio público\u003c/mark>.\u003c/span>","text":""}]}},{"id":"bzoq8ct3","type":"prose","props":{"html":"\u003cp>A incorporação constitui um passo fundamental para a governança patrimonial, pois transforma imóveis ou direitos formalmente adquiridos em ativos efetivamente controlados pelo poder público. Sem essa etapa, torna-se difícil promover sua destinação, avaliação, fiscalização ou utilização, comprometendo a capacidade de gestão e a própria transparência patrimonial.\u003c/p>"}}]},{"id":"b_mrwl7zhs_6mgu","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"book-check","title":"Regularização patrimonial","color":"","bg":"var(--petrol-50)","body":"\u003cp>A regularização patrimonial compreende as atividades destinadas a \u003cb>corrigir, complementar ou consolidar informações jurídicas, registrais, cadastrais e territoriais relacionadas aos imóveis públicos\u003c/b>. Seu objetivo é assegurar que a situação patrimonial dos imóveis reflita adequadamente a realidade física, jurídica e administrativa, reduzindo riscos, conflitos e inconsistências que possam comprometer sua gestão.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"by28a8tw","type":"feature","props":{"columns":2,"card":false,"accent":"var(--petrol-600)","layout":"top","items":[{"icon":"layout-list","title":"Abrange um conjunto amplo de procedimentos\u003cspan style=\"font-weight: normal;\">, como retificações registrais, averbações, georreferenciamento, atualização de confrontações e limites, desmembramentos, remembramentos, saneamento cadastral, consolidação dominial e compatibilização entre registros, cadastros e bases geoespaciais.\u003c/span>\u003cbr>","text":""},{"icon":"folder-clock","title":"\u003cspan style=\"font-weight: normal;\">Também pode envolver a \u003c/span>regularização de situações históricas\u003cspan style=\"font-weight: normal;\"> decorrentes da ausência de registros, sobreposições territoriais, inconsistências documentais ou transformações ocorridas ao longo do tempo.\u003c/span>","text":""}]}},{"id":"b_mrwl7zhs_vqzw","type":"prose","props":{"html":"\u003cp>A regularização patrimonial possui caráter transversal e permanente, acompanhando o imóvel durante todo o seu ciclo de vida. Além de fortalecer a segurança jurídica e a confiabilidade das informações patrimoniais, ela cria condições para que outras funções de gestão, como destinação, fiscalização, avaliação e proteção patrimonial, sejam executadas com maior eficiência e segurança.\u003c/p>"}}]},{"id":"bwu7i85o","type":"kicker","props":{"icon":"text-initial","children":"Glossário das principais funções"}},{"id":"bw7ei7ay","type":"accordion","props":{"numbered":false,"items":[{"title":"Incorporação patrimonial imobiliária","content":"\u003cp>Função de gestão do ingresso patrimonial imobiliário que compreende o conjunto de procedimentos e atos administrativos destinados à formalização da entrada de bens imóveis no patrimônio público, mediante registro cartorial e cadastramento nos sistemas corporativos, assegurando o controle dominial, a rastreabilidade patrimonial e a integração à base oficial de bens públicos.\u003c/p>","imageSlot":"c_7mg0ure__imageSlot"},{"title":"Cadastro patrimonial imobiliário","content":"\u003cp>Subfunção de incorporação patrimonial imobiliária que compreende o conjunto de procedimentos técnicos e administrativos destinados ao lançamento formal do imóvel nos cadastros corporativos do órgão responsável pela sua gestão, assegurando a existência institucional, contabilização e aptidão para gestão. \u003c/p>\u003cp>Consiste no cadastramento sistemático dos atributos físicos, jurídicos e dominiais do imóvel, indispensáveis à sua identificação, controle e utilização administrativa. O lançamento cadastral representa o reconhecimento formal do bem no acervo patrimonial no âmbito dos sistemas corporativos, sendo condição necessária para sua gestão, monitoramento, destinação ou controle. \u003c/p>\u003cp>\u003cb>Exemplos de documentos:\u003c/b>\u003c/p>\u003cp>\u003c/p>\u003cul>\u003cli> Formulário ou ficha cadastral do imóvel no sistema corporativo\u003c/li>\u003cli> Relatório de cadastro ou registro do imóvel no sistema patrimonial;\u003c/li>\u003cli> Extrato cadastral do imóvel;\u003c/li>\u003cli> Memorial descritivo do imóvel para fins cadastrais;\u003c/li>\u003cli> Registro geoespacial do imóvel em sistema de geoinformação;\u003c/li>\u003cli> Nota técnica de cadastramento ou inclusão do imóvel no cadastro patrimonial;\u003c/li>\u003cli>Relatório de validação cadastral do imóvel.\u003c/li>\u003c/ul>\u003cp>\u003c/p>\u003cp>\u003cbr>\u003c/p>","imageSlot":"c_lm412mm__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Registro cartorial ","content":"\u003cp>Subfunção de incorporação patrimonial imobiliária que compreende o conjunto de procedimentos destinados à formalização do domínio público de imóvel no Cartório de Registro de Imóveis competente, quando exigido pela legislação ou necessário à plena eficácia jurídica do direito real. \u003c/p>\u003cp>Aplica-se aos imóveis cuja natureza ou finalidade exija inscrição registral para garantir segurança jurídica, viabilizar alienação, transferência de direitos reais limitados ou outras operações que dependam de publicidade registral. \u003c/p>\u003cp>\u003cb>Exemplos de documentos:\u003c/b>\u003c/p>\u003cp>\u003cul>\u003cli>Certidão de matrícula do imóvel;\u003c/li>\u003cli>Certidão de inteiro teor da matrícula;\u003c/li>\u003cli>Certidão de ônus reais;\u003c/li>\u003cli>Termo de incorporação;\u003c/li>\u003cli>Escritura pública de aquisição ou transferência de imóvel;\u003c/li>\u003cli>Escritura pública de cessão ou doação de imóvel;\u003c/li>\u003cli>Mandado judicial de registro imobiliário;\u003c/li>\u003cli>Ofício administrativo ao cartório de registro de imóveis;\u003c/li>\u003cli>Requerimento de registro ou averbação.\u003c/li>\u003c/ul>\u003c/p>\u003cp>\u003cbr>\u003c/p>","imageSlot":"c_009wn40__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Aquisição patrimonial imobiliária ","content":"Função de gestão do ingresso patrimonial imobiliário que compreende o conjunto de atos e procedimentos administrativos, judiciais e procedimentos legais voltados à aquisição de imóveis pelo poder público, por meio de título aquisitivo ou por ato declaratório, seja a título originário ou derivado, compreendendo atividades de análise documental e dominial, instrução processual, elaboração e celebração do ato aquisitivo ou declaratório","imageSlot":"c_z61s9xd__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Alteração cadastral imobiliária ","content":"Função de gestão do ingresso patrimonial imobiliário que compreende o conjunto de procedimentos destinados a retificar, convalidar e/ou conformar jurídica e registralmente imóveis no patrimônio do poder público, mediante registros, averbações ou retificação fundiária no cartório competente e/ou nos cadastros corporativos. ","imageSlot":"c_62ciiou__imageSlot","linkHref":"","linkLabel":"","linkButton":""}]}}]},{"id":"bzsiqqcn","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"c6v7csup","type":"titulo","props":{"text":"3. Avaliação e contabilidade patrimonial imobiliária","level":"h2"}},{"id":"cd43km2p","type":"prose","props":{"html":"\u003cp>Nenhum patrimônio pode ser adequadamente gerido sem que seu valor seja conhecido. A função de avaliação e contabilidade patrimonial reúne atividades voltadas à mensuração econômica dos imóveis públicos e ao registro contábil desses ativos.\u003c/p>\u003cp>As avaliações apoiam decisões de destinação, alienação, cobrança de receitas patrimoniais, contabilização e planejamento. Já os procedimentos contábeis garantem que o valor dos imóveis esteja refletido de forma adequada nas demonstrações patrimoniais do setor público. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Além dos aspectos econômicos, essa função contribui para a transparência, a governança e a prestação de contas à sociedade.\u003c/span>\u003c/p>"}},{"id":"b_mrwoa2eu_g51l","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"piggy-bank","title":"Avaliação patrimonial imobiliária","color":"","bg":"var(--bg-paper)","body":"\u003cp>A avaliação patrimonial imobiliária compreende as atividades destinadas a determinar o valor dos imóveis públicos para diferentes finalidades administrativas, patrimoniais, econômicas e contábeis. Trata-se de uma função essencial para a tomada de decisões relacionadas à utilização, destinação, aquisição, alienação, regularização e gestão dos ativos imobiliários.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b_mrwoa2eu_gcq9","type":"feature","props":{"columns":2,"card":false,"accent":"var(--ochre-600)","layout":"top","items":[{"icon":"chart-line","title":"\u003cspan style=\"font-weight: normal;\">A avaliação permite estimar o \u003c/span>valor de mercado\u003cspan style=\"font-weight: normal;\">, o \u003c/span>valor patrimonial\u003cspan style=\"font-weight: normal;\">, o \u003c/span>valor locativo\u003cspan style=\"font-weight: normal;\"> ou outros referenciais técnicos necessários à atuação do Estado. Para isso, utiliza \u003c/span>metodologias reconhecidas\u003cspan style=\"font-weight: normal;\">, normas técnicas e critérios compatíveis com as características de cada imóvel e com a finalidade da avaliação. O processo envolve \u003cmark>levantamento de informações, análise documental, vistoria, pesquisa de mercado, tratamento de dados e elaboração de pareceres ou laudos técnicos\u003c/mark>.\u003c/span>","text":""},{"icon":"notebook-pen","title":"\u003cspan style=\"font-weight: normal;\">Além de \u003c/span>subsidiar decisões\u003cspan style=\"font-weight: normal;\"> patrimoniais, a avaliação contribui para \u003c/span>ampliar a transparência\u003cspan style=\"font-weight: normal;\"> sobre o patrimônio público e apoiar a gestão baseada em evidências. Em um contexto de crescente valorização da governança patrimonial, conhecer o valor dos imóveis públicos tornou-se requisito importante para o \u003c/span>planejamento\u003cspan style=\"font-weight: normal;\">, a \u003c/span>racionalização\u003cspan style=\"font-weight: normal;\"> do uso dos ativos e a\u003c/span> geração de valor\u003cspan style=\"font-weight: normal;\"> público.\u003c/span>","text":""}]}}]},{"id":"b_mrwov4zx_1nv9","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"calculator","title":"Contabilidade patrimonial imobiliária","color":"","bg":"var(--bg-paper)","body":"\u003cp>A contabilidade patrimonial imobiliária compreende as atividades voltadas ao reconhecimento, registro, mensuração e evidenciação dos imóveis públicos nas demonstrações contábeis do setor público. Seu objetivo é assegurar que os ativos imobiliários sejam adequadamente representados nos registros patrimoniais e financeiros dos entes governamentais.\u003cbr>\u003cbr>\u003c/p>"},"children":[{"id":"b_mrwov4zx_fdvt","type":"feature","props":{"columns":2,"card":false,"accent":"var(--ochre-600)","layout":"top","items":[{"icon":"file-digit","title":"\u003cp>\u003cspan style=\"font-weight: 400;\">Envolve o \u003c/span>registro da incorporação de imóveis, a atualização de valores patrimoniais, a contabilização de aquisições, alienações, transferências e baixas patrimoniais\u003cspan style=\"font-weight: 400;\">, bem como a \u003c/span>aplicação das normas de contabilidade pública\u003cspan style=\"font-weight: 400;\"> relacionadas aos bens imóveis. Também inclui procedimentos de conciliação entre informações contábeis, cadastrais e registrais, \u003cmark>contribuindo para a qualidade e confiabilidade das informações patrimoniais\u003c/mark>.\u003c/span>\u003c/p>\u003cp>\u003c/p>","text":""},{"icon":"book-open","title":"\u003cspan style=\"font-weight: 400;\">A contabilidade patrimonial desempenha\u003c/span> papel estratégico na governança pública\u003cspan style=\"font-weight: 400;\"> ao permitir que gestores, órgãos de controle e sociedade conheçam \u003cmark>a dimensão e a evolução do patrimônio imobiliário sob responsabilidade do Estado\u003c/mark>. Além disso, fornece informações fundamentais para planejamento, prestação de contas, transparência e avaliação da sustentabilidade patrimonial das instituições públicas.\u003c/span>","text":""}]}}]},{"id":"bsuf1bs1","type":"callout","props":{"variant":"header","tone":"attention","icon":"alert-triangle","title":"Bens imóveis e contabilidade pública","heading":"","children":"\u003cp>Todos os entes federativos brasileiros adotam regras comuns de contabilidade aplicadas ao setor público, definidas pela Secretaria do Tesouro Nacional e alinhadas às Normas Brasileiras de Contabilidade Aplicadas ao Setor Público. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Nesse contexto, os imóveis públicos devem ser registrados e mensurados de forma padronizada, permitindo comparabilidade e transparência das informações patrimoniais. Na esfera federal, os imóveis da União integram o Balanço Geral da União (BGU), documento que consolida as demonstrações contábeis do Governo Federal e evidencia a dimensão econômica de um dos maiores patrimônios imobiliários públicos do mundo.\u003c/span>\u003c/p>"}},{"id":"bujw8xmb","type":"kicker","props":{"icon":"text-initial","children":"Glossário das principais funções"}},{"id":"bqsoybrv","type":"accordion","props":{"numbered":false,"items":[{"title":"Avaliação patrimonial imobiliária","content":"\u003cp>Função de avaliação e contabilidade patrimonial imobiliária que contempla conjunto de atividades destinados à identificação do valor de bem imóvel conforme diretrizes e normas de avaliação, para fins de registro contábil e destinação, segundo normas de contabilidade pública, assegurando a identificação e atualização periódica do patrimônio imobiliário público.\u003c/p>","imageSlot":"c_8ffcqsf__imageSlot"},{"title":"Contabilização patrimonial imobiliária","content":"Função de avaliação e contabilidade patrimonial que contempla conjunto de procedimentos de mensuração, reavaliação, depreciação, transferência de Unidade Gestora (UG) e baixa dos imóveis no sistema contábil patrimonial, com base em normas contábeis e avaliações periódicas que assegurem a integridade e confiabilidade das demonstrações patrimoniais.","imageSlot":"c_dkupyku__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Contabilização patrimonial imobiliária","content":"Subfunção de avaliação patrimonial imobiliária que compreende o conjunto de atividades voltadas à determinação do valor de um imóvel público específico, com base em metodologias técnicas reconhecidas de avaliação imobiliária e em análise de mercado, considerando suas características físicas, jurídicas, locacionais e de uso. Inclui a realização de vistorias, coleta e análise de dados de mercado, aplicação de métodos de avaliação e elaboração de documentos técnicos que expressem o valor estimado do imóvel para fins de gestão patrimonial, tais como destinação, alienação, registro contábil, cálculo de receitas patrimoniais ou outras decisões administrativas. ","imageSlot":"c_kverazd__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Elaboração e manutenção de planta de valores genérica","content":"Subfunção de avaliação patrimonial imobiliária que compreende o conjunto de atividades voltadas à elaboração, atualização e manutenção de planta de valores genérica, instrumento técnico utilizado para estabelecer valores referenciais de imóveis ou terrenos em determinada área territorial, com base em critérios objetivos e estudos de mercado. Inclui a definição de zonas homogêneas de valor, a coleta e análise de dados imobiliários, a modelagem e atualização periódica dos valores de referência e a produção de documentos técnicos que subsidiam a gestão patrimonial, a precificação de destinações, alienações e receitas patrimoniais ou outras decisões administrativas. ","imageSlot":"c_7v1h3hg__imageSlot","linkHref":"","linkLabel":"","linkButton":""}]}}]},{"id":"bedck2pr","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"c5rq4qx2","type":"titulo","props":{"text":"4. Destinação imobiliária","level":"h2"}},{"id":"c0lusca1","type":"prose","props":{"html":"\u003cp>A destinação imobiliária corresponde ao conjunto de atividades voltadas à definição, implementação e gestão das formas de utilização dos imóveis públicos. Trata-se de uma das funções centrais da gestão patrimonial, pois é por meio dela que o patrimônio público deixa de ser apenas um ativo sob controle do Estado e passa a cumprir finalidades concretas relacionadas à implementação de políticas públicas, ao desenvolvimento territorial, à proteção ambiental, à oferta de serviços públicos e à promoção do interesse coletivo.\u003c/p>"}},{"id":"bb8puyal","type":"callout","props":{"variant":"ear","tone":"note","icon":"lightbulb","title":"","heading":"","children":"\u003cp>A destinação não deve ser compreendida apenas como um ato administrativo ou contrato de uso. Trata-se de uma atividade estratégica que exige análise das características do imóvel, das necessidades da sociedade, das prioridades governamentais, das vocações territoriais e dos instrumentos jurídicos disponíveis para viabilizar sua utilização. Em muitos casos, um mesmo imóvel pode contribuir simultaneamente para objetivos sociais, ambientais, econômicos, culturais ou urbanísticos.\u003c/p>"}},{"id":"bbnh71ar","type":"prose","props":{"html":"\u003cp>Essa macrofunção abrange a \u003cb>formulação de estratégias de destinação\u003c/b>, a \u003cb>seleção e aplicação de regimes\u003c/b> e respectivos instrumentos, a \u003cb>articulação com políticas públicas\u003c/b>, a \u003cb>regularização fundiária\u003c/b> de áreas públicas, a \u003cb>gestão compartilhada de territórios estratégicos\u003c/b> e o \u003cb>acompanhamento do uso efetivo dos imóveis destinados\u003c/b>. Em conjunto, essas atividades buscam assegurar que o patrimônio público cumpra sua função socioambiental e gere benefícios duradouros para a sociedade.\u003c/p>"}},{"id":"bw5tyrte","type":"timeline","props":{"eras":[{"label":"","period":"Funções da Destinação","color":"var(--petrol-600)","milestones":[{"date":"","title":"Estratégias e instrumentos de destinação patrimonial","content":"\u003cp>A gestão patrimonial dispõe de diversos regimes e instrumentos jurídicos e administrativos para viabilizar a utilização dos imóveis públicos. A escolha do instrumento adequado depende das características do imóvel, dos objetivos pretendidos e da política pública que se busca implementar.\u003c/p>\u003cp>Essa função envolve a análise de alternativas de destinação e a estruturação de instrumentos como \u003cb>cessões de uso, concessões de direito real, autorizações, permissões, concessões de uso especial, concessões de uso sustentável, transferências entre órgãos públicos, alienações, locações, constituição de servidões, direitos de superfície e outros mecanismos \u003c/b>previstos na legislação.\u003c/p>\u003cp>Mais do que formalizar contratos, essa atividade busca identificar \u003cmark>a melhor forma de transformar o potencial dos imóveis em benefícios concretos para a sociedade\u003c/mark>. A adequada seleção dos instrumentos influencia diretamente a segurança jurídica, a efetividade das políticas públicas e a capacidade do Estado de promover resultados territoriais, sociais, ambientais e econômicos compatíveis com o interesse público.\u003c/p>","imageSlot":"c_u4bv6ac__imageSlot"},{"date":"","title":"Imóveis públicos, políticas públicas e desenvolvimento territorial","content":"\u003cp>Os imóveis públicos constituem instrumentos relevantes para a implementação de políticas públicas e para a promoção do desenvolvimento territorial. Sua utilização influencia diretamente a organização do espaço, o acesso a direitos, a oferta de infraestrutura, a proteção ambiental, a dinamização econômica e a qualidade de vida da população.\u003c/p>\u003cp>A destinação de imóveis pode viabilizar habitação de interesse social, equipamentos públicos, regularização fundiária, proteção de áreas ambientalmente sensíveis, implantação de infraestrutura logística, atividades produtivas, desenvolvimento urbano, turismo sustentável e diversas outras iniciativas de interesse coletivo.\u003c/p>\u003cp>Essa função exige compreender que o valor dos imóveis públicos não se limita à sua dimensão patrimonial ou econômica. Em muitos casos, seu principal potencial está na capacidade de apoiar políticas públicas e induzir transformações territoriais positivas. Por isso, a gestão patrimonial moderna busca alinhar decisões de destinação aos objetivos de desenvolvimento sustentável, às políticas setoriais e às necessidades dos territórios onde os imóveis estão inseridos.\u003c/p>","imageSlot":"c_j36s8ul__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"date":"","title":"Regularização fundiária de áreas públicas","content":"\u003cp>A regularização fundiária constitui uma das mais importantes formas de destinação do patrimônio público. Seu objetivo é promover segurança jurídica da posse, inclusão social, melhoria das condições urbanas e rurais e ampliação do acesso a direitos por populações que ocupam áreas públicas de forma consolidada.\u003c/p>\u003cp>Essa atividade envolve a identificação de ocupações passíveis de regularização, a análise da situação fundiária e urbanística das áreas, a aplicação dos instrumentos legais cabíveis e a formalização dos direitos dos ocupantes. Dependendo do contexto, a regularização pode ser acompanhada por investimentos em infraestrutura, saneamento, equipamentos públicos e qualificação urbana.\u003c/p>\u003cp>Além de contribuir para a redução de conflitos fundiários, a regularização fortalece a integração das áreas ao tecido urbano ou rural, amplia a arrecadação municipal, favorece o acesso ao crédito e promove maior estabilidade para famílias e comunidades. Por essa razão, tornou-se uma das principais estratégias de utilização social do patrimônio público em diferentes esferas de governo.\u003c/p>","imageSlot":"c_436qvxg__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"date":"","title":"Gestão compartilhada da orla e de territórios estratégicos","content":"\u003cp>Alguns espaços públicos possuem características que exigem modelos de gestão compartilhada e cooperação entre diferentes instituições. Esse é o caso da orla marítima, das áreas costeiras, dos corpos hídricos, das unidades de conservação e de outros territórios que concentram interesses ambientais, urbanísticos, econômicos e sociais.\u003c/p>\u003cp>Nesses contextos, a gestão patrimonial não se limita ao controle dominial dos imóveis, exigindo articulação permanente entre órgãos públicos, comunidades locais, setor privado e organizações da sociedade civil. A atuação compartilhada busca compatibilizar usos, reduzir conflitos e promover a ocupação sustentável dos territórios.\u003c/p>\u003cp>A experiência brasileira demonstra que instrumentos de governança colaborativa podem ampliar a efetividade da gestão patrimonial e fortalecer a proteção dos bens públicos. A gestão compartilhada da orla, por exemplo, permite integrar planejamento urbano, preservação ambiental, turismo, mobilidade, desenvolvimento econômico e acesso público aos espaços costeiros.\u003c/p>","imageSlot":"c_rcuxwld__imageSlot","linkHref":"","linkLabel":"","linkButton":""}]}]}},{"id":"b77v5c7u","type":"examplecard","props":{"label":"Programa Imóvel da Gente","icon":"map-pin","color":"","slot":"b77v5c7u__slot","collapse":"none","title":"Uma experiência de destinação orientada à função socioambiental","children":"\u003cp>Criado pela Secretaria do Patrimônio da União (SPU), o \u003cb>Programa Imóvel da Gente\u003c/b> constitui uma das principais iniciativas brasileiras de utilização estratégica do patrimônio público para promoção de políticas públicas. O programa articula a destinação de imóveis da União para diferentes finalidades de interesse social, ambiental e territorial, incluindo habitação de interesse social, regularização fundiária, implantação de equipamentos públicos, proteção ambiental, desenvolvimento comunitário e apoio a povos e comunidades tradicionais.\u003c/p>\u003cp>Além de ampliar o acesso da população ao patrimônio público, o programa busca fortalecer a função socioambiental dos imóveis da União, promovendo seu uso efetivo em benefício da sociedade. A experiência demonstra como a gestão patrimonial pode atuar de forma integrada às políticas públicas, transformando ativos imobiliários em instrumentos de inclusão social, desenvolvimento territorial e sustentabilidade.\u003c/p>\u003cp>\u003ca href=\"https://www.gov.br/gestao/pt-br/assuntos/patrimonio-da-uniao/imoveldagente\" data-btn=\"primary\">Saiba mais\u003c/a>\u003c/p>"}}]},{"id":"bg1w1smd","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"cx535qro","type":"titulo","props":{"text":"5. Gestão econômica e de receitas patrimoniais","level":"h2"}},{"id":"cuhq8b58","type":"prose","props":{"html":"\u003cp>Os imóveis públicos não constituem apenas suporte para políticas públicas, infraestrutura governamental ou proteção ambiental. Em determinadas situações, podem também desempenhar importante função econômica, gerando receitas, apoiando investimentos públicos, induzindo desenvolvimento e contribuindo para a sustentabilidade financeira da gestão patrimonial.\u003c/p>\u003cp>A gestão econômica e de receitas patrimoniais reúne o conjunto de atividades voltadas à utilização dos ativos imobiliários públicos sob a perspectiva econômica, observadas as finalidades públicas, a legislação aplicável e os princípios da administração pública. Essa função busca assegurar que imóveis passíveis de exploração econômica gerem benefícios compatíveis com seu potencial, ao mesmo tempo em que garante a correta arrecadação das receitas decorrentes de sua utilização.\u003c/p>\u003cp>Trata-se de uma função que dialoga diretamente com temas como governança patrimonial, racionalização de ativos, sustentabilidade financeira, transparência e geração de valor público. Em uma perspectiva contemporânea, a gestão econômica não deve ser compreendida como alternativa às funções sociais e ambientais do patrimônio, mas como dimensão complementar da gestão patrimonial, capaz de ampliar a capacidade do Estado de financiar políticas públicas e promover resultados de interesse coletivo.\u003c/p>"}},{"id":"bko00kvb","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"sheet","title":"Gestão de receitas patrimoniais imobiliárias","color":"","bg":"var(--bg-paper)","body":"\u003cp>A gestão de receitas patrimoniais imobiliárias compreende o conjunto de atividades destinadas à arrecadação, controle, cobrança e contabilização dos valores decorrentes da utilização econômica dos imóveis públicos. Seu objetivo é assegurar que o uso privativo ou oneroso desses bens gere o retorno financeiro previsto em lei ou nos instrumentos de destinação, contribuindo para a adequada gestão do patrimônio e para o financiamento das atividades estatais.\u003c/p>\u003cp>Essa função envolve o lançamento, cálculo, registro, arrecadação e controle de receitas patrimoniais, incluindo aluguéis, cessões onerosas, foros, laudêmios, taxas de ocupação, multas, indenizações e demais valores associados à utilização de imóveis públicos. Também abrange a cobrança administrativa de débitos, notificações, renegociações, parcelamentos e encaminhamento de créditos para inscrição em dívida ativa ou execução fiscal, quando necessário.\u003c/p>\u003cp>Além da recuperação de receitas, essa atividade contribui para a transparência, a conformidade jurídica e a equidade na utilização dos bens públicos, assegurando que ocupações ou utilizações economicamente relevantes gerem contrapartidas compatíveis com os benefícios obtidos pelos usuários.\u003c/p>"},"children":[]},{"id":"b_mrwqwmbq_ujfa","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"chart-area","title":"Gestão econômica de ativos imobiliários","color":"","bg":"var(--bg-paper)","body":"\u003cp>A gestão econômica de ativos imobiliários compreende o conjunto de atividades voltadas à utilização estratégica dos imóveis públicos sob a perspectiva da geração de valor econômico. Seu foco não está apenas na arrecadação de receitas correntes, mas na identificação de oportunidades capazes de ampliar o retorno econômico, social e institucional produzido pelo patrimônio público.\u003c/p>\u003cp>Essa função envolve a análise de vocações econômicas dos imóveis, estudos de viabilidade, estruturação de projetos imobiliários, modelagem de negócios, alienações, concessões, locações, parcerias público-privadas, fundos de investimento imobiliário, securitização de ativos e outros mecanismos que permitam potencializar o valor dos imóveis públicos. Também inclui a avaliação de riscos, custos, oportunidades e impactos associados às diferentes estratégias de utilização econômica.\u003c/p>\u003cp>A gestão econômica de ativos parte do reconhecimento de que os imóveis públicos constituem ativos estratégicos do Estado. Quando adequadamente conhecidos e administrados, podem contribuir para ampliar a capacidade de investimento público, apoiar projetos estruturantes, financiar políticas governamentais e gerar benefícios econômicos duradouros para a sociedade, sem perder de vista sua função pública e seu papel no desenvolvimento sustentável.\u003c/p>"},"children":[]}]},{"id":"bjfrb0mw","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"cdm506gy","type":"titulo","props":{"text":"6. Controle, fiscalização e proteção patrimonial","level":"h2"}},{"id":"ca6kbqk1","type":"prose","props":{"html":"\u003cp>Os imóveis públicos estão sujeitos a diversos riscos ao longo de seu ciclo de vida, como ocupações irregulares, invasões, degradação física, descumprimento de contratos, perda de informações patrimoniais e utilização incompatível com sua finalidade pública. Para enfrentar esses desafios, a gestão patrimonial desenvolve um conjunto de atividades voltadas ao monitoramento, fiscalização, proteção e acompanhamento permanente dos imóveis.\u003c/p>\u003cp>Essa macrofunção reúne processos destinados a preservar a integridade física, jurídica, econômica e funcional do patrimônio público, garantindo que os imóveis permaneçam adequadamente protegidos, conservados e utilizados em conformidade com os objetivos que justificaram sua incorporação ao patrimônio estatal.\u003c/p>\u003cp>Mais do que identificar problemas, essas atividades produzem informações estratégicas para a tomada de decisões, permitindo corrigir irregularidades, prevenir perdas patrimoniais e aperfeiçoar continuamente a gestão dos imóveis públicos.\u003c/p>"}},{"id":"boyt1mck","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"file-pen","title":"Fiscalização patrimonial imobiliária","color":"","bg":"var(--ochre-50)","body":"\u003cp>A fiscalização patrimonial imobiliária compreende as atividades destinadas a verificar a situação dos imóveis públicos e a conformidade de sua utilização com a legislação e as finalidades públicas estabelecidas. Trata-se de uma das principais funções de proteção patrimonial, pois permite identificar irregularidades, prevenir ocupações indevidas e assegurar a adequada utilização dos bens públicos.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"bknw2382","type":"feature","props":{"columns":2,"card":false,"accent":"var(--terra-600)","layout":"top","items":[{"icon":"map-pin","title":"\u003cspan style=\"font-weight: normal;\">Envolve vistorias presenciais, inspeções técnicas, diligências, levantamentos de campo, produção de relatórios, coleta de evidências e análise de denúncias\u003c/span>","text":""},{"icon":"satellite-dish","title":"\u003cspan style=\"font-weight: normal;\">Inclui o monitoramento remoto por meio de imagens de satélite, drones, sensoriamento remoto e outras geotecnologias que ampliam a capacidade de acompanhamento territorial.\u003c/span>","text":""}]}},{"id":"bzmuk3rq","type":"prose","props":{"html":"\u003cp>Quando identificadas irregularidades, a fiscalização subsidia a adoção de medidas administrativas, judiciais ou extrajudiciais destinadas à correção das situações constatadas. Dessa forma, atua tanto na prevenção quanto na repressão de práticas que comprometam a integridade ou a função pública dos imóveis.\u003c/p>"}}]},{"id":"b_mrwr1vc7_191t","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"file-cog","title":"Controle e manutenção imobiliária","color":"","bg":"var(--ochre-50)","body":"\u003cp>O controle e a manutenção imobiliária reúnem as atividades voltadas ao acompanhamento das condições físicas, cadastrais e operacionais dos imóveis públicos, buscando assegurar sua conservação, funcionalidade e disponibilidade para cumprimento de suas finalidades.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b_mrwr1vc7_gt0e","type":"feature","props":{"columns":2,"card":false,"accent":"var(--terra-600)","layout":"top","items":[{"icon":"building","title":"\u003cspan style=\"font-weight: 400;\">Compreende inspeções prediais, avaliações das condições de uso, acompanhamento de intervenções, identificação de necessidades de manutenção, monitoramento de riscos estruturais e atualização permanente das informações patrimoniais. \u003c/span>","text":""},{"icon":"tag-plus","title":"\u003cspan style=\"font-weight: 400;\">Envolve a gestão de informações sobre ocupação, estado de conservação, custos de manutenção e vida útil dos ativos imobiliários.\u003c/span>","text":""}]}},{"id":"b_mrwr1vc7_hypz","type":"prose","props":{"html":"\u003cp>Nos imóveis utilizados diretamente pela Administração Pública, essa atividade assume papel estratégico para garantir condições adequadas de funcionamento dos serviços públicos. Já nos imóveis destinados a terceiros, contribui para verificar se as condições pactuadas estão sendo observadas e se o patrimônio permanece preservado. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A adequada manutenção reduz custos futuros, evita a deterioração dos ativos e contribui para a sustentabilidade da gestão patrimonial.\u003c/span>\u003c/p>"}}]},{"id":"b_mrwr4a94_8js9","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"file-badge","title":"Gestão de contratos e atos de destinação imobiliária","color":"","bg":"var(--ochre-50)","body":"\u003cp>A gestão de contratos e atos de destinação imobiliária compreende o acompanhamento permanente dos instrumentos que autorizam, formalizam ou regulam a utilização dos imóveis públicos por órgãos públicos, entidades privadas, organizações sociais, comunidades ou particulares.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},"children":[{"id":"b_mrwr4a94_t69t","type":"feature","props":{"columns":2,"card":false,"accent":"var(--terra-600)","layout":"top","items":[{"icon":"calendar-1","title":"\u003cspan style=\"font-weight: 400;\">Envolve o controle de prazos, encargos, contrapartidas, obrigações contratuais e finalidades estabelecidas nos instrumentos de destinação.\u003c/span>","text":""},{"icon":"iteration-cw","title":"\u003cspan style=\"font-weight: 400;\">Abrange a análise de pedidos de renovação, alteração, transferência ou encerramento de contratos, bem como a verificação do cumprimento das condições que justificaram a destinação do imóvel.\u003c/span>","text":""}]}},{"id":"b_mrwr4a94_2yvc","type":"prose","props":{"html":"\u003cp>Além do acompanhamento administrativo, essa atividade desempenha importante papel na proteção patrimonial ao permitir identificar descumprimentos contratuais, desvios de finalidade, inadimplência e outras situações que possam comprometer o interesse público.\u003c/p>\u003cp>Ao assegurar que os imóveis permaneçam vinculados às finalidades para as quais foram destinados, essa função conecta diretamente a gestão patrimonial aos resultados sociais, ambientais, econômicos e territoriais esperados da utilização dos bens públicos.\u003c/p>"}}]},{"id":"b4kg8r7l","type":"kicker","props":{"icon":"text-initial","children":"Glossário das principais funções"}},{"id":"b37okzvt","type":"accordion","props":{"numbered":false,"items":[{"title":"Controle patrimonial imobiliário","content":"\u003cp>Função de gestão patrimonial imobiliária que reúne atividades de controle, fiscalização, vistoria, proteção e monitoramento dos imóveis públicos, abrangendo a verificação do uso dos imóveis, do cumprimento de obrigações contratuais, da integridade física dos bens e da adoção de medidas destinadas à prevenção e correção de irregularidades. \u003c/p>","imageSlot":"c_s2p3lt6__imageSlot"},{"title":"Fiscalização patrimonial imobiliária","content":"Conjunto de ações sistemáticas destinadas a verificar a situação física, territorial, ocupacional e funcional dos imóveis públicos, com base em informações de campo, documentos, sistemas corporativos e geotecnologias, visando prevenir, identificar e corrigir irregularidades, bem como recuperar áreas públicas indevidamente ocupadas ou utilizadas. ","imageSlot":"c_ksd2t8x__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Fiscalização patrimonial preventiva","content":"Atividades voltadas à verificação antecipada das condições de uso, ocupação, conservação e segurança dos imóveis públicos, permitindo identificar riscos, inconformidades e necessidades de intervenção antes que ocorram danos ou irregularidades mais graves. Inclui, entre outras ações, inspeções prediais e vistorias. ","imageSlot":"c_l0k703a__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Fiscalização patrimonial coercitiva","content":"Conjunto de ações administrativas voltadas à repressão de ocupações irregulares, usos indevidos ou descumprimento de normas aplicáveis aos imóveis públicos. Pode envolver notificações, embargos, multas, desocupações, cobrança de indenizações e outras medidas destinadas a restabelecer a legalidade e proteger o patrimônio público. ","imageSlot":"c_jrwj04x__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Controle e manutenção imobiliária","content":"Conjunto de atividades destinadas à preservação física, segurança, conservação mínima e administração operacional dos imóveis públicos, especialmente daqueles sob guarda direta do órgão gestor ou temporariamente desocupados, assegurando sua integridade até nova utilização ou destinação. ","imageSlot":"c_ammcwk1__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Gestão de imóveis desocupados","content":"Função voltada à proteção e conservação de imóveis públicos não utilizados, abrangendo medidas de vigilância, segurança, cercamento, conservação preventiva e manutenção corretiva destinadas a evitar invasões, depredações, furtos ou deterioração do patrimônio. ","imageSlot":"c_przypub__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Manutenção predial","content":"Conjunto de serviços e intervenções destinados a preservar a funcionalidade, segurança e conservação das edificações públicas, incluindo reparos, reformas e melhorias em estruturas, instalações e sistemas prediais. Embora nem sempre seja atribuição do órgão gestor patrimonial, constitui elemento essencial para a adequada utilização dos imóveis públicos. ","imageSlot":"c_bdoia63__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Gestão de contratos e atos de destinação imobiliária","content":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Conjunto de atividades relacionadas ao acompanhamento, controle, modificação, registro, revisão e encerramento dos instrumentos que regulam a utilização dos imóveis públicos, assegurando a conformidade jurídica, a atualização cadastral e o cumprimento das obrigações pactuadas.\u003c/span>\u003c/p>","imageSlot":"c_aonym7o__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Monitoramento contratual","content":"Atividades de acompanhamento sistemático da vigência, dos encargos, das contrapartidas e das obrigações previstas nos contratos e atos de destinação, incluindo controle de prazos, registro de inconformidades e adoção de providências corretivas quando necessário. ","imageSlot":"c_olc8p8n__imageSlot","linkHref":"","linkLabel":"","linkButton":""},{"title":"Gestão de alterações e extinções contratuais","content":"Procedimentos destinados à modificação, prorrogação, revisão, transferência ou encerramento dos instrumentos de destinação, assegurando a rastreabilidade histórica, a integridade jurídica dos atos e a atualização dos registros patrimoniais.","imageSlot":"c_229sva5__imageSlot","linkHref":"","linkLabel":"","linkButton":""}]}}]},{"id":"b909pi3o","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"cod3oi97","type":"titulo","props":{"text":"7. Gestão da informação, dados e conhecimento patrimonial","level":"h2"}},{"id":"cue86fyc","type":"prose","props":{"html":"\u003cp>Todas as funções da gestão patrimonial imobiliária dependem da existência de informações confiáveis, atualizadas e acessíveis. Caracterizar um imóvel, incorporá-lo ao patrimônio público, avaliá-lo, destiná-lo, fiscalizar sua utilização ou proteger seus direitos exige informações produzidas ao longo de todo o seu ciclo de vida.&nbsp;\u003c/p>\u003cp>A \u003cb>gestão da informação, dados e conhecimento patrimonial \u003c/b>reúne o conjunto de atividades destinadas à produção, organização, integração, preservação e disponibilização das informações relacionadas ao patrimônio imobiliário público. Trata-se de uma função transversal, que apoia todas as demais funções de gestão patrimonial e fornece a base informacional necessária à tomada de decisões.&nbsp;\u003c/p>"}},{"id":"bqz9ue6p","type":"kicker","props":{"icon":"compass","children":"muito mais do que manter cadastros atualizados"}},{"id":"b9dsicdx","type":"prose","props":{"html":"\u003cp>Essa macrofunção inclui:\u003c/p>"}},{"id":"bek93e3p","type":"feature","props":{"columns":3,"card":false,"accent":"var(--slate-600)","layout":"side","items":[{"icon":"map","title":"\u003cspan style=\"font-weight: normal;\">Produção de dados territoriais\u003c/span>","text":""},{"icon":"chevrons-left-right-ellipsis","title":"\u003cspan style=\"font-weight: normal;\">Integração entre sistemas corporativos\u003c/span>","text":""},{"icon":"files","title":"\u003cspan style=\"font-weight: normal;\">Organização de documentos técnicos\u003c/span>","text":""},{"icon":"map-pin-check","title":"\u003cspan style=\"font-weight: normal;\">Gestão da informação geoespacial\u003c/span>","text":""},{"icon":"book-open-check","title":"\u003cspan style=\"font-weight: normal;\">Preservação da memória institucional\u003c/span>","text":""},{"icon":"message-square-share","title":"\u003cspan style=\"font-weight: normal;\">Compartilhamento do conhecimento produzido\u003c/span>","text":""}]}},{"id":"b_msqpuyvs_o290","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Em um contexto de transformação digital, essa função tornou-se elemento estruturante da gestão patrimonial moderna. A integração entre cadastros, registros, bases cartográficas, sistemas corporativos e ferramentas analíticas amplia a capacidade do Estado de conhecer seu patrimônio, reduzir inconsistências, apoiar políticas públicas e produzir decisões baseadas em evidências.&nbsp;&nbsp;\u003c/span>\u003c/p>"}},{"id":"b5zvaqqq","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"braces","title":"Gestão de dados patrimoniais&nbsp;","color":"","bg":"var(--slate-100)","body":"\u003cp>A gestão de dados patrimoniais compreende as atividades destinadas à produção, organização, atualização, integração e disponibilização dos dados relacionados aos imóveis públicos. Seu objetivo é assegurar que as informações utilizadas pela Administração Pública sejam consistentes, confiáveis e adequadamente estruturadas para apoiar a gestão patrimonial.&nbsp;\u003c/p>\u003cp>Essa função envolve a \u003cb>definição\u003c/b> de padrões de dados, o \u003cb>tratamento\u003c/b> de inconsistências cadastrais, a \u003cb>integração\u003c/b> entre diferentes bases de informação, a \u003cb>manutenção\u003c/b> de cadastros corporativos e a \u003cb>interoperabilidade\u003c/b> entre sistemas. Também inclui atividades relacionadas à \u003cb>governança\u003c/b> de dados, à \u003cb>qualidade da informação\u003c/b> e à \u003cb>padronização\u003c/b> de atributos utilizados na representação dos imóveis públicos.&nbsp;\u003c/p>"},"children":[{"id":"bnnoj8n4","type":"markerlist","props":{"variant":"icon","icon":"badge-check","accent":"var(--ochre-600)","items":[{"title":"\u003cbr>","text":"Ao garantir dados íntegros e interoperáveis, essa função reduz retrabalho, melhora a confiabilidade das informações patrimoniais e fortalece a atuação integrada entre diferentes órgãos e instituições.&nbsp;"}]}}]},{"id":"b_msqqdvy5_rxud","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"satellite","title":"Gestão da informação geoespacial&nbsp;","color":"","bg":"var(--slate-100)","body":"\u003cp>Grande parte das informações patrimoniais possui dimensão territorial. Por essa razão, a gestão patrimonial depende da produção e utilização de informações geoespaciais capazes de representar a localização, os limites, as características físicas e a relação dos imóveis com o território.&nbsp;\u003c/p>\u003cp>Essa função reúne atividades relacionadas à \u003cb>produção\u003c/b> cartográfica, \u003cb>georreferenciamento\u003c/b>, \u003cb>manutenção\u003c/b> de bases geoespaciais, \u003cb>integração\u003c/b> de imagens de satélite, fotografias aéreas, modelos digitais do terreno e demais informações espaciais utilizadas pela gestão patrimonial.&nbsp;\u003c/p>"},"children":[{"id":"b_msqqdvy5_oms9","type":"markerlist","props":{"variant":"icon","icon":"badge-check","accent":"var(--ochre-600)","items":[{"title":"\u003cbr>","text":"A utilização integrada dessas informações permite identificar sobreposições, acompanhar alterações territoriais, apoiar fiscalizações, subsidiar avaliações, aperfeiçoar processos de caracterização e fortalecer o planejamento territorial.&nbsp;"}]}}]},{"id":"b_msqqfrj6_0ev6","type":"panel","props":{"variant":"box","kicker":"‎&nbsp;","kickerIcon":"book-search","title":"Gestão documental e do conhecimento patrimonial","color":"","bg":"var(--slate-100)","body":"\u003cp>A gestão patrimonial produz grande quantidade de documentos técnicos, jurídicos e administrativos ao longo do ciclo de vida dos imóveis públicos. Plantas, memoriais descritivos, matrículas, pareceres, laudos, contratos, processos administrativos, fotografias, mapas e estudos técnicos constituem parte do patrimônio informacional necessário à atuação do Estado.&nbsp;\u003c/p>\u003cp>Essa função reúne as atividades destinadas à \u003cb>organização\u003c/b>, \u003cb>preservação\u003c/b>, \u003cb>recuperação\u003c/b>, \u003cb>compartilhamento\u003c/b> e \u003cb>reutilização\u003c/b> dessas informações, transformando documentos dispersos em conhecimento institucional.&nbsp;\u003c/p>\u003cp>Além da gestão documental, essa função compreende iniciativas voltadas à sistematização de boas práticas, produção de referenciais técnicos, taxonomias, bases de conhecimento, capacitação e mecanismos que favoreçam o compartilhamento da experiência acumulada pelas instituições responsáveis pela gestão patrimonial.&nbsp;\u003c/p>"},"children":[{"id":"b_msqqfrj6_03vp","type":"markerlist","props":{"variant":"icon","icon":"badge-check","accent":"var(--ochre-600)","items":[{"title":"\u003cbr>","text":"Ao preservar o conhecimento institucional, reduz-se a perda de informações decorrente da rotatividade de servidores, fortalece-se a aprendizagem organizacional e amplia-se a capacidade do Estado de aperfeiçoar continuamente sua atuação.&nbsp;"}]}}]},{"id":"be0h6un7","type":"callout","props":{"variant":"header","tone":"warning","icon":"badge-alert","title":"Informação também é patrimônio","heading":"","children":"\u003cp>Assim como os imóveis precisam ser protegidos, as informações produzidas sobre eles também constituem ativos estratégicos da Administração Pública. Informações incompletas, desatualizadas ou inconsistentes comprometem decisões, aumentam riscos jurídicos e dificultam a implementação de políticas públicas. Por essa razão, a gestão da informação passou a ser reconhecida como uma função essencial da gestão patrimonial contemporânea.&nbsp;\u003c/p>"}},{"id":"b5jnguug","type":"kicker","props":{"icon":"text-initial","children":"Glossário das principais funções"}},{"id":"bthothm9","type":"accordion","props":{"numbered":false,"items":[{"title":"Gestão da informação, dados e conhecimento patrimonial&nbsp;","content":"\u003cp>Função de gestão patrimonial imobiliária que compreende o conjunto de atividades destinadas à produção, organização, integração, preservação, governança e disponibilização de dados, documentos, informações geoespaciais e conhecimento institucional relacionados ao patrimônio imobiliário público, apoiando todas as demais funções da gestão patrimonial.&nbsp;\u003c/p>"},{"title":"Gestão de dados patrimoniais&nbsp;","content":"Subfunção responsável pela produção, organização, padronização, integração, atualização e governança dos dados relativos aos imóveis públicos, assegurando qualidade, interoperabilidade e confiabilidade das informações utilizadas pela Administração Pública.&nbsp;","linkHref":"","linkLabel":"","linkButton":""},{"title":"Gestão da informação geoespacial&nbsp;","content":"Subfunção que reúne atividades relacionadas à produção, organização e utilização de informações cartográficas e geográficas aplicadas à gestão patrimonial, incluindo georreferenciamento, bases cartográficas, sensoriamento remoto e sistemas de informação geográfica.&nbsp;","linkHref":"","linkLabel":"","linkButton":""},{"title":"Gestão documental patrimonial&nbsp;","content":"Subfunção destinada à organização, preservação, classificação, recuperação e disponibilização da documentação técnica, jurídica e administrativa produzida ao longo do ciclo de vida dos imóveis públicos, assegurando rastreabilidade, autenticidade e preservação da memória institucional.&nbsp;","linkHref":"","linkLabel":"","linkButton":""},{"title":"Gestão do conhecimento patrimonial&nbsp;","content":"Subfunção que compreende as atividades voltadas à identificação, sistematização, compartilhamento, preservação e disseminação do conhecimento produzido na gestão patrimonial imobiliária, incluindo boas práticas, taxonomias, referenciais técnicos, bases de conhecimento, capacitação e mecanismos de aprendizagem organizacional.&nbsp;","linkHref":"","linkLabel":"","linkButton":""}]}}]},{"id":"btse31ee","type":"pagefooter","props":{"code":"funções, conexões e ciclo de vida dos imóveis públicos [M151]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Conteúdo","name":"Claudson Moreira"},{"role":"Revisão","name":"Ana Tulia de Macedo"},{"role":"Design Educacional","name":"Luís Henrique Lindner"},{"role":"Versão","name":"Agosto de 2026"}]}}]}</script>

(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;

      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),

  }

<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('title') || el.getAttribute('data-definition') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('span').textContent = def;
      document.body.appendChild(pop);
      popById[id] = pop;

        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };

      };

    });
