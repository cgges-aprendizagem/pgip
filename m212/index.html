<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M212 - Evolução histórico-jurídica do sistema patrimonial imobiliário público e privado","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"cyvx26vx","text":"Por que o Estado precisa controlar seus imóveis?","hidden":false},{"id":"czzb7w6z","text":"Dois sistemas que nasceram para finalidades diferentes","hidden":false},{"id":"crgxkuit","text":"A evolução dos sistemas de controle patrimonial","hidden":false},{"id":"c727qcxs","text":"O caso dos imóveis públicos","hidden":false},{"id":"clo9cbfd","text":"Por que isso é importante hoje?","hidden":false},{"id":"cpz6krea","text":"Em conclusão: por que cadastro e registro precisam dialogar?","hidden":false}]}},"blocks":[{"id":"b87hxrn2","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bndy2wua","type":"hero","props":{"kicker":" reconhecimento e manutenção do cadastro de imóveis públicos","kickerIcon":"compass","title":"Evolução histórico-jurídica do sistema patrimonial imobiliário público e privado","byline":"por que cadastro e registro precisam dialogar","slot":"bndy2wua__slot"}},{"id":"bki9aicp","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cyvx26vx","type":"titulo","props":{"text":"Por que o Estado precisa controlar seus imóveis?","level":"h2"}},{"id":"c9e60lcq","type":"prose","props":{"html":"\u003cp>Imagine uma cidade sem muita clareza de endereços, sem mapas confiáveis e sem documentos capazes de identificar quem é proprietário de cada imóvel. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Durante boa parte da história brasileira, essa era uma dificuldade real. \u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">O crescimento do território nacional e o aumento da complexidade das relações fundiárias exigiram o desenvolvimento de mecanismos capazes de responder a perguntas fundamentais:\u003c/span>\u003c/p>"}},{"id":"bfsqllrn","type":"feature","props":{"columns":4,"card":true,"accent":"","items":[{"icon":"map-pin","title":"\u003cp>Onde está o imóvel? \u003c/p>\u003cp>\u003c/p>","text":""},{"icon":"scan","title":"\u003cp>Quais são seus limites? \u003c/p>\u003cp>\u003c/p>","text":""},{"icon":"users-round","title":"\u003cp>Quem é o seu proprietário? \u003c/p>\u003cp>\u003c/p>","text":""},{"icon":"shield-plus","title":"\u003cp>Como comprovar essa propriedade? \u003c/p>\u003cp>\u003c/p>","text":""}]}},{"id":"bmnddik3","type":"prose","props":{"html":"\u003cp>Essas perguntas estão na origem dos atuais sistemas de cadastro e registro imobiliário.\u003c/p>"}}]},{"id":"bbgv9mwy","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"czzb7w6z","type":"titulo","props":{"text":"Dois sistemas que nasceram para finalidades diferentes","level":"h2"}},{"id":"c09o5j8j","type":"prose","props":{"html":"\u003cp>Ao longo do tempo, consolidaram-se dois instrumentos distintos.\u003c/p>"}},{"id":"bfvg0qf2","type":"panel","props":{"variant":"box","kicker":"Cadastro e Registro de imóveis","kickerIcon":"map-pin","title":"Cadastro","color":"","bg":"var(--ochre-50)","body":"\u003cp>O cadastro surgiu com foco territorial, funcionando como uma espécie de inventário público de dados concernentes a parcelas territoriais. É tradicionalmente mantido e organizado por organizações governamentais responsáveis pelo gerenciamento territorial ou tributário.\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Seu objetivo principal é identificar fisicamente os imóveis, permitindo conhecer:\u003c/span>\u003c/p>"},"children":[{"id":"b1kjercv","type":"columns","props":{"count":"3","ratio":"equal","gap":"sm"},"children":[{"id":"br7sr4lq","type":"markerlist","props":{"variant":"check","icon":"check","accent":"","items":[{"title":"Localização","text":""},{"title":"Dimensões","text":""}]}},{"id":"b_mrws4xe2_1vcj","type":"markerlist","props":{"variant":"check","icon":"check","accent":"","items":[{"title":"Confrontações","text":""},{"title":"Uso do solo","text":""}]}},{"id":"b_mrws4ypp_fmfs","type":"markerlist","props":{"variant":"check","icon":"check","accent":"","items":[{"title":"Informações territoriais","text":""}]}}]},{"id":"batheojo","type":"titulo","props":{"text":"Registro de imóveis","level":"h3"}},{"id":"byc5zerv","type":"prose","props":{"html":"\u003cp>O registro imobiliário surgiu com uma finalidade diferente. Seu objetivo era garantir segurança jurídica às relações envolvendo a propriedade, sobretudo dos imóveis particulares. Ele foi mantido e organizado por estruturas que integravam o Estado, mas que ao longo dos anos se tornaram serviços independentes, com natureza privada, embora continuem a prestar uma função pública: os cartórios.\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Por meio do registro tornou-se possível identificar:\u003c/span>\u003c/p>"}},{"id":"b_mrws8u92_mlc3","type":"columns","props":{"count":"3","ratio":"equal","gap":"sm"},"children":[{"id":"b_mrws8u92_9k3f","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--green-600)","items":[{"title":"Proprietário","text":""},{"title":"Histórico de transmissões;","text":""}]}},{"id":"b_mrws8u92_cq70","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--green-600)","items":[{"title":"Ônus","text":""},{"title":"Restrições","text":""}]}},{"id":"b_mrws8u92_hmb8","type":"markerlist","props":{"variant":"check","icon":"check","accent":"var(--green-600)","items":[{"title":"Direitos reais","text":""}]}}]}]}]},{"id":"bo2onjru","type":"section","props":{"width":"content","surface":"dark","pad":"lg"},"children":[{"id":"crgxkuit","type":"titulo","props":{"text":"A evolução dos sistemas de controle patrimonial","level":"h2"}},{"id":"cn889r8u","type":"prose","props":{"html":"\u003cp>Com o passar dos anos, cadastro e registro passaram a coexistir. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Embora possuam finalidades distintas, ambos se tornaram essenciais para a gestão do patrimônio imobiliário.\u003c/span>\u003c/p>"}},{"id":"bwn0tbn4","type":"compareab","props":{"a":{"label":"\u003cp>Enquanto o cadastro responde \u003c/p>\u003cp>\u003c/p>","icon":"building","title":"\u003cp>\"Onde está o imóvel?\"\u003c/p>\u003cp>\u003c/p>","content":"\u003cp>\u003cul>\u003cli>Territorial\u003c/li>\u003cli>Localização\u003c/li>\u003cli>Limites\u003c/li>\u003cli>Base cartográfica\u003c/li>\u003c/ul>\u003c/p>"},"b":{"label":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit; font-size: 12.48px; letter-spacing: 0.1em;\">O registro responde\u003c/span>\u003c/p>\u003cp>\u003c/p>","icon":"scale","title":"\"Quem é o titular do imóvel?\"","content":"\u003cul>\u003cli>Jurídico\u003c/li>\u003cli>Titularidade\u003c/li>\u003cli>Direitos\u003c/li>\u003cli>Matrícula\u003c/li>\u003c/ul>\u003cp>\u003c/p>"}}}]},{"id":"bwfcquib","type":"section","props":{"width":"content","surface":"white","pad":"lg"},"children":[{"id":"c727qcxs","type":"titulo","props":{"text":"O caso dos imóveis públicos","level":"h2"}},{"id":"bzg8bmc6","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b_mrwrg1qf_huvo","type":"prose","props":{"html":"\u003cp>Para os imóveis públicos, especialmente os da União, o desafio é ainda maior. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Muitos desses imóveis possuem origem histórica antiga, decorrente de \u003cmark data-hl=\"green\">terras devolutas, terrenos de marinha, áreas incorporadas por sucessão histórica, desapropriações e aquisições diversas.\u003c/mark>\u003c/span>\u003c/p>\u003cp>Em vários casos, o reconhecimento do domínio público antecede a própria existência de matrículas imobiliárias. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Por isso, a gestão patrimonial da União sempre exigiu a combinação de diferentes fontes de informação, \u003cmark data-hl=\"green\">como documentos históricos, cadastros patrimoniais, levantamentos territoriais e registros imobiliários.\u003c/mark>\u003c/span>\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>"}}]}]},{"id":"b8gauybf","type":"section","props":{"width":"wide","surface":"white","pad":"md"},"children":[{"id":"bxvvuy46","type":"figure","props":{"slot":"bxvvuy46__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]},{"id":"bn5j54rk","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"clo9cbfd","type":"titulo","props":{"text":"Por que isso é importante hoje?","level":"h2"}},{"id":"ch96comj","type":"prose","props":{"html":"\u003cp>A caracterização e a incorporação de imóveis públicos dependem justamente da integração entre essas diferentes fontes de informação. Compreender a evolução histórica dos sistemas de controle patrimonial permite entender por que:\u003c/p>"}},{"id":"bpfzflel","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"by8hvfio","type":"feature","props":{"columns":1,"card":false,"accent":"var(--petrol-600)","items":[{"icon":"file-exclamation-point","title":"Cadastro e registro nem sempre coincidem.","text":"Uma linha."},{"icon":"file-question-mark","title":"Imóveis públicos podem existir sem matrícula.","text":""},{"icon":"library-big","title":"A análise patrimonial exige investigação histórica e documental.","text":""},{"icon":"search","title":"A gestão do patrimônio público vai além da simples consulta ao cartório. ","text":""}]}},{"id":"b5gnna5r","type":"figure","props":{"slot":"b5gnna5r__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"bxpy73k8","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cpz6krea","type":"titulo","props":{"text":"Em conclusão: por que cadastro e registro precisam dialogar?","level":"h2"}},{"id":"cxiki8ks","type":"prose","props":{"html":"\u003cp>Ao longo da história, cadastro e registro imobiliário foram desenvolvidos de forma relativamente independente. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Enquanto o cadastro foi estruturado para responder perguntas relacionadas ao território e às características físicas dos imóveis, o registro imobiliário foi concebido para garantir segurança jurídica às relações de propriedade, em especial a propriedade privada. \u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Essa separação histórica produziu uma consequência importante: \u003cmark>muitas vezes os dados cadastrais e registrais não coincidem.\u003c/mark>\u003c/span>\u003c/p>"}},{"id":"bcpg38fq","type":"panel","props":{"variant":"box","kicker":"\u003cp>\u003c/p>\u003cspan style=\"color: inherit; font-size: 12.48px; letter-spacing: 1.9968px;\">É possível encontrar situações em que:\u003c/span>\u003cp>\u003c/p>\u003cp>\u003c/p>","kickerIcon":"map-pin","title":"","color":"","bg":"var(--bg-paper)","body":""},"children":[{"id":"bqlmh4zc","type":"feature","props":{"columns":3,"card":false,"accent":"var(--petrol-600)","items":[{"icon":"building","title":"","text":"\u003cp>O imóvel existe no cadastro de determinado órgão público, muitas vezes em nome de um ente público, mas no registro possui matrícula em nome de um particular – é o fenômeno que chamam de “beliche dominial”;\u003c/p>\u003cp>\u003c/p>"},{"icon":"file-pen-line","title":"","text":"\u003cp>A matrícula registra determinada área, mas sua representação territorial não corresponde à realidade;\u003c/p>\u003cp>\u003c/p>"},{"icon":"alert-circle","title":"","text":"Informações sobre limites, confrontações ou titularidade apresentam divergências entre diferentes bases de dados."}]}}]},{"id":"b42t80e8","type":"prose","props":{"html":"\u003cp>Nos imóveis públicos, essas situações são ainda mais frequentes em razão da origem histórica desses bens e da própria evolução dos sistemas de controle patrimonial. Por essa razão, a gestão patrimonial moderna exige \u003cmark data-hl=\"terra\">\u003cmark>crescente integração entre órgãos responsáveis pelos cadastros territoriais, cartórios de registro de imóveis, sistemas de geoinformação e bases patrimoniais da Administração Pública.\u003c/mark>\u003c/mark>\u003c/p>\u003cp>O objetivo não é substituir um sistema pelo outro. \u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Ao contrário. \u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Cadastro e registro desempenham funções distintas e complementares. \u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">A integração entre ambos permite:\u003c/span>\u003c/p>"}},{"id":"bt8kg5c7","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"bjs6dnmc","type":"markerlist","props":{"variant":"icon","icon":"shield-check","accent":"var(--ochre-600)","items":[{"title":"Maior segurança jurídica\u003cbr>","text":""},{"title":"Melhor identificação dos imóveis públicos\u003cbr>","text":""},{"title":"\u003cp>Redução de conflitos fundiários\u003c/p>\u003cp>\u003c/p>","text":""}]}},{"id":"b_mrwssrcu_j37g","type":"markerlist","props":{"variant":"icon","icon":"shield-check","accent":"var(--ochre-600)","items":[{"title":"Aumento da confiabilidade das bases patrimoniais\u003cbr>","text":""},{"title":"\u003cp>Melhoria da tomada de decisões sobre a gestão do patrimônio público imobiliário\u003c/p>\u003cp>\u003c/p>","text":""}]}}]},{"id":"b5amhvue","type":"prose","props":{"html":"\u003cp>Em síntese, uma gestão patrimonial eficiente depende da capacidade de conectar informações jurídicas e territoriais sobre o mesmo imóvel.\u003c/p>"}},{"id":"b3g6olid","type":"figure","props":{"slot":"b3g6olid__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]},{"id":"bbru1j2e","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"b2xeny61","type":"referencias","props":{"title":"Referências","defaultOpen":false,"items":["\u003cp>FAGUNDES, Filipe Mendonça; COIMBRA JUNIOR, Carlos Alberto Sobral. \u003cb>Os dispositivos específicos aplicáveis ao desmembramento e à regularização dos imóveis da União\u003c/b>. \u003ci>Jus.com.br\u003c/i>, 28 set. 2017. Disponível em: https://jus.com.br/artigos/60867/os-dispositivos-especificos-aplicaveis-ao-desmembramento-e-a-regularizacao-dos-imoveis-da-uniao. Acesso em: 22 jul. 2026.\u003c/p>\u003cp>\u003c/p>"]}}]},{"id":"blc9ww2r","type":"pagefooter","props":{"code":"Evolução histórico-jurídica do sistema patrimonial imobiliário público e privado [M212]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Conteúdo","name":"Carlos Alberto Sobral Coimbra Junior"},{"role":"Revisão","name":"-"},{"role":"Design Educacional","name":"Luís Henrique Lindner"},{"role":"Versão","name":"Julho 2026"}]}},{"id":"bzk0isfz","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[]}]}</script>

  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];

      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });

    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];

<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('title') || el.getAttribute('data-definition') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('span').textContent = def;
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });

      var position = positionById[el.dataset.spuTermPortalId];

  window.addEventListener('scroll',repositionOpen,true);

})();</script>
