<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"[M434] - Geointeligência para a regularização fundiária","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"c0ivxkzz","text":"Um estudo de caso: \u003cspan style=\"font-weight: normal;\">a experiência da SPU\u003c/span>","hidden":false},{"id":"c8wmeyf8","text":"Antes de mapear, é preciso entender o que se pretende regularizar","hidden":false},{"id":"b_msuttiem_jrod","text":"Universo da regularização fundiária: \u003cspan style=\"font-weight: normal;\">conhecer para planejar\u003c/span>","hidden":false},{"id":"b_msutthr8_8m6i","text":"Do mapeamento à ação","hidden":false}]}},"blocks":[{"id":"b1slscox","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bxuqaft5","type":"hero","props":{"kicker":"Regularização da utilização de áreas públicas","kickerIcon":"land-plot","title":"Geointeligência para a regularização fundiária","byline":"relato da experiência da Secretaria do Patrimônio da União","slot":"bxuqaft5__slot"}},{"id":"b83mm97u","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"czdz5bsx","type":"prose","props":{"html":"\u003cp>A regularização fundiária é uma das formas pelas quais a gestão de imóveis públicos pode contribuir para a garantia de direitos e para uma utilização do patrimônio público comprometida com sua função socioambiental. Ela envolve situações muito diferentes entre si: desde famílias que ocupam imóveis urbanos até núcleos urbanos informais e territórios tradicionalmente ocupados.\u003c/p>\u003cp>Por isso, regularizar não significa apenas escolher um instrumento de destinação ou promover uma titulação. Antes de agir, é preciso conhecer as situações existentes, compreender onde elas estão e identificar suas características e as pessoas e comunidades envolvidas. Essas informações ajudam a dimensionar as demandas, reconhecer diferentes contextos e organizar a atuação do poder público.\u003c/p>\u003cp>É justamente esse o desafio abordado neste material.\u003c/p>"}}]},{"id":"bmelchod","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"c0ivxkzz","type":"titulo","props":{"text":"Um estudo de caso: \u003cspan style=\"font-weight: normal;\">a experiência da SPU\u003c/span>","level":"h2"}},{"id":"bosdix2i","type":"callout","props":{"variant":"ear","tone":"note","icon":"notebook-pen","title":"","heading":"","children":"\u003cp>Este conteúdo foi elaborado a partir do Relatório das ações de regularização fundiária em áreas da União (2023/2024 – apontamentos para 2025/2026), produzido pela Secretaria do Patrimônio da União (SPU). O relatório apresenta os primeiros esforços da Secretaria para reunir, qualificar, cruzar e espacializar informações sobre situações que demandam regularização fundiária em áreas sob sua gestão.\u003c/p>","color":""}},{"id":"czwdjdwc","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Como registra o próprio documento, \u003cmark>conhecer esse universo não é uma tarefa simples\u003c/mark>. É necessário reunir informações provenientes de diferentes fontes para saber, entre outros aspectos, onde estão as áreas, quantas famílias as ocupam, se existem situações de risco e se esses territórios já são atendidos por programas públicos de regularização fundiária.\u003c/span>\u003c/p>"}},{"id":"b43qup60","type":"pullquote","props":{"variant":"block","fontSize":"h5","children":"\u003ci>O que se pretende é deixar de trabalhar no ‘caso a caso’, ‘processo a processo’ e adotar uma abordagem baseada na compreensão do território, com seus contextos sociais e políticos.\u003c/i>","cite":"Relatório das ações de regularização fundiária em áreas da União \u003cbr>\u003cspan style=\"font-weight: normal;\">SPU (2025)\u003c/span>"}},{"id":"bgj6fapb","type":"prose","props":{"html":"\u003cp>A experiência relatada pela SPU será utilizada aqui como estudo de caso. O objetivo não é apresentar seus procedimentos como uma solução única para outros órgãos ou entes públicos, mas acompanhar como uma organização responsável pela gestão de um patrimônio amplo e diverso começou a estruturar informações territoriais para conhecer melhor suas demandas de regularização, definir prioridades, estabelecer metas, buscar parcerias e acompanhar as ações realizadas. \u003c/p>\u003cp>Ao longo do material, você conhecerá as diferentes situações identificadas pela SPU e acompanhará a construção desse mapeamento: de onde vieram os primeiros dados, como as demandas foram espacializadas, que informações passaram a ser cruzadas e como esse conhecimento pode apoiar o planejamento das ações de regularização fundiária.\u003c/p>\u003cp>A proposta é que essa experiência ajude a refletir sobre uma questão que interessa a quem atua com imóveis públicos em diferentes contextos: \u003cb>como transformar informações dispersas sobre imóveis, ocupações, pessoas e territórios em con\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">hecimento capaz de apoiar decisões de regularização fundiária?\u003c/span>\u003c/b>\u003c/p>\u003cp>\u003cfont color=\"#1c2420\">\u003cspan style=\"background-color: rgb(247, 237, 211);\">\u003cb>\u003c/b>\u003c/span>\u003c/font>\u003c/p>"}}]},{"id":"bn7vvchp","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"c8wmeyf8","type":"titulo","props":{"text":"Antes de mapear, é preciso entender o que se pretende regularizar","level":"h2"}},{"id":"cj41sj7u","type":"prose","props":{"html":"\u003cp>A regularização fundiária em imóveis públicos pode envolver situações bastante diferentes. No caso dos imóveis da União, essas diferenças estão relacionadas às características e à localização do imóvel, às formas de ocupação e ao público a ser beneficiado, que, em determinadas situações, está relacionado a políticas públicas conduzidas por outros órgãos. \u003c/p>\u003cp>Conhecer essas diferenças é importante para compreender a experiência apresentada neste material: antes de reunir e espacializar as informações, foi necessário reconhecer quais situações de regularização deveriam ser consideradas e como a SPU atua em cada uma delas.\u003c/p>"}},{"id":"b6c6d6e1","type":"titulo","props":{"text":"Formas de atuação","level":"h3"}},{"id":"bhar05qo","type":"prose","props":{"html":"\u003cp>A regularização fundiária de imóveis da União acontece de forma direta ou indireta.\u003c/p>"}},{"id":"bdjzwa8b","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"bufdl73q","type":"flashcard","props":{"term":"Forma direta","description":"Na forma direta, é a SPU/MGI quem promove a titulação das pessoas beneficiadas.","definition":"\u003cp>Um exemplo são destinações de imóveis urbanos incorporados ao patrimônio da União e com a situação cartorial resolvida, ou seja, imóveis individualizados e com matrícula. Nesse caso, é possível que a SPU/MGI efetue a transferência de domínio do imóvel diretamente para a família ocupante. \u003c/p>","icon":"file-check","showIcon":true,"useCoverImage":false,"coverSlot":"c_39yy48f__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--terra-600)"}},{"id":"b_msutw9ru_rlz3","type":"flashcard","props":{"term":" Forma indireta","description":"Na forma indireta, a SPU/MGI atua em parceria com outros agentes, órgãos ou instituições.","definition":"\u003cp>Nesse caso, a Secretaria entrega a área ocupada para um parceiro, que será responsável por promover as ações jurídicas, técnicas e administrativas necessárias à titulação das pessoas beneficiadas. Os títulos são entregues após a atuação do parceiro. \u003c/p>","icon":"file-sliders","showIcon":true,"useCoverImage":false,"coverSlot":"c_xvqlalt__imageSlot","coverAlt":"","frontCue":"Clique para virar","backCue":"Clique para voltar","color":"var(--petrol-600)"}}]},{"id":"bqztp77s","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Um exemplo são os núcleos urbanos irregulares. Nessas áreas, é necessário primeiro desenvolver projetos de regularização fundiária para a geração de matrículas individualizadas dos imóveis que permitirão a transferência de domínio para cada família ocupante do núcleo. \u003c/span>\u003c/p>\u003cp>A SPU/MGI também atua de forma indireta nos casos em que a população ocupante da área pública está relacionada a políticas de regularização fundiária conduzidas por outro órgão, como ocorre com territórios de comunidades quilombolas, terras e reservas indígenas e áreas em unidades de conservação, por exemplo.\u003c/p>\u003cp>As parcerias decorrem, em grande parte, das competências legais dos diferentes agentes envolvidos na política de regularização fundiária. Entre os principais parceiros mencionados no relatório estão municípios, estados, o Instituto Nacional de Colonização e Reforma Agrária  (Incra), Ministério do Meio Ambiente (MMA), o Instituto de Conservação e Biodiversidade Chico Mendes (ICMBio), Ministério dos Povos Indígenas e Fundação Nacional do Índio (FUNAI).\u003c/p>"}},{"id":"bfn7izeh","type":"callout","props":{"variant":"ear","tone":"info","icon":"lightbulb","title":"PARA ENTENDER O ESTUDO DE CASO","heading":"","children":"\u003cp>A distinção entre atuação direta e indireta será importante mais adiante. O mapeamento desenvolvido pela SPU não reúne apenas áreas que ainda precisam ser destinadas; inclui também áreas já transferidas a parceiros e que precisam ser acompanhadas até que a regularização produza os resultados esperados.\u003c/p>"}}]},{"id":"bssrwvmy","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"bjl4cwor","type":"titulo","props":{"text":"Que situações aparecem nesse universo?","level":"h3"}},{"id":"bqfiplu9","type":"prose","props":{"html":"\u003cp>Existem diferentes tipos de situações em áreas da União. Para fins deste estudo de caso, vale conhecê-las antes de observar como foram mapeadas.\u003c/p>"}},{"id":"b_mt21s3rc_0tmc","type":"examplecard","props":{"label":"Imóveis urbanos individualizados","icon":"house","color":"var(--terra-700)","slot":"b_mt21s3rc_0tmc__slot","collapse":"closed","title":"","body":""},"children":[{"id":"brrc3k3x","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg"},"children":[{"id":"bbh6pmr8","type":"prose","props":{"html":"\u003cp>Imóveis em áreas com infraestrutura e integrados à malha urbana, ocupados para fins residenciais ou mistos, com ou sem matrícula. Esses casos são tratados por meio da regularização fundiária direta, em que a própria SPU realiza a titulação utilizando o instrumento de destinação aplicável. Quando o imóvel ainda não está incorporado ou não possui matrícula, essa situação precisa ser resolvida previamente.\u003c/p>"}},{"id":"blke2ppj","type":"figure","props":{"slot":"blke2ppj__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"b_mt21w470_biv0","type":"examplecard","props":{"label":"Núcleos urbanos irregulares","icon":"grid-2x2-x","color":"var(--ink-500)","slot":"b_mt21w470_biv0__slot","collapse":"closed","title":"","body":""},"children":[{"id":"bjqe3wkc","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg"},"children":[{"id":"b225hsyz","type":"prose","props":{"html":"\u003cp>Áreas da União que reúnem ocupações urbanas consolidadas, nas quais uma única área abriga várias famílias em situação de insegurança jurídica e, muitas vezes, sem acesso a infraestrutura adequada e equipamentos públicos. A regularização exige o desenvolvimento do projeto de REURB e costuma envolver atuação em parceria.\u003c/p>"}},{"id":"b898486j","type":"figure","props":{"slot":"b898486j__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"b_mt21ytma_2jep","type":"examplecard","props":{"label":"Territórios tradicionais quilombolas","icon":"map-pin-house","color":"var(--ochre-800)","slot":"b_mt21ytma_2jep__slot","collapse":"closed","title":"","body":""},"children":[{"id":"b3ylrcky","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg"},"children":[{"id":"bvdp6ubd","type":"prose","props":{"html":"\u003cp>Áreas da União que incidem, total ou parcialmente, sobre territórios tradicionais de comunidades quilombolas. Nesses casos, há atuação conjunta da SPU e do INCRA: caracterizado o território pelo INCRA, seus dados espaciais são encaminhados à SPU para verificação de eventual sobreposição com áreas da União sob sua gestão.&nbsp;\u003c/p>"}},{"id":"b_mt21ytma_n0nm","type":"figure","props":{"slot":"b_mt21ytma_n0nm__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"b_mt222cb3_xy1n","type":"examplecard","props":{"label":"Territórios de povos indígenaS","icon":"tree-deciduous","color":"var(--green-600)","slot":"b_mt222cb3_xy1n__slot","collapse":"closed","title":"","body":""},"children":[{"id":"b98zn3wf","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg","__pullDown":true},"children":[{"id":"b0wfra8h","type":"prose","props":{"html":"\u003cp>Áreas identificadas e solicitadas pela FUNAI como necessárias aos Povos Indígenas. As terras indígenas – TI, após serem demarcadas são incorporadas em nome da União e matriculadas em usufruto dos povos indígenas. Nesse caso, o processo fica mais concentrado na incorporação do imóvel ao patrimônio da União.\u003cbr>\u003c/p>"}},{"id":"b_mt222cb3_tju9","type":"figure","props":{"slot":"b_mt222cb3_tju9__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]},{"id":"b_mt2azwse_0czz","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg","__pullDown":false},"children":[{"id":"bx5xmyvm","type":"callout","props":{"variant":"ear","tone":"info","icon":"alert-circle","title":"","heading":"","children":"\u003cp>A destinação de reservas indígenas é diferente. Nesses casos a FUNAI identifica a área e a SPU/MGI faz a destinação. A SPU também costuma ser acionada quando da necessidade de identificação de áreas para comunidades em risco com necessidade de reterritorialização.\u003c/p>"}},{"id":"b_mt2azwse_w0lh","type":"figure","props":{"slot":"b_mt2azwse_w0lh__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"b_mt225y4g_u31d","type":"examplecard","props":{"label":"Áreas da União com comunidades tradicionais em unidades de conservação","icon":"trees","color":"var(--green-700)","slot":"b_mt225y4g_u31d__slot","collapse":"closed","title":"","body":""},"children":[{"id":"bw7z19ch","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg"},"children":[{"id":"bt10jb5k","type":"prose","props":{"html":"\u003cp>São áreas da União sobrepostas a unidades de conservação nas quais há ocupação de comunidades tradicionais compatível com o uso. A gestão das unidades de conservação federais é uma atribuição do ICMBio, que identifica e caracteriza as áreas das unidades de conservação e com base nesses estudos o MMA solicita a área à SPU.&nbsp;\u003c/p>"}},{"id":"b_mt225y4g_v6pr","type":"figure","props":{"slot":"b_mt225y4g_v6pr__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"b_mt228b76_yblw","type":"examplecard","props":{"label":"Territórios de outras comunidades tradicionais","icon":"house-plus","color":"var(--slate-700)","slot":"b_mt228b76_yblw__slot","collapse":"closed","title":"","body":""},"children":[{"id":"buro1gbx","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg"},"children":[{"id":"b4g730zf","type":"prose","props":{"html":"\u003cp>Áreas da União que incidem sobre territórios tradicionais de comunidades não tuteladas por outros órgãos. Esses territórios são locais de moradia, sustento e reprodução social e cultural de populações que se autorreconhecem como pertencentes a algum povo ou comunidade tradicional. Como não estão sob a tutela de nenhum outro órgão acabam tendo sua pauta de regularização tratada unicamente pela SPU/MGI.\u003c/p>"}},{"id":"b_mt228b76_j23q","type":"figure","props":{"slot":"b_mt228b76_j23q__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"b_mt229sdn_lhfh","type":"examplecard","props":{"label":"Áreas para a Política Nacional de Reforma Agrária","icon":"tractor","color":"var(--petrol-600)","slot":"b_mt229sdn_lhfh__slot","collapse":"closed","title":"","body":""},"children":[{"id":"bjwdt7gf","type":"columns","props":{"count":2,"ratio":"first-wide","gap":"lg"},"children":[{"id":"bzveo1rf","type":"prose","props":{"html":"\u003cp>Áreas rurais da União, ocupadas ou não, consideradas adequadas para apoiar a produção rural e que interessam ao INCRA para a promoção da Política Nacional de Reforma Agrária. Em alguns casos, já existem assentamentos para serem regularizados, em outros as áreas estão vazias e são aproveitadas para projetos de novos assentamentos rurais.\u003c/p>"}},{"id":"b_mt229sdn_u9we","type":"figure","props":{"slot":"b_mt229sdn_u9we__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]}]},{"id":"b2k9liei","type":"prose","props":{"html":"\u003cp>Essas situações mostram a diversidade do universo que a SPU precisa conhecer e acompanhar. Mas identificá-las em processos administrativos ou no conhecimento acumulado pelas equipes não significa ainda possuir uma visão organizada de sua distribuição territorial.\u003c/p>\u003cp>É justamente essa passagem que constitui o núcleo do estudo de caso apresentado a seguir: \u003cb>como reunir informações dispersas, espacializá-las e começar a construir uma visão territorial das demandas de regularização fundiária?\u003c/b>\u003c/p>"}}]},{"id":"b_msuttiem_jjjz","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"b_msuttiem_jrod","type":"titulo","props":{"text":"Universo da regularização fundiária: \u003cspan style=\"font-weight: normal;\">conhecer para planejar\u003c/span>","level":"h2"}},{"id":"b_msuttiem_5ju2","type":"prose","props":{"html":"\u003cp>Conhecidas as diferentes situações que podem demandar regularização, surge uma questão essencial para o planejamento:\u003cmark data-hl=\"petrol\"> qual é, afinal, o universo sobre o qual é preciso atuar?\u003c/mark>\u003c/p>\u003cp>No caso da SPU, responder a essa pergunta exigiu reunir informações que se encontravam dispersas em diferentes fontes e situações. O desafio não era apenas saber quantas demandas existiam, mas onde estavam, quais eram suas características, quem estava envolvido e em que estágio se encontravam. É a partir dessa necessidade que começa a experiência de mapeamento apresentada neste estudo de caso.\u003c/p>\u003cp>Esse é um trabalho de longo prazo, um processo vivo e constante, não apenas pelo volume de áreas envolvido, mas também pela natureza dinâmica dos imóveis sob gestão da SPU. Novas áreas podem ingressar nesse universo com o avanço dos processos de caracterização ou com o ingresso de novos imóveis na carteira gerencial da Secretaria, como ocorreu, por exemplo, com imóveis do Instituto Nacional do Seguro Social (INSS).\u003c/p>"}},{"id":"bbuxmg3o","type":"callout","props":{"variant":"header","tone":"attention","icon":"bookmark","title":"","heading":"","children":"\u003cp>Conhecer o universo da regularização não significa produzir um retrato definitivo. Na experiência da SPU, o mapeamento é tratado como um processo contínuo, que precisa ser atualizado à medida que novas informações e áreas são incorporadas.\u003c/p>"}},{"id":"bgfyyp6s","type":"titulo","props":{"text":"Por onde começar quando as informações estão dispersas?","level":"h3"}},{"id":"bekyxtog","type":"prose","props":{"html":"\u003cp>Em 2024, a recém-criada Coordenação-Geral de Regularização Fundiária (CGREG), da Diretoria de Destinação de Imóveis, iniciou um esforço para recolher e sistematizar informações que pudessem apoiar o mapeamento da irregularidade.\u003c/p>"}},{"id":"bgdrtfbn","type":"panel","props":{"variant":"box","kicker":"Os dados iniciais foram obtidos de três formas:","kickerIcon":"list","title":"","color":"","bg":"var(--sand-50)","body":""},"children":[{"id":"bl7fbj6q","type":"feature","props":{"columns":3,"card":false,"accent":"","layout":"top","items":[{"icon":"file-search-corner","title":"Consulta às unidades nos estados","text":"A SPU realizou agendas virtuais com as 27 Superintendências do Patrimônio da União e utilizou uma planilha colaborativa para reunir as informações disponíveis."},{"icon":"file-text","title":"Processos de destinação","text":"Foram sistematizadas informações dos processos de destinação que passaram pela Unidade Central em 2024."},{"icon":"file-input","title":"Áreas complexas já conhecidas","text":"Também foram incluídas áreas cuja situação já era de conhecimento da instituição. "}]}},{"id":"b9xkgbv1","type":"kicker","props":{"icon":"merge","children":"Esses dados foram estão reunidos e sistematizados"}}]},{"id":"bo9lyr8p","type":"titulo","props":{"text":"O primeiro retrato do território","level":"h3"}},{"id":"baivyfn0","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"bx1d9jw2","type":"prose","props":{"html":"\u003cp>Como resultado do levantamento inicial, foram identificadas 237 áreas onde ações de regularização fundiária eram necessárias. O próprio relatório ressalta que se tratava de um universo provisório, que seria ampliado com o avanço do mapeamento.\u003c/p>\u003cp>Essas áreas estavam distribuídas por todas as unidades da Federação, alcançando 141 municípios e 20 capitais.\u003c/p>"}},{"id":"b4663x0n","type":"figure","props":{"slot":"b4663x0n__slot","src":"","fit":"contain","size":"full","title":"MAPA PENDENTE","caption":"","credit":""}}]},{"id":"b8tvahgs","type":"datatable","props":{"caption":"Quanto ao tipo, o levantamento identificou:","columns":[{"key":"c0","label":"Situação mapeada"},{"key":"c1","label":"Áreas identificadas"}],"rows":[{"c0":"Núcleos urbanos para REURB","c1":"373"},{"c0":"Territórios de Povos e Comunidades Tradicionais","c1":"61"},{"c0":"Áreas para fomentar a Política Nacional de Reforma Agrária (PNRA)","c1":"31"},{"c0":"Total","c1":"465"}],"dense":true,"highlightFirst":false,"striped":false,"tone":"petrol","className":"spu-table-wrap--tone-petrol"}},{"id":"bxekp4rs","type":"prose","props":{"html":"\u003cp>As áreas passaram a ser inseridas em um mapa temático da regularização fundiária no Geoportal.\u003c/p>\u003cp>A espacialização concentrou-se nas áreas maiores, onde se encontra o maior número de pessoas beneficiárias. Por essa razão, a tipologia “imóvel urbano individualizado” não integrou esse mapeamento, por representar uma quantidade pequena de beneficiários. \u003c/p>\u003cp>No caso das comunidades tradicionais, entretanto, foram representadas no mapa tanto as titulações coletivas quanto as individuais realizadas por meio de Termos de Autorização de Uso Sustentável (TAUS). O relatório justifica essa escolha pela importância da regularização fundiária dessas comunidades e pela natureza precária do instrumento. Como exemplo, uma única área ocupada por comunidade tradicional em Corumbá (MS) correspondeu a 64 TAUS individuais entregues.\u003c/p>"}},{"id":"b2bo195f","type":"panel","props":{"variant":"box","kicker":"Mapear não é apenas identificar o que ainda precisa ser feito\u003cbr>","kickerIcon":"files","title":"","color":"","bg":"var(--cloud-100)","body":""},"children":[{"id":"bbrhx4uu","type":"prose","props":{"html":"\u003cp>Um aspecto importante da experiência é que o mapeamento não se limitou às áreas que permaneciam sob gestão exclusiva da SPU e ainda precisavam ser regularizadas.\u003c/p>\u003cp>\u003cspan data-fs=\"eyebrow\">Foram reunidos três grupos de informações:\u003c/span>\u003c/p>"}},{"id":"b79czuv7","type":"feature","props":{"columns":1,"card":false,"accent":"var(--terra-600)","layout":"side","items":[{"icon":"map-pinned","title":"Áreas para regularização ","text":"Ainda sob gestão exclusiva da SPU, em suas diferentes tipologias."},{"icon":"map-pin-check","title":"Áreas transferidas para parceiros  ","text":"Parceiros por meio da destinação indireta e que demandavam acompanhamento, considerando as destinações realizadas em 2023 e 2024."},{"icon":"map-pin-house","title":"Áreas de comunidades tradicionais","text":"Já tituladas diretamente pela SPU, por meio de TAUS individuais ou coletivos, em 2023 e 2024."}]}},{"id":"bcn4ny40","type":"prose","props":{"html":"\u003cp>Essa organização permite que o mapa reúna situações em diferentes estágios da regularização fundiária, e não apenas demandas ainda não atendidas.\u003c/p>"}}]}]},{"id":"bfzda9n7","type":"section","props":{"width":"wide","surface":"dark","pad":"lg"},"children":[{"id":"by9o08vp","type":"titulo","props":{"text":"O que as informações reunidas começaram a revelar?","level":"h3"}},{"id":"b_msuvg1uv_znci","type":"prose","props":{"html":"\u003cp>O levantamento permitiu observar não apenas quantas áreas haviam sido identificadas, mas também seu estágio de destinação e de espacialização.\u003c/p>"}},{"id":"bdfxfoi6","type":"columns","props":{"count":"2","ratio":"equal","gap":"md"},"children":[{"id":"bk43j9sp","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b_mt2c3nqa_589o","type":"prose","props":{"html":"\u003cp>\u003cspan data-fs=\"h5\">Núcleos urbanos — REURB\u003c/span>\u003c/p>","__pullDown":true}},{"id":"batslkwl","type":"statblock","props":{"variant":"rule","columns":3,"stats":[{"value":"373","unit":"identificados","label":"\u003cspan data-color=\"ochre-light\">87\u003c/span> transferidos a parceiros\u003cbr>\u003cspan data-color=\"ochre-light\">118\u003c/span> em processo de destinação\u003cbr>\u003cspan data-color=\"ochre-light\">114\u003c/span> já georreferenciados\u003cbr>","description":""}]}}]},{"id":"b_mt2c5uvf_cxqy","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b_mt2c5uvf_abvk","type":"prose","props":{"html":"\u003cp>\u003cfont face=\"Red Hat Display, Archivo, system-ui, sans-serif\">\u003cspan style=\"font-size: 20.8px; letter-spacing: -0.2496px;\">\u003cb>Povos e Comunidades Tradicionais\u003c/b>\u003c/span>\u003c/font>\u003c/p>","__pullDown":true}},{"id":"b_mt2c5uvf_exus","type":"statblock","props":{"variant":"rule","columns":3,"stats":[{"value":"61","unit":"identificados","label":"\u003cfont color=\"#ebc988\">18 \u003c/font>\u003cfont color=\"#ebc988\">\u003cspan data-color=\"light\">destinadas em 2023–2024\u003c/span>\u003cbr>\u003c/font>\u003cspan data-color=\"ochre-light\">49\u003c/span> já georreferenciadas\u003cbr>","description":""}]}}]},{"id":"b_mt2c5u47_gawg","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b_mt2c5u47_8ovy","type":"prose","props":{"html":"\u003cp>\u003cfont face=\"Red Hat Display, Archivo, system-ui, sans-serif\">\u003cspan style=\"font-size: 20.8px; letter-spacing: -0.2496px;\">\u003cb>Áreas para fomentar a PNRA\u003c/b>\u003c/span>\u003c/font>\u003c/p>","__pullDown":true}},{"id":"b_mt2c5u47_bl1k","type":"statblock","props":{"variant":"rule","columns":3,"stats":[{"value":"10","unit":"transferidas ao INCRA","label":"\u003cspan data-color=\"ochre-light\">300\u003c/span> famílias beneficiadas\u003cbr>\u003cspan data-color=\"ochre-light\">30\u003c/span> áreas já georreferenciadas\u003cbr>\u003cspan data-color=\"ochre-light\">1\u003c/span> em processo de elaboração para a entrada no GeoPortal\u003cbr>","description":""}]}}]}]}]},{"id":"bwnn1gga","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"ba5prxrf","type":"titulo","props":{"text":"Do levantamento de informações à visão do território","level":"h3"}},{"id":"b6ookzy9","type":"prose","props":{"html":"\u003cp>O trabalho iniciado pela SPU busca construir progressivamente um ambiente georreferenciado com dados e informações relacionados à regularização fundiária.\u003c/p>\u003cp>No relatório, essa iniciativa é apresentada como uma mudança de visão:\u003c/p>"}},{"id":"bql56452","type":"pullquote","props":{"variant":"block","fontSize":"h5","children":"\u003ci>O que se pretende é deixar de trabalhar no ‘caso a caso’, ‘processo a processo’ e adotar uma abordagem baseada na compreensão do território, com seus contextos sociais e políticos.\u003c/i>","cite":"Relatório das ações de regularização fundiária em áreas da União\u003cbr>\u003cspan style=\"font-weight: normal;\">SPU (2025)\u003c/span>\u003cbr>"}},{"id":"blc6zbem","type":"prose","props":{"html":"\u003cp>A expectativa registrada é que essa abordagem permita qualificar o planejamento e a definição de metas, buscar apoio local e parcerias institucionais e atuar transversalmente, inclusive articulando outras destinações voltadas à qualificação de territórios vulneráveis.\u003c/p>"}},{"id":"bdu5ddel","type":"callout","props":{"variant":"header","tone":"info","icon":"book-open-check","title":"","heading":"O que esta etapa do estudo de caso mostra?","children":"\u003cp>Na experiência da SPU, a construção de uma visão territorial começou pela coleta de informações existentes, passou por sua sistematização e espacialização e produziu um primeiro retrato das áreas, de suas diferentes situações e do estágio das ações de regularização.\u003c/p>\u003cp>Os números demonstram o impacto e a importância dessa pauta, assim como o papel de protagonismo da SPU nesse tema e evidenciam a necessidade de que as áreas da União sejam priorizadas nas seleções de recursos federais e no acesso transversal a outras políticas públicas que podem qualificar os territórios de intervenção como saúde, educação, cultura, lazer, esportes etc.\u003c/p>"}}]},{"id":"b_msutthr8_qxwf","type":"section","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"b_msutthr8_8m6i","type":"titulo","props":{"text":"Do mapeamento à ação","level":"h2"}},{"id":"b_msutthr8_jbk6","type":"prose","props":{"html":"\u003cp>Conhecer o universo da regularização fundiária e localizar territorialmente as demandas é uma primeira etapa. Na experiência da SPU, essas informações também passaram a apoiar o planejamento e o acompanhamento das ações realizadas.\u003c/p>\u003cp>O relatório mostra que esse acompanhamento ocorre em situações distintas. Há áreas que permanecem sob gestão da SPU e ainda precisam avançar no processo de regularização; outras já destinadas a parceiros, nas quais é necessário acompanhar o desenvolvimento das ações até a titulação das famílias; e ainda, áreas em que a própria SPU realiza diretamente a titulação.\u003c/p>"}},{"id":"blith3zx","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b4mp4693","type":"prose","props":{"html":"\u003cp>O mapeamento não serve apenas para localizar e conhecer as áreas públicas. Na experiência da SPU, a consolidação de um conjunto de áreas previamente identificadas e mapeadas também ampliou a capacidade de articulação institucional e de mobilização de recursos. A partir dessas informações, a Secretaria articulou com o Ministério das Cidades a destinação de recursos do Novo PAC exclusivamente para ações de regularização fundiária em áreas da União. A iniciativa foi formalizada pela \u003ca href=\"https://www.in.gov.br/web/dou/-/portaria-interministerial-mcid/mgi-n-5-de-3-de-novembro-de-2025-671920924\">Portaria Interministerial MCID/MGI nº 5, de 3 de novembro de 2025\u003c/a>, e resultou na seleção de R$ 200 milhões da Ação Orçamentária 00SW — Apoio à Regularização Fundiária Urbana, do Programa Periferia Viva, com potencial de beneficiar cerca de 140 mil famílias. Esse exemplo mostra que\u003cmark> a informação territorial organizada pode ultrapassar a função cadastral e se converter em instrumento de planejamento, priorização e articulação de políticas públicas\u003c/mark>.&nbsp;\u003c/p>"}},{"id":"bhpi2apx","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg"},"children":[{"id":"b4bt52ic","type":"prose","props":{"html":"\u003cp>Na experiência da SPU, as informações reunidas são utilizadas de três formas:\u003c/p>","__pullDown":true}},{"id":"bpjweglb","type":"markerlist","props":{"variant":"ordered","icon":"check","accent":"var(--ochre-600)","items":[{"title":"Áreas ainda sob gestão: planejar e priorizar a regularização","text":"Usar o mapeamento para organizar as demandas, definir prioridades e pactuar metas de atuação. "},{"title":"Áreas já destinadas a parceiros: acompanhar até a titulação","text":"Acompanhar o avanço da regularização, apoiar a articulação com os parceiros e monitorar a evolução das ações até a titulação das famílias. "},{"title":"Um universo em permanente atualização: ampliar e qualificar o mapeamento","text":"Incorporar novas demandas, concluir a espacialização das áreas e cruzar diferentes bases para conhecer melhor os territórios e as famílias envolvidas."}]}}]}]}]},{"id":"bhb3p4ba","type":"conclusion","props":{"kicker":"Para refletir","kickerIcon":"check","title":"","body":"\u003cp>\u003cul>\u003cli>Na realidade em que você atua, quais informações estão disponíveis para conhecer territorialmente as demandas de regularização fundiária, e quais ainda fazem falta? \u003c/li>\u003cli>Essas informações permitem apenas conhecer casos individualmente ou também comparar situações e estabelecer prioridades de atuação? \u003c/li>\u003cli>Depois de realizada uma destinação ou iniciada uma ação de regularização, que informações seriam importantes para acompanhar se ela está avançando e produzindo os resultados esperados?\u003c/li>\u003c/ul>\u003c/p>"},"children":[{"id":"b611y95g","type":"callout","props":{"variant":"ear","tone":"info","icon":"link","title":"","heading":"","children":"\u003cp>Para mais informações, consulte a íntegra do \u003cb>\u003cspan data-color=\"terra\">Relatório\u003c/span>\u003c/b>.\u003c/p>"}}]},{"id":"bi5x9g89","type":"pagefooter","props":{"code":"Geointeligência para a regularização fundiária [M434]","context":"Este material foi desenvolvido com fins educacion <script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');
    var allowed = ['STRONG','B','EM','I','BR','P','SPAN'];
    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
