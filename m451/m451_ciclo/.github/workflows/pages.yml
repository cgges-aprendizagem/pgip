name: Publicar infográfico no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Preparar página estática
        run: |
          mkdir _site
          cp public/infografico.html _site/index.html
          cp public/og.png _site/og.png
          cp -R public/icons _site/icons
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar página
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
