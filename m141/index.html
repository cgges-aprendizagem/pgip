<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M141 - Marcos balizadores da Gestão Territorial (video)","lang":"pt-BR","builderCredit":true,"toc":{"items":[]}},"blocks":[{"id":"bb6uvooc","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"b56f5n7i","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"bu2vs8sg","type":"mediaembed","props":{"type":"video","title":"Marcos conceituais e legais do ordenamento e da gestão territorial no Brasil","provider":"","url":"https://eduplay.rnp.br/app/video/466488"}}]},{"id":"bg9jx39v","type":"collapsiblesection","props":{"triggerLabel":"Mostrar/ocultar a transcrição","defaultOpen":true,"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"b_msuw92o1_3h74","type":"prose","props":{"html":"\u003cp>Confira abaixo a transcrição completa do vídeo.\u003c/p>"}},{"id":"cej90aqy","type":"collapsebreak","props":{}},{"id":"b4mpxoeg","type":"prose","props":{"html":"\u003cp>Boas-vindas!&nbsp;\u003c/p>\u003cp>Neste vídeo a gente vai desvendar de um jeito bem direto os marcos conceituais e legais do ordenamento e da gestão territorial no Brasil. Se você atua, aí, na gestão de imóveis públicos, sabe que lidar com o território é uma tarefa diária, né? Mas, às vezes, as bases que orientam tudo isso podem parecer um pouco distantes ou muito teóricas. Então, o nosso objetivo aqui é traduzir esses grandes conceitos, mostrando como aquelas decisões macro afetam de verdade a realidade de quem gere os bens públicos do nosso país.\u003c/p>\u003cp>Vamos lá. Pra começar, eu tenho uma pergunta bem prática pra você: \u003cb>“O que que uma escola pública, uma rodovia federal, uma praia e uma terra indígena têm em comum?”\u003c/b>&nbsp;\u003c/p>\u003cp>À primeira vista, são espaços completamente diferentes, certo? Mas, na verdade, todos eles são manifestações físicas da atuação do Estado. Eles são resultado direto de decisões políticas, econômicas e sociais. E entender essa dinâmica é fundamental pra você, que trabalha gerindo o nosso patrimônio público.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Parte um: O Estado no território.\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>Vamos dar uma olhada nos marcos conceituais. Sabe aquela ideia tradicional que a gente tem de Geografia focada em mapas e fronteiras, bem definidas e paradinhas? Pode esquecer. \u003cmark>O território é, literalmente, o espaço da prática\u003c/mark>. É a face vivida e materializada do poder. Isso quer dizer que organizar um espaço nunca é só um detalhe técnico, sabe? É algo profundamente político. Cada pedacinho de terra que é apropriado, regulado ou protegido reflete uma intenção clara e uma estratégia de Estado.\u003c/p>\u003cp>E, claro, o Estado não joga sozinho nessa. A dinâmica de um território é moldada por três grandes agentes: o \u003cb>Estado\u003c/b>, a \u003cb>sociedade civil\u003c/b> e os \u003cb>agentes privados\u003c/b>. O Estado é, sim, o ator principal, mas ele está o tempo todo interagindo com os interesses dos outros dois agentes. Entender como essas três forças batem de frente ou, às vezes, se ajudam, é o primeiro passo para criar qualquer política pública que realmente funcione. E é exatamente aí que entra a gestão territorial.\u003c/p>\u003cp>Colocando em termos práticos, é o exercício diário das relações de poder para garantir que ações diferentes façam sentido quando colocadas juntas. No nível nacional, significa escolher e regular atividades. Já lá na ponta, nos níveis regional e local, é aplicar essas estratégias conversando com a população e usando o saber local. É fazer com que o desenvolvimento sustentável deixe de ser só uma palavra bonita e vire uma realidade implementada no dia a dia.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Parte 2: ordenamento territorial\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>Se a gestão territorial é o exercício das relações no espaço, o ordenamento é a grande regra do jogo. É ele que regula tudo que impacta o espaço: onde as pessoas vão morar, onde as fábricas vão ficar, quais áreas precisam ser preservadas e quais serão demarcadas, como terras indígenas. Pra fazer tudo isso funcionar exige-se uma visão macro, muita articulação entre as instituições e, com certeza, muita negociação.&nbsp;\u003c/p>\u003cp>Mas e aí, Como isso tudo virou lei aqui pra gente?\u003c/p>\u003cp>Bom, a nossa Constituição de 1988 disse que era tarefa da União elaborar planos de ordenação do território. Só que isso ficou meio adormecido por um bom tempo. Foi só lá em 2003, que o Ministério da Integração Nacional assumiu essa coordenação. E isso culminou, em 2006, na formulação do documento Base para a Política Nacional de Ordenamento Territorial, a PNOT.&nbsp;\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Parte 3: O papel da União&nbsp;\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>Quais são as competências e, claro, os limites?\u003c/p>\u003cp>\u003c/p>\u003cp>\u003c/p>\u003cp>A nossa Constituição deu uma missão, digamos, estruturante para União. \u003cmark>É competência exclusiva desta desenhar os grandes planos de ordenação do território.\u003c/mark> Mas a lista continua. A União também cria as diretrizes macro para o desenvolvimento urbano, incluindo habitação e saneamento básico. É ela que gerencia os recursos hídricos do país e que controla a exploração de minerais e do potencial energético. Percebe o tamanho disso? É uma responsabilidade monumental sobre a infraestrutura e o futuro da nação.&nbsp;\u003c/p>\u003cp>Aí você pode se perguntar:\u003cmark data-hl=\"terra\"> tá... e onde ficam as cidades nisso tudo?&nbsp;\u003c/mark>\u003c/p>\u003cp>Os municípios promovem, sim, o ordenamento urbano local. Mas a cidade não é uma ilha isolada. A lei municipal tem obrigatoriamente que respeitar as regras e diretrizes que vêm da União e dos Estados. É como um grande quebra-cabeça, onde a peça local tem que se encaixar na visão regional e nacional.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003c/p>\u003cspan data-fs=\"h3\">\u003cp>Parte 4: O impacto no patrimônio público\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>Como isso se aplica na prática? Por que essa teoria toda importa para você no seu dia a dia?&nbsp;\u003c/p>\u003cp>Pensa na lógica de como o Estado atua. Quando um terreno da União vira um projeto de moradia popular ou quando uma área costeira é transformada em reserva ambiental, o Estado está fazendo três coisas fundamentais: primeiro, organizando a ocupação física; segundo, resolvendo demandas socioambientais super urgentes; e terceiro, promovendo o desenvolvimento e o bem-estar da população.\u003c/p>"}},{"id":"bje5jmka","type":"callout","props":{"variant":"ear","tone":"warning","icon":"lightbulb","title":"","heading":"","children":"\u003cp>Gerir imóveis públicos não é bater carimbo. É estar na linha de frente, onde as grandes políticas viram benefícios reais para as pessoas. O Estado produz o seu próprio espaço justamente para garantir a segurança e desenvolvimento de todo mundo. Então, trabalhar com patrimônio público é, na sua essência, um exercício direto e supercrítico de governança. É literalmente manipular o espaço para alcançar aqueles grandes objetivos do nosso país, que estão lá na Constituição.&nbsp;\u003c/p>","color":""}},{"id":"b4tz7vr8","type":"prose","props":{"html":"\u003cp>Para encerrar, eu quero deixar uma provocação para você. S\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">abendo que cada decisão sobre um imóvel público é, no fundo, um ato de poder e de estratégia:\u003c/span>\u003c/p>"}},{"id":"brkbao3k","type":"pullquote","props":{"variant":"block","fontSize":"auto","children":"\u003ci>Como a sua gestão diária desse patrimônio pode moldar, ativamente, o desenvolvimento sustentável e o futuro do nosso país?&nbsp;\u003c/i>","cite":""}},{"id":"brjzxmr3","type":"prose","props":{"html":"\u003cp>Fica aí o convite para você refletir sobre a imensa responsabilidade e o impacto social do seu trabalho.&nbsp;\u003c/p>"}}]},{"id":"bxq5rodj","type":"pagefooter","props":{"code":"Marcos conceituais e legais da gestão territorial [M141]","context":"Este material foi desenvolvido com fins educacionais para o Programa de Desenvolvimento Profissional em Gestão de Imóveis Públicos, da Secretaria de Patrimônio da União – SPU.","license":true,"licenseKind":"byncsa","credits":[{"role":"Conteúdo","name":"Claudson Moreira"},{"role":"Revisão","name":"Ana Tulia de Macedo"},{"role":"Design e Edição do vídeo","name":"Luís Henrique Lindner"},{"role":"Versão","name":"Julho de 2026"}]}}]}</script>

<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  function walkBlocks(blocks, visit) {
    (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');
    var allowed = ['STRONG','B','EM','I','BR','P','SPAN'];
    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
