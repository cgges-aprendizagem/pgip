<script id="spu-doc" type="application/json">{"schema":1,"meta":{"title":"M211_Reconhecendo Imoveis Publicos_historico_conceitos_funcoes","lang":"pt-BR","builderCredit":true,"toc":{"items":[{"id":"cxu8bb8m","text":"O patrimônio imobiliário público como uma construção histórica","hidden":false},{"id":"cm7tg8li","text":"Conceitos fundamentais para o reconhecimento de imóveis públicos","hidden":false},{"id":"cy0e8bno","text":"O reconhecimento patrimonial como fundamento da gestão dos bens públicos","hidden":false}]}},"blocks":[{"id":"bx6duxck","type":"masthead","props":{"org":"SPU","program":"Programa Gestão de Imóveis Públicos"}},{"id":"bhxnk109","type":"hero","props":{"kicker":"reconhecimento e manutenção do cadastro de imóveis públicos","kickerIcon":"stamp","title":"Reconhecendo imóveis públicos ","byline":"conceitos, história e funções do patrimônio imobiliário","slot":"bhxnk109__slot"}},{"id":"ba1dbown","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cbmcca4b","type":"prose","props":{"html":"\u003cp>Quando afirmamos que determinado imóvel pertence ao patrimônio público, é comum imaginarmos que essa conclusão decorre apenas do texto da lei, do registro imobiliário ou das informações constantes do cadastro governamental. Entretanto, essas referências representam apenas parte das informações necessárias para que o Estado reconheça determinado bem como integrante do seu patrimônio.\u003c/p>\u003cp>\u003cmark data-hl=\"terra\">Antes de ser caracterizado, incorporado ou destinado pelo Estado, um imóvel precisa ser reconhecido como uma unidade patrimonial individualizada.\u003c/mark> Esse reconhecimento pressupõe a produção e a integração de informações históricas, jurídicas, territoriais e administrativas que permitam compreender sua origem, sua natureza patrimonial e as características que o distinguem dos demais bens públicos e privados.\u003c/p>"}},{"id":"bm1veb93","type":"markerlist","props":{"variant":"icon","icon":"lightbulb","accent":"","items":[{"title":"\u003cspan style=\"font-weight: normal;\">Essa necessidade decorre do próprio papel desempenhado pelo patrimônio imobiliário público na realização do interesse coletivo. Seja para apoiar políticas públicas, ordenar o território, proteger recursos naturais ou viabilizar a prestação de serviços essenciais, a utilização eficiente dos imóveis públicos depende da existência de informações confiáveis que permitam ao Estado conhecê-los adequadamente.\u003c/span>","text":""}]}},{"id":"b_mt0ugpy4_hfyf","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Em outras palavras, \u003cmark>um bem público não nasce plenamente conhecido pela Administração\u003c/mark>.  O conhecimento patrimonial resulta de um processo contínuo de identificação, organização e interpretação de informações.\u003c/span>\u003c/p>\u003cp>Sob essa ótica, reconhecer um imóvel público não significa apenas localizá-lo fisicamente ou identificá-lo em registros e cadastros. Significa compreender o conjunto de informações que explicam por que determinado bem integra o patrimônio público e quais características jurídicas, históricas e territoriais orientam a sua gestão.\u003c/p>\u003cp>É justamente esse processo de produção do conhecimento patrimonial que trataremos aqui. Você estudará&nbsp;a formação histórica do patrimônio imobiliário público brasileiro,&nbsp;os principais conceitos relacionados à caracterização patrimonial e&nbsp;como as informações produzidas ao longo desse processo subsidiam a incorporação, a gestão e a utilização dos imóveis públicos.\u003c/p>"}}]},{"id":"bdaito77","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"cxu8bb8m","type":"titulo","props":{"text":"O patrimônio imobiliário público como uma construção histórica","level":"h2"}},{"id":"cfqh64kh","type":"prose","props":{"html":"\u003cp>Reconhecer um imóvel público exige compreender informações que ultrapassam sua dimensão física, cadastral ou registral.&nbsp;\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Não raramente, compreender determinado imóvel público exige que o gestor retorne alguns séculos no tempo para identificar a origem do domínio sobre determinada área, compreender as categorias jurídicas empregadas pelo ordenamento para diferenciá-la do patrimônio privado e interpretar informações produzidas em diferentes momentos históricos.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Muitas das categorias jurídicas utilizadas atualmente para caracterizar os imóveis públicos foram construídas ao longo da formação do território nacional e continuam produzindo efeitos sobre sua gestão.&nbsp;\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Por isso, a história do patrimônio público brasileiro continua produzindo efeitos concretos sobre a forma como seus imóveis são reconhecidos pelo Estado no presente.&nbsp;\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">Confira um pouco dessa história navegando pelas telas abaixo:\u003c/span>\u003c/p>"}}]},{"id":"bcjjrej7","type":"sectionslider","props":{"loop":true},"children":[{"id":"cctpf9hi","type":"sectionslide","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"bvt1fnh9","type":"kicker","props":{"icon":"gallery-horizontal-end","children":"Período colonial"}},{"id":"coxvzedo","type":"titulo","props":{"text":"Regime de Sesmarias","level":"h3"}},{"id":"bp44o2ll","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg","__pullDown":true},"children":[{"id":"cgidykq8","type":"prose","props":{"html":"\u003cp>O processo de formação do patrimônio imobiliário público antecede a própria constituição do Estado nacional. Ainda no período colonial, o regime das sesmarias foi utilizado pela Coroa Portuguesa como instrumento de ocupação, exploração econômica e controle territorial das terras brasileiras, permitindo a concessão de extensas áreas aos particulares, condicionada ao cumprimento de determinadas obrigações relacionadas à sua utilização.\u003c/p>"}},{"id":"b7m6oa7k","type":"figure","props":{"slot":"b7m6oa7k__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}}]},{"id":"blqm2j1e","type":"statblock","props":{"variant":"rule","columns":3,"stats":[{"value":"","unit":"","label":"Efeitos na gestão contemporânea","description":"\u003cp>\u003cspan data-fs=\"body\">Embora extinto no século XIX, o conhecimento desse instituto permanece particularmente relevante para a gestão patrimonial contemporânea. Diversos conflitos relacionados à titularidade dos imóveis públicos continuam exigindo a compreensão da origem histórica do domínio sobre determinadas áreas e dos mecanismos empregados pelo Estado para diferenciar aquilo que foi legitimamente transferido aos particulares daquilo que permanece integrando o patrimônio público.\u003c/p>\u003cp>\u003c/p>\u003c/span>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>"}]}}]},{"id":"czarp1tu","type":"sectionslide","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"bevqqt3x","type":"kicker","props":{"icon":"gallery-horizontal-end","children":"1850"}},{"id":"cqxjyj0o","type":"titulo","props":{"text":"Lei de terras","level":"h3"}},{"id":"bpdel1x2","type":"columns","props":{"count":2,"ratio":"equal","gap":"lg","__pullDown":true},"children":[{"id":"cm0u118d","type":"prose","props":{"html":"\u003cp>Outro marco fundamental foi a promulgação da \u003cb>Lei nº 601, de 1850 (Lei de Terras)\u003c/b>, que reorganizou o regime jurídico das terras públicas e privadas no Brasil. Além de extinguir definitivamente o sistema de sesmarias, a lei estabeleceu novos parâmetros relacionados à aquisição e diferenciação das terras públicas e particulares, inaugurando importantes categorias jurídicas que continuam repercutindo sobre os processos contemporâneos de gestão patrimonial.\u003c/p>"}},{"id":"bsp1j84x","type":"figure","props":{"slot":"bsp1j84x__slot","src":"","fit":"cover","size":"full","title":"","caption":"","credit":""}}]},{"id":"bo4le222","type":"statblock","props":{"variant":"rule","columns":3,"stats":[{"value":"","unit":"","label":"Efeitos na gestão contemporânea","description":"\u003cspan data-fs=\"body\">Se, no regime das sesmarias, a manutenção do domínio estava associada ao efetivo aproveitamento da terra, a Lei de Terras passou a privilegiar sua \u003cb>transmissão mediante compra ou sucessão\u003c/b>. A partir desse momento histórico, ganhou relevo a preocupação estatal em identificar \u003cmark>quais áreas permaneceram integrando o patrimônio público e quais foram legitimamente incorporadas ao patrimônio privado\u003c/mark>, circunstância que explica por que inúmeros processos relacionados à caracterização patrimonial continuam exigindo a compreensão das informações produzidas sob a vigência dessa legislação.\u003c/span>"}]}}]},{"id":"b_mt1lq4lm_1cjg","type":"sectionslide","props":{"width":"content","surface":"page","pad":"lg"},"children":[{"id":"bujzlyuz","type":"kicker","props":{"icon":"gallery-vertical-end","children":"De 1824 aos dias de hoje"}},{"id":"b_mt1lq4lm_ye2i","type":"titulo","props":{"text":"Marcos constituicionais","level":"h3"}},{"id":"b_mt1lq4lm_75g3","type":"prose","props":{"html":"\u003cp>As sucessivas Constituições brasileiras contribuíram para a conformação do modelo contemporâneo de patrimônio público.\u003c/p>"}},{"id":"bpd1gd6g","type":"statblock","props":{"variant":"rule","columns":4,"stats":[{"value":"","unit":"\u003cspan data-fs=\"body-lg\">1824\u003c/span>","label":"","description":"\u003cp>A \u003cb>Constituição de 1824\u003c/b> refletia a concepção patrimonial predominante em seu tempo, caracterizada pela \u003cmark>centralização\u003c/mark> político-administrativa inerente ao período imperial e pela \u003cmark>reduzida preocupação com limitações sociais\u003c/mark> ao exercício do direito de propriedade.\u003c/p>\u003cp>\u003cbr>\u003c/p>"},{"value":"","unit":"\u003cspan data-fs=\"body-lg\">1891\u003c/span>","label":"","description":"\u003cp>Com a \u003cb>Constituição Republicana de 1891\u003c/b>, o federalismo passou a produzir importantes reflexos sobre a \u003cmark>repartição patrimonial entre os entes federativos\u003c/mark>, circunstância que continua sendo particularmente relevante para a compreensão do patrimônio imobiliário público brasileiro.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>"},{"value":"","unit":"\u003cspan data-fs=\"body-lg\">1934 \u003cspan style=\"font-weight: normal;\">e\u003c/span> 1946\u003c/span>","label":"","description":"\u003cp>Nas décadas seguintes, as transformações constitucionais passaram a atribuir novos contornos ao direito de propriedade. \u003cb>A Constituição de 1934\u003c/b> já anunciava que esse direito não poderia ser exercido em oposição ao\u003cmark> interesse social ou coletivo\u003c/mark>, enquanto a \u003cb>Constituição de 1946\u003c/b> condicionou sua utilização ao \u003cmark>bem-estar social\u003c/mark>.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>"},{"value":"","unit":"\u003cspan data-fs=\"body-lg\">1967 \u003cspan style=\"font-weight: normal;\">e\u003c/span> 1988\u003c/span>","label":"","description":"Posteriormente, a \u003cb>Constituição de 1967\u003c/b> inaugurou a utilização formal da expressão \"\u003cmark>função social da propriedade\u003c/mark>\" como princípio da ordem econômica, concepção posteriormente aprofundada pela \u003cb>Constituição da República de 1988\u003c/b>, que atribuiu especial relevo às \u003cmark>responsabilidades sociais, econômicas e ambientais\u003c/mark> inerentes ao exercício desse direito."}]}}]}]},{"id":"b_mt1lna1u_dmpi","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"bfsjwr4f","type":"callout","props":{"variant":"ear","tone":"attention","icon":"external-link","title":"","heading":"","children":"\u003cp>Os aspectos históricos aqui apresentados possuem caráter introdutório e destinam-se a contextualizar os processos contemporâneos de caracterização patrimonial. Para um estudo mais aprofundado sobre a formação do território e da propriedade pública no Brasil, recomenda-se a leitura dos materiais da competência \"Formação do território e da propriedade no Brasil\", integrante do Eixo 1 deste Programa de Aprendizagem.\u003c/p>","color":""}},{"id":"b_mt1lna1u_qiw0","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Para o presente estudo, importa saber que\u003cmark data-hl=\"petrol\"> essas transformações produziram reflexos profundos sobre a compreensão contemporânea do patrimônio público\u003c/mark>. Mais do que um conjunto de ativos pertencentes ao Estado, o patrimônio imobiliário passou a ser compreendido como instrumento voltado à implementação de políticas públicas e à promoção do interesse coletivo.\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Paralelamente à evolução histórica e normativa, também os instrumentos administrativos empregados pelo Estado para reconhecer seus imóveis foram sendo progressivamente aperfeiçoados. Cadastros imobiliários, registros públicos, documentos administrativos e informações territoriais constituem ferramentas complementares para a produção do conhecimento patrimonial e para a tomada de decisões relacionadas à gestão dos imóveis públicos.\u003c/span>\u003c/p>"}},{"id":"bj4gg3d0","type":"figure","props":{"slot":"bj4gg3d0__slot","src":"","fit":"contain","size":"full","title":"","caption":"","credit":""}},{"id":"b_mt1lna1u_7qgc","type":"callout","props":{"variant":"ear","tone":"info","icon":"lightbulb","title":"Reforçando","heading":"","children":"\u003cp>Os atuais procedimentos de caracterização patrimonial não surgiram de forma isolada. Eles representam o resultado de um longo processo de construção institucional destinado a permitir que o Estado conheça adequadamente o patrimônio sob sua responsabilidade.&nbsp;\u003c/p>"}}]},{"id":"b5fm5rih","type":"section","props":{"width":"content","surface":"none","pad":"lg"},"children":[{"id":"cm7tg8li","type":"titulo","props":{"text":"Conceitos fundamentais para o reconhecimento de imóveis públicos","level":"h2"}},{"id":"ckuf1gyf","type":"prose","props":{"html":"\u003cp>Sabemos, agora, que reconhecer um imóvel público não significa apenas localizá-lo no território, identificá-lo em um cadastro governamental ou verificar a existência de um registro imobiliário. Essas informações são relevantes, mas representam apenas parte do conhecimento patrimonial necessário para que o Estado possa individualizar determinado bem e exercer sua gestão.\u003c/p>"}},{"id":"b61a11di","type":"callout","props":{"variant":"header","tone":"info","icon":"lightbulb","title":"REFLITA","heading":"","children":"\u003cp>\u003cspan data-fs=\"body-lg\">Quais informações o Estado precisa conhecer para reconhecer adequadamente um imóvel público?\u003c/span>\u003c/p>"}},{"id":"b_mss2kpni_h221","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">A resposta não se limita à identificação de sua localização ou de seu titular. O reconhecimento patrimonial pressupõe a integração de informações relacionadas à origem do domínio, à natureza jurídica do bem, às suas características territoriais, ao regime jurídico aplicável e aos elementos administrativos que permitam sua individualização perante os demais bens integrantes do patrimônio estatal.\u003c/span>\u003c/p>"}},{"id":"bv0aeeb3","type":"datatable","props":{"caption":"O Estado precisa conhecer","columns":[{"key":"c0","label":"O QUÊ"},{"key":"c1","label":"PARA QUÊ"}],"rows":[{"c0":"Origem do domínio","c1":"Compreender como o imóvel passou a integrar o patrimônio público."},{"c0":"Natureza jurídica","c1":"Identificar o regime jurídico aplicável ao bem."},{"c0":"Localização e limites","c1":"Individualizar fisicamente o imóvel."},{"c0":"Categoria patrimonial","c1":"Definir o procedimento de caracterização mais adequado."},{"c0":"Situação registral","c1":"Verificar a publicidade e a individualização perante terceiros, quando cabível."},{"c0":"Informações administrativas","c1":"Subsidiar decisões de incorporação, destinação, regularização e gestão."}],"dense":false,"highlightFirst":false,"striped":true,"tone":"terra","className":"spu-table-wrap--striped spu-table-wrap--tone-terra"}},{"id":"bo7cgfsn","type":"prose","props":{"html":"\u003cp>\u003cmark data-hl=\"petrol\">Esse conjunto de informações constitui o conhecimento patrimonial minimamente necessário para que o imóvel possa ser reconhecido, incorporado e posteriormente destinado pelo ente público. \u003c/mark>Com isso em mente, podemos avançar em alguns conceitos fundamentais relacionados ao patrimônio público e à caracterização patrimonial.\u003c/p>\u003cp>O primeiro deles consiste em compreender que \u003cb>nem todo bem integrante do patrimônio estatal corresponde a um imóvel\u003c/b>. Em sentido amplo, o patrimônio público é composto por um conjunto heterogêneo de bens e direitos pertencentes às pessoas jurídicas de direito público, dentre os quais se encontram os bens imóveis.\u003c/p>"}},{"id":"b3g4iwcx","type":"markerlist","props":{"variant":"icon","icon":"circle-question-mark","accent":"var(--terra-600)","items":[{"title":"\u003cspan style=\"font-weight: normal;\">Todavia, reconhecer que determinado bem possui natureza imobiliária ainda não responde à pergunta:&nbsp;\u003c/span>","text":"\u003cspan data-fs=\"body-lg\">\u003cb>\u003ci>o que o torna integrante do patrimônio público?\u003c/i>\u003c/b>\u003c/span>"}]}},{"id":"b_mt1ndg7j_gi99","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">À primeira vista, pode parecer que um imóvel público corresponde simplesmente a um terreno ou edificação pertencente ao Estado. Embora intuitiva, essa compreensão é insuficiente diante da diversidade de bens que integram o patrimônio imobiliário público brasileiro (que compreende, entre outros, terras, praias, manguezais e águas públicas).\u003c/span>\u003c/p>\u003cp>Em sentido amplo, podemos compreender um “\u003cb>bem\u003c/b>” como \u003cmark>toda utilidade material ou imaterial suscetível de integrar determinada relação jurídica\u003c/mark>. Os \u003cb>imóveis\u003c/b> constituem apenas uma das espécies desse gênero mais amplo, caracterizando-se, em linhas gerais, pela \u003cmark>impossibilidade de remoção sem alteração da sua substância ou destinação econômica e jurídica\u003c/mark>.&nbsp;\u003c/p>"}},{"id":"bcybrt1b","type":"pullquote","props":{"variant":"block","fontSize":"auto","children":"\u003ci>Os \u003cb>bens imóveis públicos\u003c/b> correspondem àqueles pertencentes às pessoas jurídicas de direito público interno e submetidos ao regime jurídico que lhes é próprio.\u003c/i>\u003cp>\u003cspan data-fs=\"body\" style=\"\">\u003cspan data-font=\"body\">\u003cbr>Essa é definição adotada pelo Código Civil. Porém, a doutrina e a jurisprudência frequentemente ampliam esse conceito para abranger também imóveis pertencentes a pessoas jurídicas de direito privado quando afetados diretamente à prestação de serviços públicos.\u003c/span>\u003c/span>\u003c/p>","cite":""}},{"id":"bax5wsvj","type":"callout","props":{"variant":"header","tone":"info","icon":"lightbulb","title":"Você sabia?","heading":"","children":"\u003cp>Ainda que essas definições pareçam elementares, elas ajudam a desconstruir \u003cb>duas compreensões equivocadas\u003c/b> frequentemente associadas ao patrimônio público:\u003c/p>\u003cp>\u003cul>\u003cli>\u003cb>Erro 1\u003c/b>: reduzir o imóvel público à sua dimensão física, como se sua compreensão se limitasse à identificação do terreno ou da edificação que o compõe.\u003c/li>\u003cli>\u003cb>Erro 2\u003c/b>: a falsa percepção de que todos os imóveis pertencentes ao Estado apresentam características patrimoniais semelhantes. Em realidade, os bens integrantes do patrimônio imobiliário público possuem origens históricas, características territoriais e disciplinas jurídicas distintas, circunstância que explica por que sua caracterização pressupõe a produção de informações patrimoniais igualmente diversas.\u003c/li>\u003c/ul>\u003c/p>"}},{"id":"b_mt1ouwb7_cefy","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">É justamente nesse contexto que o conceito de \u003c/span>\u003cb style=\"text-wrap-mode: initial;\">caracterização patrimonial \u003c/b>\u003cspan style=\"text-wrap-mode: initial;\">se faz relevante\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">. Associá-la exclusivamente à produção de informações cadastrais relacionadas aos imóveis públicos é uma\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">&nbsp;compreensão demasiadamente restritiva do fenômeno.&nbsp;\u003c/span>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cbr>\u003c/span>\u003c/p>"}},{"id":"bi5yu93j","type":"callout","props":{"variant":"ear","tone":"attention","icon":"lightbulb","title":"Mais do que um procedimento formal de levantamento físico-cadastral","heading":"","children":"\u003cp>\u003cb>Caracterizar patrimonialmente um imóvel\u003c/b> significa produzir, organizar e interpretar as informações necessárias ao seu adequado reconhecimento pelo Estado. Constitui importante instrumento para compreender sua formação histórica, individualizar suas características patrimoniais e subsidiar futuras decisões relacionadas à incorporação e gestão dos bens públicos.\u003c/p>"}},{"id":"bz8gkhz2","type":"prose","props":{"html":"\u003cp>Avancemos agora para uma visão mais técnica da caracterização patrimonial e focada nos bens adquiridos diretamente por força da lei. P\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">ara delimitar o imóvel público a ser incorporado ao patrimônio da pessoa política (União, Estado ou Município), embora não exista uma uniformização nacional de nomenclaturas, costuma-se fazer uso de um dos três procedimentos a seguir: \u003c/span>\u003cb style=\"text-wrap-mode: initial;\">demarcação\u003c/b>\u003cspan style=\"text-wrap-mode: initial;\">,\u003c/span>\u003cb style=\"text-wrap-mode: initial;\"> discriminação \u003c/b>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">ou\u003c/span>\u003cb style=\"text-wrap-mode: initial;\"> identificação direta.\u003c/b>\u003c/p>"}},{"id":"b4pj3x7c","type":"contentslider","props":{"hint":"procedimentos","accent":"","showTabNumbers":false,"slides":[{"showImage":false,"slot":"b4pj3x7c__slides_1_slot","alt":"","caption":"","labelIcon":"land-plot","label":"","tabLabel":"Demarcação","title":"\u003cspan data-fs=\"h4\">\u003cspan data-fs=\"h3\">Demarcação\u003c/span>\u003c/span> ","subtitle":"","description":"A demarcação é um conjunto de procedimentos técnico-administrativos para levantamento dos limites e das dimensões das áreas de domínio público, a partir da fixação de marcos espaciais definidos na legislação. É o caso dos bens públicos que são posicionados no território a partir de linhas demarcatórias, como os terrenos de marinha.","linkHref":"","linkLabel":""},{"showImage":false,"slot":"c_xuo9owu__imageSlot","alt":"","caption":"","labelIcon":"notebook-text","label":"","tabLabel":"Discriminação","title":"\u003cspan data-fs=\"h3\">Discriminação\u003c/span>","subtitle":"","description":"A discriminação corresponde ao conjunto de procedimentos técnico-administrativos para separar as terras públicas das particulares, verificando a legitimidade dos títulos de domínio particular. Esse procedimento é utilizado quando existe a sobreposição de títulos privados com áreas de domínio público, como geralmente ocorre no caso das terras devolutas.\u003cbr>","linkHref":"","linkLabel":""},{"showImage":false,"slot":"c_doso31g__imageSlot","alt":"","caption":"","labelIcon":"parasol","label":"","tabLabel":"Identificação","title":"\u003cspan data-fs=\"h4\">\u003cspan data-fs=\"h3\">Identificação direta\u003c/span>\u003c/span>","subtitle":"","description":"A identificação direta consiste no conjunto de procedimentos técnico-administrativos para o reconhecimento de áreas cuja natureza pública demonstra-se mais aparente, especialmente protegidas pela legislação, como as praias, as águas públicas e os mangues.\u003cbr>","linkHref":"","linkLabel":""}]}},{"id":"bid38gm0","type":"kicker","props":{"icon":"download","children":"INCORPORAÇÃO"}},{"id":"b_mss2umwc_trfo","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">\u003cb>Incorporação patrimonial\u003c/b> é&nbsp;o processo de ingresso formal do imóvel ao patrimônio do Estado. Assim como os demais, ela não se resume à criação de um número de cadastro perante o sistema governamental ou à simples lavratura de um termo de incorporação.\u003c/span>\u003c/p>"}},{"id":"b4lwx6ni","type":"callout","props":{"variant":"header","tone":"warning","icon":"alert-triangle","title":"Incorporação patrimonial x incorporação imobiliária","heading":"","children":"\u003cp>A incorporação patrimonial aqui tratada não se confunde com a denominada “incorporação imobiliária”, instituto próprio do Direito Privado disciplinado pela Lei nº 4.591, de 16 de dezembro de 1964, voltado à construção e comercialização antecipada de unidades autônomas integrantes de edificações ou conjuntos imobiliários.&nbsp;\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Enquanto a \u003cb>incorporação imobiliária\u003c/b> possui natureza eminentemente negocial e se relaciona à atividade econômica desenvolvida no mercado imobiliário, a \u003cb>incorporação patrimonial\u003c/b>&nbsp;se refere ao conjunto de procedimentos destinados ao ingresso formal de determinado imóvel no patrimônio público, permitindo ao Estado reconhecê-lo, individualizá-lo e produzir as informações necessárias à sua gestão.\u003c/span>\u003c/p>","color":""}},{"id":"b_mt1njnio_xbhk","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial;\">Para incorporar um imóvel ao patrimônio público, ele \u003cmark>precisa ser reconhecido como uma unidade autônoma dos demais bens públicos\u003c/mark>\u003c/span>\u003cspan style=\"color: inherit; text-wrap-mode: initial;\">, além de ser juridicamente conhecido por terceiros – o que leva a necessidade de individualizá-lo e registrá-lo no cartório competente. A exceção são as áreas públicas insuscetíveis de registro, seja por sua natureza ou pela impossibilidade de apropriação, como é o caso das praias e dos espelhos d’água.\u003c/span>\u003c/p>\u003cp>Perceba que as informações produzidas durante os processos de caracterização e incorporação patrimonial não possuem utilidade meramente descritiva ou cadastral.&nbsp;\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">Ao contrário, constituem importante instrumento para subsidiar futuras decisões relacionadas à destinação, regularização e gestão dos imóveis públicos. \u003c/span>\u003cspan style=\"text-wrap-mode: initial;\">\u003cmark>Quanto maior for a qualidade do conhecimento produzido sobre determinado bem, maiores serão as possibilidades de sua utilização em benefício do interesse coletivo\u003c/mark>.\u003c/span>\u003c/p>\u003cp>Essa preocupação se torna ainda mais relevante quando reconhecemos que \u003cmark>os imóveis públicos desempenham múltiplas funções na contemporaneidade\u003c/mark>. Mais do que representar ativos integrantes do patrimônio estatal, eles podem viabilizar políticas habitacionais, apoiar a proteção ambiental, contribuir para o ordenamento territorial e permitir a prestação de serviços públicos essenciais. \u003c/p>\u003cp>Justamente por desempenharem funções tão diversas, a caracterização e a incorporação patrimonial constituem pressupostos indispensáveis para que os imóveis públicos possam ser utilizados em conformidade com os interesses coletivos que justificam sua existência.\u003c/p>"}}]},{"id":"b2u1i2bf","type":"section","props":{"width":"content","surface":"warm","pad":"lg"},"children":[{"id":"cy0e8bno","type":"titulo","props":{"text":"O reconhecimento patrimonial como fundamento da gestão dos bens públicos","level":"h2"}},{"id":"cgwx5y0n","type":"prose","props":{"html":"\u003cp>Até aqui, você já pôde perceber que o reconhecimento dos imóveis públicos não decorre exclusivamente da existência de um registro imobiliário, de um cadastro governamental ou da simples identificação física de determinada área. Trata-se de&nbsp;\u003c/p>"}},{"id":"bzmjuc5s","type":"pullquote","props":{"variant":"block","fontSize":"body-lg","children":"\u003ci>um processo contínuo de produção do conhecimento patrimonial, construído a partir da integração de informações históricas, jurídicas, territoriais e administrativas que permitem ao Estado individualizar seus bens e compreender as características que orientam sua gestão.\u003c/i>","cite":""}},{"id":"b_mt1nza0d_awtl","type":"prose","props":{"html":"\u003cp>\u003cspan style=\"text-wrap-mode: initial; color: inherit;\">É por isso que a história do patrimônio público brasileiro continua desempenhando papel relevante na atuação cotidiana dos gestores patrimoniais. As categorias jurídicas atualmente empregadas para caracterizar os imóveis públicos, os critérios utilizados para diferenciá-los do patrimônio privado e diversos instrumentos administrativos de gestão resultam de um processo histórico que continua produzindo efeitos sobre as decisões administrativas tomadas no presente.\u003c/span>\u003c/p>\u003cp>Da mesma forma, os procedimentos de caracterização patrimonial examinados ao longo deste conteúdo evidenciam que reconhecer um imóvel público significa produzir conhecimento qualificado sobre determinado bem. A demarcação, a discriminação e a identificação direta não constituem meras etapas procedimentais, mas instrumentos voltados à obtenção das informações necessárias para individualizar o imóvel, compreender sua natureza patrimonial e subsidiar sua incorporação, regularização, destinação e gestão.\u003c/p>\u003cp>Com essa visão, a caracterização patrimonial deixa de ser compreendida como uma atividade predominantemente cadastral para assumir papel estratégico na administração do patrimônio público. Quanto mais consistente for o conhecimento produzido sobre determinado imóvel, maiores serão as condições de utilizá-lo de forma segura, eficiente e compatível com o interesse público.\u003c/p>"}}]},{"id":"bidig8ea","type":"conclusion","props":{"kicker":"Para fechar","kickerIcon":"check","title":"Síntese","body":"\u003cp>Reconhecer um imóvel público significa compreender sua trajetória histórica, sua natureza jurídica, suas características territoriais e seu regime patrimonial, produzindo o conhecimento necessário para que o Estado possa decidir, com segurança e eficiência, sobre sua incorporação, destinação e gestão. É justamente essa produção qualificada que transforma a caracterização dos imóveis públicos em uma atividade essencial para a administração do patrimônio público e para a efetiva implementação das políticas públicas que dele dependam.\u003c/p>"},"children":[{"id":"bot7pvi8","type":"accordion","props":{"numbered":false,"items":[{"title":"Referências bibliográficas","content":"\u003cp>\u003ci>Livros, artigos e documentos institucionais\u003c/i>\u003c/p>\u003cp>1. MOURA, Jéssica Morais de. \u003cb>Patrimônio imobiliário público brasileiro: panorama histórico e situação atual de uso e ocupação.\u003c/b> In: ENCONTRO NACIONAL DA ASSOCIAÇÃO NACIONAL DE PÓS-GRADUAÇÃO E PESQUISA EM PLANEJAMENTO URBANO E REGIONAL (ENANPUR), 19., 2022, Belém, PA. Anais... Belém, PA: ANPUR, 2022. Disponível em: \u003ca href=\"https://www.sisgeenco.com.br/anais/enanpur/2022/arquivos/GT10_SEM_944_659_20211215235501.pdf\">https://www.sisgeenco.com.br/anais/enanpur/2022/arquivos/GT10_SEM_944_659_20211215235501.pdf\u003c/a>. Acesso em: 23 mai. 2026.\u003c/p>\u003cp>2. LEAL, Suely Maria Ribeiro; BORGES, Jennifer dos Santos. \u003cb>O patrimônio da União como recurso público a serviço do desenvolvimento urbano: entre o planejamento inclusivo e a governança empreendedora.\u003c/b> In: CONFERÊNCIA DO DESENVOLVIMENTO (CODE), 2., 2011, Brasília, DF. Anais... Brasília, DF: Instituto de Pesquisa Econômica Aplicada (IPEA), 2011. Disponível em: \u003ca href=\"https://www.ipea.gov.br/code2011/chamada2011/pdf/area7/area7-artigo8.pdf?utm_source=chatgpt.com\">https://www.ipea.gov.br/code2011/chamada2011/pdf/area7/area7-artigo8.pdf.\u003c/a> Acesso em: 30 mai. 2026.\u003c/p>\u003cp>3. CAMPANHOLE, Adriano; CAMPANHOLE, Hilton Lobo. \u003cb>Constituições do Brasil – compilação e atualização dos textos, notas, revisão e índices.\u003c/b> 12 ed. São Paulo: Atlas, 1998.\u003c/p>\u003cp>4. BONAVIDES, Paulo. \u003cb>Curso de Direito Constitucional.\u003c/b> 32. ed., atual. São Paulo: Malheiros, 2017.\u003c/p>\u003cp>5. SILVA, José Afonso da. \u003cb>Curso de Direito Constitucional.\u003c/b> 37 ed., rev., atual. São Paulo: Malheiros, 2014.\u003c/p>\u003cp>6. TARTUCE, Flávio. \u003cb>Direito Civil:\u003c/b> Lei de introdução e parte geral. 15. ed. São Paulo: Revista dos Tribunais, 2019.\u003c/p>\u003cp>7. AVVAD, Pedro Elias. \u003cb>Direito imobiliário\u003c/b>: teoria geral e negócios imobiliários. 4. ed. rev., atual. e ampl. Rio de Janeiro: Forense, 2014.\u003c/p>\u003cp>8. BRASIL. Ministério do Planejamento, Orçamento e Gestão. Secretaria do Patrimônio da União. \u003cb>Manual de regularização fundiária em terras da União. \u003c/b>São Paulo: Instituto Pólis; Brasília, DF: Ministério do Planejamento, Orçamento e Gestão, 2006. Disponível em:\u003ca href=\"https://memoria-spu.gestao.gov.br/wp-content/uploads/tainacan-items/78359/376876/Manual_regularizacao_fundiaria_terras_uniao_2006-2.pdf\"> https://memoria-spu.gestao.gov.br/wp-content/uploads/tainacan-items/78359/376876/Manual_regularizacao_fundiaria_terras_uniao_2006-2.pdf.\u003c/a> Acesso em: 7 jul. 2026. \u003c/p>\u003cp>\u003ci>\u003cb>Legislação\u003c/b>\u003c/i>\u003c/p>\u003cp>1. BRASIL. \u003cb>Constituição Política do Império do Brazil (de 25 de março de 1824)\u003c/b>. Manda observar a Constituição Política do Império, oferecida e jurada por Sua Majestade o Imperador. Rio de Janeiro, RJ, 1824. Disponível em: \u003ca href=\"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao24.htm\">https://www.planalto.gov.br/ccivil_03/constituicao/constituicao24.htm\u003c/a>. Acesso em: 18 jul. 2026.\u003c/p>\u003cp>2. BRASIL. \u003cb>Lei nº 601, de 18 de setembro de 1850 (Lei de Terras)\u003c/b>. Rio de Janeiro, RJ, 1850. Disponível em: \u003ca href=\"https://www.planalto.gov.br/ccivil_03/leis/lim/lim601.htm\">https://www.planalto.gov.br/ccivil_03/leis/lim/lim601.htm\u003c/a>. Acesso em: 20 jul. 2026.\u003c/p>\u003cp>3. BRASIL. \u003cb>Constituição da República dos Estados Unidos do Brasil (de 24 de fevereiro de 1891)\u003c/b>. Rio de Janeiro, RJ, 1891. Disponível em: \u003ca href=\"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao91.htm\">https://www.planalto.gov.br/ccivil_03/constituicao/constituicao91.htm\u003c/a>. Acesso em: 18 jul. 2026.\u003c/p>\u003cp>4. BRASIL. \u003cb>Constituição da República dos Estados Unidos do Brasil (de 16 de julho de 1934)\u003c/b>. Rio de Janeiro, RJ, 1934. Disponível em: \u003ca href=\"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao34.htm\">https://www.planalto.gov.br/ccivil_03/constituicao/constituicao34.htm\u003c/a>. Acesso em: 18 jul. 2026.\u003c/p>\u003cp>5. BRASIL. \u003cb>Constituição dos Estados Unidos do Brasil (de 18 de setembro de 1946). \u003c/b>Rio de Janeiro, RJ, 1946. Disponível em: \u003ca href=\"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao46.htm\">https://www.planalto.gov.br/ccivil_03/constituicao/constituicao46.htm\u003c/a>. Acesso em: 19 jul. 2026.\u003c/p>\u003cp>6. BRASIL. \u003cb>Lei nº 4.591, de 16 de dezembro de 1964 (Lei das Inco     (blocks || []).forEach(function (block) {
      visit(block);
      if (block.children) walkBlocks(block.children, visit);
    });
  }
  function QuizAnswerKey(props) {
    var keys = [];
    walkBlocks(props.doc && props.doc.blocks, function (block) {
      if (block.type !== 'quiz') return;
      var questions = block.props && block.props.questions || [];
      questions.forEach(function (q) {
        var idx = (q.options || []).findIndex(function (o) { return !!o.correct; });
        if (idx >= 0) keys.push(LETTERS[idx] || String(idx + 1));
      });
    });
    if (!keys.length) return null;
    return React.createElement('section', { className: 'spu-print-answer-key' },
      React.createElement('p', { className: 'spu-print-answer-key__title' }, 'Gabarito'),
      React.createElement('ol', null, keys.map(function (k, i) {
        return React.createElement('li', { key: i }, k);
      }))
    );
  }
  function start(tries){
    var NS = window[Object.keys(window).filter(function(k){return /DesignSystem/.test(k);})[0]];
    if (!NS || !NS.BlockDocument) { if(tries>0) return setTimeout(function(){start(tries-1);},50);
      document.getElementById('root').textContent = 'Kit do design system não carregado.'; return; }
    if (window.__SPU_INSTALL_DS_COMPAT) window.__SPU_INSTALL_DS_COMPAT(NS);
    var lucideIcons = JSON.parse(document.getElementById('spu-lucide-icons').textContent || '{}');
    if (NS.ICONS) Object.assign(NS.ICONS, lucideIcons);
    if (Array.isArray(NS.ICON_NAMES)) Object.keys(lucideIcons).forEach(function(name){
      if (NS.ICON_NAMES.indexOf(name) < 0) NS.ICON_NAMES.push(name);
    });
    var doc = JSON.parse(document.getElementById('spu-doc').textContent);
    var children = [React.createElement(NS.BlockDocument, { key: 'doc', doc: doc, mode: 'preview', showBuilderCredit: true })];
    if (false) {
      children.push(React.createElement(QuizAnswerKey, { key: 'quiz-key', doc: doc }));
      if ((!doc.meta || doc.meta.builderCredit !== false) && NS.BuilderCredit) {
        children.push(React.createElement(NS.BuilderCredit, { key: 'builder-credit' }));
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { className: '' }, children));
    setTimeout(function(){ if(window.__SPU_ENHANCE_GLOSSARY) window.__SPU_ENHANCE_GLOSSARY(); }, 80);
    
  }
  start(40);
})();
</script>
<script>
(function(){
  var popById = {};
  var positionById = {};
  var nextId = 1;
  function safeDefinition(value){
    var box = document.createElement('div');
    box.innerHTML = String(value || '');
    var allowed = ['STRONG','B','EM','I','BR','P','SPAN'];
    Array.from(box.querySelectorAll('*')).forEach(function(el){
      if(el.tagName === 'SCRIPT' || el.tagName === 'STYLE'){ el.remove(); return; }
      if(allowed.indexOf(el.tagName) < 0){ el.replaceWith.apply(el, Array.from(el.childNodes)); return; }
      Array.from(el.attributes).forEach(function(attr){ el.removeAttribute(attr.name); });
    });
    return box.innerHTML;
  }
  function closeAll(except){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      if(el !== except){
        el.classList.remove('spu-term-open');
        el.setAttribute('aria-expanded','false');
        var pop = popById[el.dataset.spuTermPortalId];
        if(pop) pop.classList.remove('is-open');
      }
    });
  }
  function enhance(){
    document.querySelectorAll('.spu-richtext [data-term]').forEach(function(el){
      if(el.dataset.spuTermReady) return;
      var term = (el.getAttribute('data-term') || el.textContent || '').trim();
      var def = (el.getAttribute('data-definition') || el.getAttribute('title') || el.getAttribute('data-def') || '').trim();
      if(!term || !def) return;
      el.dataset.spuTermReady = '1';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-expanded','false');
      el.setAttribute('data-definition',def);
      el.removeAttribute('title');
      var id = 'spu-term-' + nextId++;
      el.dataset.spuTermPortalId = id;
      var pop = document.createElement('span');
      pop.className = 'spu-term-pop';
      pop.setAttribute('role','tooltip');
      pop.innerHTML = '<strong></strong><span class="spu-term-pop__def"></span>';
      pop.querySelector('strong').textContent = term;
      pop.querySelector('.spu-term-pop__def').innerHTML = safeDefinition(def);
      document.body.appendChild(pop);
      popById[id] = pop;
      var position = function(){
        var rect = el.getBoundingClientRect();
        var width = Math.min(320, window.innerWidth - 24);
        var left = Math.min(Math.max(12, rect.left), window.innerWidth - width - 12);
        var below = rect.top < 150 && window.innerHeight - rect.bottom > rect.top;
        var arrow = Math.min(Math.max(18, rect.left + rect.width / 2 - left), width - 18);
        pop.style.left = left + 'px';
        pop.style.width = width + 'px';
        pop.style.top = below ? rect.bottom + 10 + 'px' : 'auto';
        pop.style.bottom = below ? 'auto' : window.innerHeight - rect.top + 10 + 'px';
        pop.style.setProperty('--spu-term-arrow',arrow + 'px');
        pop.dataset.placement = below ? 'bottom' : 'top';
      };
      positionById[id] = position;
      var toggle = function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        var open = el.classList.toggle('spu-term-open');
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        pop.classList.toggle('is-open',open);
        if(open){ closeAll(el); position(); }
      };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ toggle(ev); }
        if(ev.key === 'Escape'){ closeAll(); }
      });
    });
  }
  document.addEventListener('click', function(){ closeAll(); });
  function repositionOpen(){
    document.querySelectorAll('.spu-term-open').forEach(function(el){
      var position = positionById[el.dataset.spuTermPortalId];
      if(position) position();
    });
  }
  window.addEventListener('resize',repositionOpen);
  window.addEventListener('scroll',repositionOpen,true);
  enhance();
  window.__SPU_ENHANCE_GLOSSARY = enhance;
})();</script>
</body>
</html>
